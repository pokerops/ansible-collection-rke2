---
name: components
on:
  pull_request:
    branches:
      - master
    paths:
      - "*"
      - "!README.md"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  components:
    name: components
    runs-on: libvirt
    strategy:
      matrix:
        scenario:
          - components
        image:
          - https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      MOLECULE_OUTPUT_DIR: /tmp/logs
    steps:
      - name: Run devbox tests
        uses: pokerops/ansible-utils@master
        with:
          run: >
            just
            --set MOLECULE_SCENARIO ${{ matrix.scenario }}
            --set MOLECULE_KVM_IMAGE ${{ matrix.image }}
            --set MOLECULE_REVISION ${{ github.head_ref || github.ref_name }}
            requirements test

      - name: Upload install logs
        uses: actions/upload-artifact@v7
        with:
          name: install-${{ matrix.scenario }}-${{ matrix.image.distro }}.log
          path: |
            /tmp/logs/*
          if-no-files-found: ignore
        if: always()

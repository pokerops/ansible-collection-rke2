---
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml
driver:
  name: default
platforms:
  - name: rke2-${MOLECULE_SCENARIO_NAME}-server-01
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 4
    mem: 8
    groups:
      - rke2_server
  - name: rke2-${MOLECULE_SCENARIO_NAME}-agent-01
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 2
    mem: 8
    groups:
      - rke2_agent
  - name: rke2-${MOLECULE_SCENARIO_NAME}-agent-02
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 2
    mem: 8
    groups:
      - rke2_agent
provisioner:
  name: ansible
  playbooks:
    create: ../common/libvirt.yml
    prepare: ../common/prepare.yml
    converge: ../common/install.yml
    side_effect: ../common/monitoring.yml
    destroy: ../common/destroy.yml
    verify: ../common/verify/monitoring.yml
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      callback_whitelist: profile_tasks, timer, yaml
  inventory:
    links:
      group_vars: ../common/group_vars
      hosts: ./hosts.yml
  logging_events:
    - name: json
      lines:
        - '{"level":"warning","msg":"volume nearly full","volume":"data","usage":91}'
      expect:
        log_format: json
        level: warn
        msg: volume nearly full
        log.volume: data
        log.usage: 91
    - name: java-stack-trace
      lines:
        - "2026-01-01 00:00:00 ERROR Probe:1 - Reconciliation failed"
        - "java.lang.IllegalStateException: boom"
        - "\tat io.example.Probe.run(Probe.java:10)"
        - "Caused by: java.io.IOException: nope"
        - "\t... 3 more"
      expect:
        log_format: text
        level: error
        msg: "Probe:1 - Reconciliation failed\n\
          java.lang.IllegalStateException: boom\n\
          \tat io.example.Probe.run(Probe.java:10)\n\
          Caused by: java.io.IOException: nope\n\
          \t... 3 more"
    - name: frr
      lines:
        - "2026/10/24 02:20:41.890 notifications: BGP: [M7Q4P-46WDR] vty[23]@> enable"
      expect:
        log_format: text
        level: info
        msg: vty[23]@> enable
        log.daemon: BGP
        log.id: M7Q4P-46WDR
    - name: python-logging
      lines:
        - "2026-10-24 01:00:00,123  INFO: Loading Config object from vtysh show running"
      expect:
        log_format: text
        level: info
        msg: Loading Config object from vtysh show running
    - name: logfmt-process-prefix
      lines:
        - >-
          [pvc-0000-r-21cdfbed] time="2026-10-24T01:01:11.129Z" level=warning
          msg="Failed to write" func="dataconn.(*Server).write" file="server.go:141"
      expect:
        log_format: logfmt
        level: warn
        msg: Failed to write
        log.process: pvc-0000-r-21cdfbed
        log.func: dataconn.(*Server).write
    - name: http-access
      lines:
        - >-
          10.42.0.12 - - [24/Oct/2026:01:00:00 +0000]
          "POST /v1/volumes/pvc-0000?action=attach HTTP/1.1" 500 120 "" "Go-http-client/1.1"
      expect:
        log_format: text
        level: error
        msg: POST /v1/volumes/pvc-0000?action=attach 500
        log.status: 500
  # Read by ../common/verify/logging.yml ("Verify workload logs carry real
  # levels"): each filter selects one component's events in the local log
  # store, of which at most max_unknown_ratio (default 0) may be at level
  # unknown; time (default 1d) and min_events (default 1) are optional. A
  # filter on log_format:="json" also catches a component falling back to
  # text: none of its events match any more.
  logging_workloads:
    # Kubernetes' components with logging-format=json (playbooks/cluster.yml)
    - name: kube-apiserver
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="kube-apiserver" log_format:="json"'
    - name: kube-controller-manager
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="kube-controller-manager" log_format:="json"'
    - name: kube-scheduler
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="kube-scheduler" log_format:="json"'
    - name: kube-proxy
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="kube-proxy" log_format:="json"'
    - name: kubelet
      filter: 'unit:="kubelet" log_format:="json"'
    - name: etcd
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="etcd" log_format:="json"'
    - name: metrics-server
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="metrics-server" log_format:="json"'
    # Cilium's logOptions (argocd/cilium/hubble.yml)
    - name: cilium-agent
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="cilium-agent" log_format:="json"'
    - name: cilium-operator
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="cilium-operator" log_format:="json"'
    - name: hubble-relay
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="hubble-relay" log_format:="json"'
    - name: argocd-application-controller
      filter: 'kubernetes.pod_namespace:="argocd" kubernetes.container_name:="application-controller"'
    - name: cert-manager-controller
      filter: 'kubernetes.container_name:="cert-manager-controller"'
    - name: vector-agent
      filter: 'kubernetes.container_name:="vector-agent"'
    - name: reflector
      filter: 'kubernetes.pod_namespace:="kube-system" kubernetes.container_name:="reflector"'
    - name: strimzi-cluster-operator
      filter: 'kubernetes.container_name:="strimzi-cluster-operator"'
    # tgtd's and go-iscsi-helper's lines carry no level
    - name: longhorn-instance-manager
      filter: 'kubernetes.pod_namespace:="longhorn-system" kubernetes.container_name:="instance-manager"'
      max_unknown_ratio: 0.1
    # the entrypoint's "Starting Redis Server" and the shutdown notice
    - name: argocd-redis
      filter: 'kubernetes.pod_namespace:="argocd" kubernetes.container_name:="redis"'
      max_unknown_ratio: 0.1
verifier:
  name: ansible
scenario:
  create_sequence:
    - dependency
    - create
  prepare_sequence:
    - prepare
  converge_sequence:
    - converge
  destroy_sequence:
    - destroy
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - side_effect
    - verify

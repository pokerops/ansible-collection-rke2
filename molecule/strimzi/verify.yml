---
- name: Verify Velero backup and restore for Strimzi Kafka (KRaft + NodePools)
  hosts: localhost
  gather_facts: true
  vars:
    kafka_namespace: "{{ molecule_namespace | default('molecule') }}"
    kafka_cluster_name: "molecule-kafka-cluster"
    topic_name: "test-topic"
    message_count: 10
    test_message: "Hello from Ansible"
    backup_name: "molecule-kafka-backup-{{ ansible_date_time.epoch }}"
    restore_name: "molecule-kafka-restore-{{ ansible_date_time.epoch }}"
    kubeconfig_path: "{{ molecule_local_kubeconfig }}"
    kafka_operator_namespace: "strimzi"
    kafka_image: "quay.io/strimzi/kafka:0.45.0-kafka-3.9.0"
    strimzi_deployment_name: "strimzi-cluster-operator"
  tasks:
    - name: Test Strimzi Velero backup and restore
      block:
        - name: Delete existing Kafka deployment
          block:
            - name: Delete Kafka topic
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                api_version: kafka.strimzi.io/v1beta2
                kind: KafkaTopic
                name: "{{ topic_name }}"
                namespace: "{{ kafka_namespace }}"
                wait: true
                wait_timeout: 300

            - name: Delete Kafka cluster
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                api_version: kafka.strimzi.io/v1beta2
                kind: Kafka
                name: "{{ kafka_cluster_name }}"
                namespace: "{{ kafka_namespace }}"
                wait: true
                wait_timeout: 300

            - name: Delete brokers KafkaNodePool
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                api_version: kafka.strimzi.io/v1beta2
                kind: KafkaNodePool
                name: "{{ kafka_cluster_name }}-brokers"
                namespace: "{{ kafka_namespace }}"
                wait: true
                wait_timeout: 300

            - name: Delete controllers KafkaNodePool
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                api_version: kafka.strimzi.io/v1beta2
                kind: KafkaNodePool
                name: "{{ kafka_cluster_name }}-controllers"
                namespace: "{{ kafka_namespace }}"
                wait: true
                wait_timeout: 300

            - name: Wait for pod deletion to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: Pod
                namespace: "{{ kafka_namespace }}"
              register: existing_pods
              until: existing_pods.resources | length == 0
              retries: 30
              delay: 10

            - name: Query existing PVCs
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                namespace: "{{ kafka_namespace }}"
              register: _pvc_query

            - name: Force delete existing PVCs
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                name: "{{ item }}"
                namespace: "{{ kafka_namespace }}"
                state: absent
              loop: "{{ _pvc_query.resources | map(attribute='metadata.name') }}"

            - name: Wait for PVC deletion to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                namespace: "{{ kafka_namespace }}"
              register: pvc_check
              until: pvc_check.resources | length == 0
              retries: 30
              delay: 10

        - name: Create Kafka test namespace
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: present
            name: "{{ kafka_namespace }}"
            api_version: v1
            kind: Namespace

        - name: Deploy Kafka cluster
          block:
            - name: Wait until Strimzi operator pods ready
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: Pod
                namespace: "{{ kafka_operator_namespace }}"
              register: operator_pods
              until:
                operator_pods.resources[0].status.containerStatuses[0].ready is defined and
                operator_pods.resources[0].status.containerStatuses[0].ready == true
              retries: 60
              delay: 15

            - name: Deploy controllers KafkaNodePool
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: present
                definition:
                  apiVersion: kafka.strimzi.io/v1beta2
                  kind: KafkaNodePool
                  metadata:
                    name: "{{ kafka_cluster_name }}-controllers"
                    namespace: "{{ kafka_namespace }}"
                    labels:
                      strimzi.io/cluster: "{{ kafka_cluster_name }}"
                    annotations:
                      strimzi.io/next-node-ids: "[1]"
                  spec:
                    replicas: 1
                    roles:
                      - controller
                    storage:
                      type: persistent-claim
                      size: 2Gi
                      deleteClaim: true
                      class: longhorn-static

            - name: Deploy brokers KafkaNodePool
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: present
                definition:
                  apiVersion: kafka.strimzi.io/v1beta2
                  kind: KafkaNodePool
                  metadata:
                    name: "{{ kafka_cluster_name }}-brokers"
                    namespace: "{{ kafka_namespace }}"
                    labels:
                      strimzi.io/cluster: "{{ kafka_cluster_name }}"
                    annotations:
                      strimzi.io/next-node-ids: "[0]"
                  spec:
                    replicas: 1
                    roles:
                      - broker
                    storage:
                      type: persistent-claim
                      size: 2Gi
                      deleteClaim: true
                      class: longhorn-static

            - name: Deploy Kafka cluster in KRaft mode
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: present
                definition:
                  apiVersion: kafka.strimzi.io/v1beta2
                  kind: Kafka
                  metadata:
                    name: "{{ kafka_cluster_name }}"
                    namespace: "{{ kafka_namespace }}"
                    annotations:
                      strimzi.io/node-pools: enabled
                      strimzi.io/kraft: enabled
                  spec:
                    kafka:
                      version: 3.9.0
                      listeners:
                        - name: plain
                          port: 9092
                          type: internal
                          tls: false
                        - name: tls
                          port: 9093
                          type: internal
                          tls: true
                        - name: external
                          port: 9094
                          type: loadbalancer
                          tls: false
                          configuration:
                            bootstrap:
                              annotations:
                                metallb.io/address-pool: metallb-private
                            brokers:
                              - broker: 0
                                annotations:
                                  metallb.io/address-pool: metallb-private
                      config:
                        offsets.topic.replication.factor: 1
                        transaction.state.log.replication.factor: 1
                        transaction.state.log.min.isr: 1
                        auto.create.topics.enable: false
                        log.retention.ms: 3600
                        log.segment.bytes: 1073741824
                        delete.topic.enable: true
                        num.partitions: 1
                        default.replication.factor: 1
                        min.insync.replicas: 1
                    entityOperator:
                      topicOperator: {}
                      userOperator: {}
                    kafkaExporter:
                      topicRegex: ".*"
                      groupRegex: ".*"

            - name: Wait for Kafka cluster to be ready
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: kafka.strimzi.io/v1beta2
                kind: Kafka
                name: "{{ kafka_cluster_name }}"
                namespace: "{{ kafka_namespace }}"
              register: kafka_status
              until:
                - kafka_status.resources | length > 0
                - kafka_status.resources[0].status.clusterId is defined
                - kafka_status.resources[0].status.conditions[0].type == "Ready"
                - kafka_status.resources[0].status.conditions[0].status == "True"
              retries: 60
              delay: 15

            - name: Capture original Kafka clusterId
              ansible.builtin.set_fact:
                original_cluster_id: "{{ kafka_status.resources[0].status.clusterId }}"

            - name: Display detected clusterId
              ansible.builtin.debug:
                msg: "Original Kafka clusterId: {{ original_cluster_id }}"

            - name: Wait for Kafka bootstrap LoadBalancer to get external IP
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: Service
                namespace: "{{ kafka_namespace }}"
                name: "{{ kafka_cluster_name }}-kafka-external-bootstrap"
              register: kafka_bootstrap_svc
              until:
                kafka_bootstrap_svc.resources[0].status.loadBalancer.ingress is defined and
                kafka_bootstrap_svc.resources[0].status.loadBalancer.ingress[0].ip is defined
              retries: 30
              delay: 10

            - name: Debug bootstrap LoadBalancer IP
              ansible.builtin.debug:
                msg: "Kafka bootstrap external IP: {{ kafka_bootstrap_svc.resources[0].status.loadBalancer.ingress[0].ip }}"

            - name: Wait for each Kafka broker LoadBalancer to get external IP
              vars:
                broker_ids: [0]
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: Service
                namespace: "{{ kafka_namespace }}"
                name: "{{ kafka_cluster_name }}-{{ kafka_cluster_name }}-brokers-{{ item }}"
              register: kafka_broker_svc
              until:
                kafka_broker_svc.resources[0].status.loadBalancer.ingress is defined and
                kafka_broker_svc.resources[0].status.loadBalancer.ingress[0].ip is defined
              retries: 30
              delay: 10
              loop: "{{ broker_ids }}"
              loop_control:
                label: "broker-{{ item }}"

            - name: Show broker external IPs
              ansible.builtin.debug:
                msg: "Broker {{ item.item }} external IP: {{ item.resources[0].status.loadBalancer.ingress[0].ip }}"
              loop: "{{ kafka_broker_svc.results }}"
              loop_control:
                label: "broker-{{ item.item }}"

        - name: Create KafkaTopic
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: kafka.strimzi.io/v1beta2
              kind: KafkaTopic
              metadata:
                name: "{{ topic_name }}"
                namespace: "{{ kafka_namespace }}"
                labels:
                  strimzi.io/cluster: "{{ kafka_cluster_name }}"
              spec:
                config:
                  retention.ms: 259200000
                  segment.ms: 86400000
            state: present
            wait: true
            wait_timeout: 300

        - name: Wait for KafkaTopic creation
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: kafka.strimzi.io/v1beta2
            kind: KafkaTopic
            name: "{{ topic_name }}"
            namespace: "{{ kafka_namespace }}"
          register: topic_info
          until: topic_info.resources | length > 0
          retries: 20
          delay: 5

        - name: Produce messages
          block:
            - name: Produce {{ message_count }} test messages to Kafka topic {{ topic_name }}
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                definition:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: kafka-producer
                    namespace: "{{ kafka_namespace }}"
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: producer
                        image: "{{ kafka_image }}"
                        command: ["bash", "-c"]
                        args:
                          - |
                            for i in $(seq 1 {{ message_count }}); do
                              num=$(printf "%02d" $i)
                              echo "{{ test_message }}-${num}" | /opt/kafka/bin/kafka-console-producer.sh \
                                --broker-list {{ kafka_cluster_name }}-kafka-bootstrap:9092 \
                                --topic {{ topic_name }};
                              echo "Sent message ${num}";
                            done
              register: kafka_producer_pod
              changed_when: false

            - name: Wait until producer pod completes
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                kind: Pod
                namespace: "{{ kafka_namespace }}"
                name: kafka-producer
              register: producer_info
              until:
                producer_info.resources[0].status.containerStatuses[0].state.terminated.reason is defined and
                producer_info.resources[0].status.containerStatuses[0].state.terminated.reason == "Completed"
              retries: 30
              delay: 10
              changed_when: false

            - name: Delete Kafka producer pod
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                kind: Pod
                namespace: "{{ kafka_namespace }}"
                name: kafka-producer
              changed_when: false

        - name: Consume messages before backup
          block:
            - name: Consume messages before restore
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                definition:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: kafka-consumer-before-backup
                    namespace: "{{ kafka_namespace }}"
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: consumer
                        image: "{{ kafka_image }}"
                        command: ["bash", "-c"]
                        args:
                          - |
                            /opt/kafka/bin/kafka-console-consumer.sh \
                              --bootstrap-server {{ kafka_cluster_name }}-kafka-bootstrap:9092 \
                              --topic {{ topic_name }} \
                              --from-beginning \
                              --timeout-ms 10000
              register: consume_output_before
              changed_when: false

            - name: Wait until consumer pod completes
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                kind: Pod
                namespace: "{{ kafka_namespace }}"
                name: kafka-consumer-before-backup
              register: consumer_before_backup
              until:
                consumer_before_backup.resources[0].status.containerStatuses[0].state.terminated.reason is defined and
                consumer_before_backup.resources[0].status.containerStatuses[0].state.terminated.reason == "Completed"
              retries: 30
              delay: 10
              changed_when: false

            - name: Get Kafka consumer logs
              kubernetes.core.k8s_log:
                kubeconfig: "{{ kubeconfig_path }}"
                namespace: "{{ kafka_namespace }}"
                name: kafka-consumer-before-backup
                container: consumer
              register: consumer_output_before
              changed_when: false

            - name: Save messages before backup
              ansible.builtin.set_fact:
                kafka_messages_before_backup: >-
                  {{
                    consumer_output_before.log_lines
                    | select('search', 'Hello from Ansible')
                    | map('regex_replace', '^.*-(\\d+)$', '\\1|\\g<0>')
                    | list
                    | sort
                    | map('regex_replace', '^[0-9]+\\|', '')
                    | list
                  }}

            - name: Debug messages before backup
              ansible.builtin.debug:
                msg: "{{ kafka_messages_before_backup }}"

            - name: Delete Kafka consumer pod
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                kind: Pod
                namespace: "{{ kafka_namespace }}"
                name: kafka-consumer-before-backup
              changed_when: false

        - name: Create Velero backup
          block:
            - name: Create Velero backup of Kafka namespace
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: present
                definition:
                  apiVersion: velero.io/v1
                  kind: Backup
                  metadata:
                    name: "{{ backup_name }}"
                    namespace: velero
                    labels:
                      app.kubernetes.io/managed-by: ansible
                      backup.velero.io/type: kafka
                  spec:
                    includedNamespaces:
                      - "{{ kafka_namespace }}"
                    volumeSnapshotLocations: []
                    includeClusterResources: true
                    defaultVolumesToFsBackup: false
                    excludedResources: []
                    snapshotMoveData: true
                    storageLocation: "{{ rke2_velero_s3_storage }}"
                    csiSnapshotTimeout: 5m
                    itemOperationTimeout: 10m
                    ttl: "72h0m0s"

            - name: Wait for Velero backup to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: velero.io/v1
                kind: Backup
                name: "{{ backup_name }}"
                namespace: velero
              register: _backup_query
              until:
                - _backup_query.resources | length == 1
                - _backup_query.resources[0].status.phase is defined
                - _backup_query.resources[0].status.phase == "Completed"
              retries: 60
              delay: 15

            - name: Verify backup completed successfully
              ansible.builtin.assert:
                that: _backup_query.resources[0].status.phase == "Completed"
                fail_msg: >-
                  Backup failed with status: {{ _backup_query.resources[0].status.phase }}.
                  Errors: {{ _backup_query.resources[0].status.errors | default([]) }}
                  Warnings: {{ _backup_query.resources[0].status.warnings | default(0) }}
                success_msg: "Backup completed successfully"

            - name: Verify backup moved volume data to object storage
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: velero.io/v2alpha1
                kind: DataUpload
                namespace: velero
                label_selectors:
                  - "velero.io/backup-name={{ backup_name }}"
              register: _upload_query
              until:
                - _upload_query.resources | length > 0
                - _upload_query.resources
                  | selectattr('status.phase', 'defined')
                  | map(attribute='status.phase') | list
                  | reject('in', ['Completed', 'Failed', 'Canceled']) | list | length == 0
              retries: 30
              delay: 10

            - name: Assert backup DataUpload completed successfully
              ansible.builtin.assert:
                that:
                  - _upload_query.resources | length > 0
                  - _upload_query.resources
                    | selectattr('status.phase', 'equalto', 'Completed')
                    | list | length > 0
                fail_msg: No DataUpload completed for backup {{ backup_name }}

        - name: Destroy kafka cluster and PVCs
          block:
            - name: Delete Kafka topic
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                api_version: kafka.strimzi.io/v1beta2
                kind: KafkaTopic
                name: "{{ topic_name }}"
                namespace: "{{ kafka_namespace }}"
                wait: true
                wait_timeout: 300

            - name: Delete Kafka cluster
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                api_version: kafka.strimzi.io/v1beta2
                kind: Kafka
                name: "{{ kafka_cluster_name }}"
                namespace: "{{ kafka_namespace }}"
                wait: true
                wait_timeout: 300

            - name: Delete brokers KafkaNodePool
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                api_version: kafka.strimzi.io/v1beta2
                kind: KafkaNodePool
                name: "{{ kafka_cluster_name }}-brokers"
                namespace: "{{ kafka_namespace }}"
                wait: true
                wait_timeout: 300

            - name: Delete controllers KafkaNodePool
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                api_version: kafka.strimzi.io/v1beta2
                kind: KafkaNodePool
                name: "{{ kafka_cluster_name }}-controllers"
                namespace: "{{ kafka_namespace }}"
                wait: true
                wait_timeout: 300

            - name: Wait for pod deletion to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: Pod
                namespace: "{{ kafka_namespace }}"
              register: existing_pods
              until: existing_pods.resources | length == 0
              retries: 30
              delay: 10

            - name: Query existing PVCs
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                namespace: "{{ kafka_namespace }}"
              register: _pvc_query

            - name: Force delete existing PVCs
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                name: "{{ item }}"
                namespace: "{{ kafka_namespace }}"
                state: absent
              loop: "{{ _pvc_query.resources | map(attribute='metadata.name') }}"

            - name: Wait for PVC deletion to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                namespace: "{{ kafka_namespace }}"
              register: pvc_check
              until: pvc_check.resources | length == 0
              retries: 30
              delay: 10

        - name: Restore kafka
          block:
            - name: Disable ArgoCD auto-sync for Strimzi operator
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: patched
                api_version: argoproj.io/v1alpha1
                kind: Application
                name: strimzi-kafka-operator
                namespace: argocd
                definition:
                  spec:
                    syncPolicy:
                      automated:
                        enabled: false

            - name: Scale down Strimzi operator
              kubernetes.core.k8s_scale:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: apps/v1
                kind: Deployment
                name: strimzi-cluster-operator
                namespace: "{{ kafka_operator_namespace }}"
                replicas: 0
                wait: true
                wait_timeout: 120

            - name: Restore Kafka namespace from Velero backup (including status)
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: present
                definition:
                  apiVersion: velero.io/v1
                  kind: Restore
                  metadata:
                    name: "{{ restore_name }}"
                    namespace: velero
                    labels:
                      app.kubernetes.io/managed-by: ansible
                      restore.velero.io/backup: "{{ backup_name }}"
                  spec:
                    backupName: "{{ backup_name }}"
                    includedNamespaces:
                      - "{{ kafka_namespace }}"
                    restorePVs: true
                    includeClusterResources: true
                    includedResources:
                      - "*"
                    restoreStatus:
                      includedResources:
                        - "*"
                    existingResourcePolicy: update

            - name: Wait for Kafka restore to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: velero.io/v1
                kind: Restore
                name: "{{ restore_name }}"
                namespace: velero
              register: _restore_query
              until:
                - _restore_query.resources[0].status.phase is defined
                - _restore_query.resources[0].status.phase in ["Completed", "PartiallyFailed", "Failed", "FailedValidation"]
              retries: 60
              delay: 20

            - name: Verify restore completed successfully
              ansible.builtin.assert:
                that: _restore_query.resources[0].status.phase == "Completed"
                fail_msg: >-
                  Restore phase is {{ _restore_query.resources[0].status.phase }}.
                  Errors: {{ _restore_query.resources[0].status.errors | default('n/a') }}
                  Warnings: {{ _restore_query.resources[0].status.warnings | default('n/a') }}

            - name: Query restore DataDownloads
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: velero.io/v2alpha1
                kind: DataDownload
                namespace: velero
                label_selectors:
                  - "velero.io/restore-name={{ restore_name }}"
              register: _download_query
              until:
                - _download_query.resources | length > 0
                - _download_query.resources
                  | selectattr('status.phase', 'defined')
                  | map(attribute='status.phase') | list
                  | reject('in', ['Completed', 'Failed', 'Canceled']) | list | length == 0
              retries: 30
              delay: 10

            - name: Verify DataDownload completed successfully
              ansible.builtin.assert:
                that:
                  - _download_query.resources | length > 0
                  - _download_query.resources
                    | selectattr('status.phase', 'equalto', 'Completed')
                    | list | length > 0
                fail_msg: >-
                  No completed DataDownload for restore {{ restore_name }} — the PVCs may
                  have been recreated empty instead of restored from object storage.

            - name: Verify restored PVCs are bound
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                namespace: "{{ kafka_namespace }}"
              register: _restored_pvcs
              until:
                - _restored_pvcs.resources | length > 0
                - _restored_pvcs.resources
                  | rejectattr('status.phase', 'equalto', 'Bound')
                  | list | length == 0
              retries: 30
              delay: 10

            - name: Wait for Kafka cluster to be restored and ready
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: kafka.strimzi.io/v1beta2
                kind: Kafka
                name: "{{ kafka_cluster_name }}"
                namespace: "{{ kafka_namespace }}"
              register: restored_kafka
              until:
                - restored_kafka.resources | length > 0
                - restored_kafka.resources[0].status.conditions[0].status == "True"
              retries: 60
              delay: 15

            - name: Wait until all pods in {{ kafka_namespace }} are Running and Ready
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: Pod
                namespace: "{{ kafka_namespace }}"
              register: kafka_pods
              until: >
                ( kafka_pods.resources | length > 0 ) and
                ( kafka_pods.resources
                  | selectattr('status.phase', 'equalto', 'Running')
                  | list | length
                  == kafka_pods.resources | length
                ) and
                (
                  (
                    kafka_pods.resources
                    | map(attribute='status.containerStatuses')
                    | select('defined')
                    | list
                    | sum(start=[])
                  )
                  | selectattr('ready', 'equalto', true)
                  | list
                  | length
                ) ==
                (
                  (
                    kafka_pods.resources
                    | map(attribute='status.containerStatuses')
                    | select('defined')
                    | list
                    | sum(start=[])
                  )
                  | length
                )
              retries: 60
              delay: 15

            - name: Scale up Strimzi operator
              kubernetes.core.k8s_scale:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: apps/v1
                kind: Deployment
                name: strimzi-cluster-operator
                namespace: "{{ kafka_operator_namespace }}"
                replicas: 1
                wait: true
                wait_timeout: 120

            - name: Enable ArgoCD auto-sync for Strimzi operator
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: patched
                api_version: argoproj.io/v1alpha1
                kind: Application
                name: strimzi-kafka-operator
                namespace: argocd
                definition:
                  spec:
                    syncPolicy:
                      automated:
                        enabled: true

            - name: Wait for Strimzi to reconcile restored Kafka cluster
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: kafka.strimzi.io/v1beta2
                kind: Kafka
                name: "{{ kafka_cluster_name }}"
                namespace: "{{ kafka_namespace }}"
              register: restored_kafka
              until:
                - restored_kafka.resources | length > 0
                - restored_kafka.resources[0].status.clusterId is defined
                - restored_kafka.resources[0].status.conditions[0].type == "Ready"
                - restored_kafka.resources[0].status.conditions[0].status == "True"
              retries: 60
              delay: 15

            - name: Capture restored clusterId after reconciliation
              ansible.builtin.set_fact:
                restored_cluster_id: "{{ restored_kafka.resources[0].status.clusterId }}"

        - name: Assert clusterId consistency
          ansible.builtin.assert:
            that:
              - restored_cluster_id == original_cluster_id
            fail_msg: "Kafka clusterId mismatch after restore!"
            success_msg: "Kafka clusterId successfully preserved after restore."

        - name: Consume messages after restore
          block:
            - name: Consume messages after restore
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                definition:
                  apiVersion: v1
                  kind: Pod
                  metadata:
                    name: kafka-consumer-after-restore
                    namespace: "{{ kafka_namespace }}"
                  spec:
                    restartPolicy: Never
                    containers:
                      - name: consumer
                        image: "{{ kafka_image }}"
                        command: ["bash", "-c"]
                        args:
                          - |
                            /opt/kafka/bin/kafka-console-consumer.sh \
                              --bootstrap-server {{ kafka_cluster_name }}-kafka-bootstrap:9092 \
                              --topic {{ topic_name }} \
                              --from-beginning \
                              --timeout-ms 10000
              register: consume_output_after
              changed_when: false

            - name: Wait until consumer pod completes
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                kind: Pod
                namespace: "{{ kafka_namespace }}"
                name: kafka-consumer-after-restore
              register: consumer_after_restore
              until:
                consumer_after_restore.resources[0].status.containerStatuses[0].state.terminated.reason is defined and
                consumer_after_restore.resources[0].status.containerStatuses[0].state.terminated.reason == "Completed"
              retries: 30
              delay: 10
              changed_when: false

            - name: Get Kafka consumer logs
              kubernetes.core.k8s_log:
                kubeconfig: "{{ kubeconfig_path }}"
                namespace: "{{ kafka_namespace }}"
                name: kafka-consumer-after-restore
                container: consumer
              register: consumer_output_after
              changed_when: false

            - name: Debug Kafka consumer log output
              ansible.builtin.debug:
                var: consumer_output_after

            - name: Save messages after restore
              ansible.builtin.set_fact:
                kafka_messages_after_restore: >-
                  {{
                    consumer_output_after.log_lines
                    | select('search', 'Hello from Ansible')
                    | map('regex_replace', '^.*-(\\d+)$', '\\1|\\g<0>')
                    | list
                    | sort
                    | map('regex_replace', '^[0-9]+\\|', '')
                    | list
                  }}

            - name: Debug messages after restore
              ansible.builtin.debug:
                msg: "{{ kafka_messages_after_restore }}"

            - name: Delete Kafka consumer pod
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                state: absent
                kind: Pod
                namespace: "{{ kafka_namespace }}"
                name: kafka-consumer-after-restore
              changed_when: false

        - name: Debug backup messages
          ansible.builtin.debug:
            var: kafka_messages_before_backup

        - name: Debug restore messages
          ansible.builtin.debug:
            var: kafka_messages_after_restore

        - name: Display verification summary
          ansible.builtin.debug:
            msg: |
              Kafka (KRaft + NodePools) Velero Backup & Restore Verification Completed!
                - Backup: {{ backup_name }}
                - Restore: {{ restore_name }}
                - Cluster ID: {{ restored_cluster_id }}
                - Topic: {{ topic_name }}

        - name: Validate message recovery
          ansible.builtin.assert:
            that:
              - kafka_messages_before_backup == kafka_messages_after_restore
            fail_msg: "Messages are not the same after restore!"
            success_msg: "Messages successfully restored from backup."

      rescue:
        - name: Query Strimzi operator pods
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: "{{ kafka_operator_namespace }}"
          register: operator_pods
          retries: 60
          delay: 15

        - name: Debug Strimzi operator pods
          ansible.builtin.debug:
            msg: "{{ operator_pods }}"

        - name: Query Kafka clusters
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: kafka.strimzi.io/v1beta2
            kind: Kafka
            namespace: "{{ kafka_namespace }}"
          register: kafka_status
          retries: 60
          delay: 15

        - name: Debug Kafka clusters
          ansible.builtin.debug:
            msg: "{{ kafka_status }}"

        - name: Query Kafka NodePools
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: kafka.strimzi.io/v1beta2
            kind: KafkaNodePool
            namespace: "{{ kafka_namespace }}"
          register: kafkanodepool_status
          retries: 60
          delay: 15

        - name: Debug Kafka NodePools
          ansible.builtin.debug:
            msg: "{{ kafkanodepool_status }}"

        - name: Query Kafka topics
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: kafka.strimzi.io/v1beta2
            kind: KafkaTopic
            namespace: "{{ kafka_namespace }}"
          register: kafkatopic_status
          retries: 60
          delay: 15

        - name: Debug Kafka topic
          ansible.builtin.debug:
            msg: "{{ kafkatopic_status }}"

        - name: Query Kafka pods
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: "{{ kafka_namespace }}"
          register: kafka_pods
          retries: 60
          delay: 15

        - name: Debug Kafka pods
          ansible.builtin.debug:
            msg: "{{ kafka_pods }}"

        - name: Query Kafka PVCs
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ kafka_namespace }}"
          register: kafka_pvcs

        - name: Debug Kafka PVCs
          ansible.builtin.debug:
            msg: "{{ kafka_pvcs }}"

        - name: Query Velero backups
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v1
            kind: Backup
            namespace: velero
          register: _backup_query
          retries: 60
          delay: 15

        - name: Debug Velero backups
          ansible.builtin.debug:
            msg: "{{ _backup_query }}"

        - name: Query Velero restores
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v1
            kind: Restore
            namespace: velero
          register: _restore_query

        - name: Debug Velero restores
          ansible.builtin.debug:
            msg: "{{ _restore_query }}"

        - name: Query restore DataDownloads
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v2alpha1
            kind: DataDownload
          register: _download_query

        - name: Debug Velero DataDownloads
          ansible.builtin.debug:
            msg: "{{ _download_query }}"

        - name: Query backup DataUploads
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v2alpha1
            kind: DataUpload
            namespace: velero
          register: _upload_query

        - name: Debug backup DataUploads
          ansible.builtin.debug:
            msg: "{{ _upload_query }}"

        - name: Query VolumeSnapshotClasses
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: snapshot.storage.k8s.io/v1
            kind: VolumeSnapshotClass
          register: _vsc_query

        - name: Debug VolumeSnapshotClasses
          ansible.builtin.debug:
            msg: "{{ _vsc_query.resources | map(attribute='metadata') | list }}"

        - name: Query VolumeSnapshots
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: snapshot.storage.k8s.io/v1
            kind: VolumeSnapshot
            namespace: velero
          register: _vs_query

        - name: Debug VolumeSnapshots
          ansible.builtin.debug:
            msg: "{{ _vs_query }}"

        - name: Query VolumeSnapshotContents
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: snapshot.storage.k8s.io/v1
            kind: VolumeSnapshotContent
          register: _vscontent_query

        - name: Debug VolumeSnapshotContents
          ansible.builtin.debug:
            msg: "{{ _vscontent_query }}"

        - name: Query Velero node-agent pods
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: velero
            label_selectors:
              - "name=node-agent"
          register: _nodeagent_query

        - name: Debug Velero node-agent pods
          ansible.builtin.debug:
            msg: >-
              {{ _nodeagent_query.resources
                 | map(attribute='status.phase') | list }}

        - name: Query Velero server deployment
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: apps/v1
            kind: Deployment
            namespace: velero
            name: velero
          register: _velero_deploy

        - name: Debug Velero server args
          ansible.builtin.debug:
            msg: "{{ _arguments }}"
          vars:
            _deployments: "{{ _velero_deploy.resources }}"
            _containers: "{{ _deployments | map(attribute='spec.template.spec.containers') | flatten }}"
            _arguments: "{{ _containers | map(attribute='args') }}"

        - name: Query Velero server pod
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: velero
            label_selectors:
              - "name=velero"
          register: _velero_pod_query

        - name: Get Velero server logs
          kubernetes.core.k8s_log:
            kubeconfig: "{{ kubeconfig_path }}"
            namespace: velero
            name: "{{ _velero_pod_query.resources | map(attribute='metadata.name') | first }}"
            container: velero
          register: _velero_log
          when: _velero_pod_query.resources | length > 0

        - name: Debug Velero warning/snapshot log lines
          ansible.builtin.debug:
            msg: >-
              {{ _velero_log.log_lines | default([])
                 | select('search', 'level=warning|skip|snapshot|VolumeSnapshot') | list }}

        - name: Terminate playbook
          ansible.builtin.fail:
            msg: "backup verification failed"

    - name: Verify no workload pods are scheduled on server nodes
      block:
        - name: Query Strimzi pods
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: "{{ kafka_namespace }}"
          register: strimzi_pods

        - name: Verify no workload pods are scheduled
          ansible.builtin.assert:
            that: _strimzi_control_nodes | length == 0
            fail_msg: "Workload pods are scheduled on control plane node {{ _strimzi_control_nodes | join(', ') }}"
          vars:
            _strimzi_control_nodes: "{{ strimzi_pods.resources | map(attribute='spec.nodeName') | unique | intersect(groups['rke2_server']) }}"

---
- name: Verify Velero Zalando backup and restore
  hosts: localhost
  gather_facts: true
  vars:
    postgres_namespace: "{{ molecule_namespace | default('molecule') }}"
    postgres_cluster_name: "molecule-postgres-cluster"
    postgres_database_name: "pagila"
    postgres_service_name: "{{ postgres_cluster_name }}"
    postgres_service_port: 5432
    postgres_user: postgres
    backup_name: "molecule-backup-{{ ansible_date_time.epoch }}"
    restore_name: "molecule-restore-{{ ansible_date_time.epoch }}"
    kubeconfig_path: "{{ molecule_local_kubeconfig }}"
  tasks:
    - name: Test Zalando Velero backup and restore
      block:
        - name: Destroy PostgreSQL deployment
          block:
            - name: Delete existing PostgreSQL cluster gracefully
              block:
                - name: Delete PostgreSQL cluster
                  kubernetes.core.k8s:
                    kubeconfig: "{{ kubeconfig_path }}"
                    api_version: acid.zalan.do/v1
                    kind: postgresql
                    name: "{{ postgres_cluster_name }}"
                    namespace: "{{ postgres_namespace }}"
                    state: absent
                    wait: true
                    wait_timeout: 300

              rescue:
                - name: Remove finalizers from PostgreSQL cluster
                  kubernetes.core.k8s:
                    kubeconfig: "{{ kubeconfig_path }}"
                    api_version: acid.zalan.do/v1
                    kind: postgresql
                    name: "{{ postgres_cluster_name }}"
                    namespace: "{{ postgres_namespace }}"
                    definition:
                      metadata:
                        finalizers: []
                    state: present
                    merge_type: merge

                - name: Force delete PostgreSQL cluster
                  kubernetes.core.k8s:
                    kubeconfig: "{{ kubeconfig_path }}"
                    api_version: acid.zalan.do/v1
                    kind: postgresql
                    name: "{{ postgres_cluster_name }}"
                    namespace: "{{ postgres_namespace }}"
                    state: absent
                    wait: false

            - name: Query existing PVCs
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                namespace: "{{ postgres_namespace }}"
              register: _pvc_query

            - name: Force delete existing PVCs
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                name: "{{ item }}"
                namespace: "{{ postgres_namespace }}"
                state: absent
              loop: "{{ _pvc_query.resources | map(attribute='metadata.name') }}"

            - name: Wait for PVC deletion to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                namespace: "{{ postgres_namespace }}"
              register: _pvc_query
              until: _pvc_query.resources | length == 0
              retries: 30
              delay: 10

        - name: Create PostgreSQL test namespace
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            name: "{{ postgres_namespace }}"
            api_version: v1
            kind: Namespace
            state: present

        - name: Deploy PostgreSQL cluster with Zalando operator
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: acid.zalan.do/v1
              kind: postgresql
              metadata:
                name: "{{ postgres_cluster_name }}"
                namespace: "{{ postgres_namespace }}"
                labels:
                  team: molecule
                  environment: molecule
              spec:
                enableMasterLoadBalancer: true
                allowedSourceRanges:
                  - "0.0.0.0/0"
                masterServiceAnnotations:
                  metallb.universe.tf/address-pool: metallb-private
                teamId: "molecule"
                volume:
                  size: 2Gi
                  storageClass: longhorn-static
                numberOfInstances: 1
                postgresql:
                  version: "18"
                  parameters:
                    max_connections: "200"
                    shared_buffers: "256MB"
                    effective_cache_size: "1GB"
                    maintenance_work_mem: "64MB"
                    checkpoint_completion_target: "0.9"
                    wal_buffers: "16MB"
                    default_statistics_target: "100"
                    random_page_cost: "1.1"
                    effective_io_concurrency: "200"
                    listen_addresses: "'*'"
                patroni:
                  pg_hba:
                    - "host all all 0.0.0.0/0 md5"
                    - "host replication {{ postgres_user }} 0.0.0.0/0 md5"
                    - "local all all trust"
                    - "host all all 127.0.0.1/32 trust"
                    - "host all all ::1/128 trust"
                resources:
                  requests:
                    cpu: 100m
                    memory: 100Mi
                  limits:
                    cpu: 500m
                    memory: 500Mi
            state: present

        - name: Wait for PostgreSQL cluster to be created
          block:
            - name: Wait for PostgreSQL cluster to be ready
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: acid.zalan.do/v1
                kind: postgresql
                name: "{{ postgres_cluster_name }}"
                namespace: "{{ postgres_namespace }}"
              register: _cluster_query
              until:
                - _cluster_query.resources[0].status is defined
                - _cluster_query.resources[0].status.PostgresClusterStatus is defined
                - _cluster_query.resources[0].status.PostgresClusterStatus == "Running"
              retries: 60
              delay: 20

          rescue:
            - name: Debug PostgreSQL cluster startup failure
              ansible.builtin.debug:
                var: _cluster_query

            - name: Fail the playbook if PostgreSQL cluster is not ready
              ansible.builtin.fail:
                msg: "PostgreSQL cluster {{ postgres_cluster_name }} did not become ready before timeout."

        - name: Wait for LoadBalancer to get external IP
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Service
            name: "{{ postgres_cluster_name }}"
            namespace: "{{ postgres_namespace }}"
          register: _lb_query
          until:
            - _lb_query.resources[0].status.loadBalancer is defined
            - _lb_query.resources[0].status.loadBalancer.ingress is defined
            - _lb_query.resources[0].status.loadBalancer.ingress | length > 0
          retries: 30
          delay: 10

        - name: Get PostgreSQL LoadBalancer external IP
          ansible.builtin.set_fact:
            postgres_external_ip: "{{ _lb_query.resources[0].status.loadBalancer.ingress[0].ip }}"

        - name: Get PostgreSQL user password from secret
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Secret
            name: "{{ postgres_user }}.{{ postgres_cluster_name }}.credentials.postgresql.acid.zalan.do"
            namespace: "{{ postgres_namespace }}"
          register: _secret_query

        - name: Set PostgreSQL password from secret
          ansible.builtin.set_fact:
            postgres_password: "{{ _secret_query.resources[0].data.password | b64decode }}"

        - name: Create temporary directory for Pagila
          ansible.builtin.tempfile:
            state: directory
            suffix: pagila
          register: pagila_temp_dir
          changed_when: false

        - name: Download and prepare Pagila sample database
          block:
            - name: Download Pagila database
              ansible.builtin.git:
                repo: "https://github.com/devrimgunduz/pagila.git"
                dest: "{{ pagila_temp_dir.path }}/pagila"
                version: master
              changed_when: false

            - name: Wait for PostgreSQL connection to be ready
              community.postgresql.postgresql_ping:
                login_host: "{{ postgres_external_ip }}"
                login_port: "{{ postgres_service_port }}"
                login_user: "{{ postgres_user }}"
                login_password: "{{ postgres_password }}"
              register: _ping
              until: _ping is succeeded
              retries: 30
              delay: 10

            - name: Create Pagila database
              community.postgresql.postgresql_db:
                name: "{{ postgres_database_name }}"
                state: present
                login_host: "{{ postgres_external_ip }}"
                login_port: "{{ postgres_service_port }}"
                login_user: "{{ postgres_user }}"
                login_password: "{{ postgres_password }}"

            - name: Import Pagila schema
              ansible.builtin.command:
                cmd: >-
                  psql
                  --host={{ postgres_external_ip }}
                  --port={{ postgres_service_port }}
                  --username={{ postgres_user }}
                  --dbname={{ postgres_database_name }}
                  --set=ON_ERROR_STOP=on
                  --file={{ pagila_temp_dir.path }}/pagila/pagila-schema.sql
              environment:
                PGPASSWORD: "{{ postgres_password }}"
              changed_when: true

            - name: Import Pagila data
              ansible.builtin.command:
                cmd: >-
                  psql
                  --host={{ postgres_external_ip }}
                  --port={{ postgres_service_port }}
                  --username={{ postgres_user }}
                  --dbname={{ postgres_database_name }}
                  --set=ON_ERROR_STOP=on
                  --file={{ pagila_temp_dir.path }}/pagila/pagila-data.sql
              environment:
                PGPASSWORD: "{{ postgres_password }}"
              changed_when: true

          always:
            - name: Cleanup Pagila temporary files
              ansible.builtin.file:
                path: "{{ pagila_temp_dir.path }}"
                state: absent
              changed_when: false

        - name: Get list of tables in Pagila database
          community.postgresql.postgresql_query:
            login_db: "{{ postgres_database_name }}"
            login_host: "{{ postgres_external_ip }}"
            login_port: "{{ postgres_service_port }}"
            login_user: "{{ postgres_user }}"
            login_password: "{{ postgres_password }}"
            query: |
              SELECT table_name
              FROM information_schema.tables
              WHERE table_schema = 'public'
              ORDER BY table_name;
          register: _table_query

        - name: Store original table list as fact
          ansible.builtin.set_fact:
            original_pagila_tables: "{{ _table_query.query_result | map(attribute='table_name') | list | sort }}"

        - name: Get sample data count for verification
          community.postgresql.postgresql_query:
            login_db: "{{ postgres_database_name }}"
            login_host: "{{ postgres_external_ip }}"
            login_port: "{{ postgres_service_port }}"
            login_user: "{{ postgres_user }}"
            login_password: "{{ postgres_password }}"
            query: |
              SELECT
                'actor' as table_name, COUNT(*) as row_count FROM actor
              UNION ALL
              SELECT
                'film' as table_name, COUNT(*) as row_count FROM film
              UNION ALL
              SELECT
                'customer' as table_name, COUNT(*) as row_count FROM customer
              ORDER BY table_name;
          register: _data_query

        - name: Store original data counts as fact
          ansible.builtin.set_fact:
            original_pagila_data_counts: "{{ _data_query.query_result }}"

        - name: Display original table list and data counts
          ansible.builtin.debug:
            msg: |
              Original Pagila tables ({{ original_pagila_tables | length }} total):
              {{ original_pagila_tables | join(', ') }}

              Sample data counts:
              {% for count in original_pagila_data_counts %}
              - {{ count.table_name }}: {{ count.row_count }} rows
              {% endfor %}

        - name: Create Velero backup
          block:
            - name: Create Velero full cluster backup
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                definition:
                  apiVersion: velero.io/v1
                  kind: Backup
                  metadata:
                    name: "{{ backup_name }}"
                    namespace: velero
                    labels:
                      app.kubernetes.io/managed-by: ansible
                      backup.velero.io/type: molecule
                  spec:
                    includedNamespaces:
                      - "{{ postgres_namespace }}"
                    volumeSnapshotLocations: []
                    includeClusterResources: true
                    defaultVolumesToFsBackup: false
                    excludedResources: []
                    snapshotMoveData: true
                    storageLocation: "{{ rke2_velero_s3_storage }}"
                    csiSnapshotTimeout: 5m
                    itemOperationTimeout: 10m
                    ttl: "72h0m0s"
                state: present

            - name: Wait for backup to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: velero.io/v1
                kind: Backup
                name: "{{ backup_name }}"
                namespace: velero
              register: _backup_query
              until:
                - _backup_query.resources | length == 1
                - _backup_query.resources[0].status.phase is defined
                - _backup_query.resources[0].status.phase in ["Completed"]
              retries: 60
              delay: 10

        - name: Verify backup completed successfully
          ansible.builtin.assert:
            that: _backup_query.resources[0].status.phase == "Completed"
            fail_msg: |
              Backup failed with status: {{ _backup_query.resources[0].status.phase }}
              Errors: {{ _backup_query.resources[0].status.errors | default([]) }}
              Warnings: {{ _backup_query.resources[0].status.warnings | default(0) }}
            success_msg: "Backup completed successfully"

        - name: Verify backup moved volume data to object storage
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v2alpha1
            kind: DataUpload
            namespace: velero
            label_selectors:
              - "velero.io/backup-name={{ backup_name }}"
          register: _upload_query
          until:
            - _upload_query.resources | length > 0
            - _upload_query.resources
              | selectattr('status.phase', 'defined')
              | map(attribute='status.phase') | list
              | reject('in', ['Completed', 'Failed', 'Canceled']) | list | length == 0
          retries: 30
          delay: 10

        - name: Display backup completion details
          ansible.builtin.debug:
            msg: |
              Backup Status:
              - Name: {{ backup_name }}
              - Phase: {{ _backup_query.resources[0].status.phase }}
              - Start Time: {{ _backup_query.resources[0].status.startTimestamp }}
              - Completion Time: {{ _backup_query.resources[0].status.completionTimestamp }}
              - Items Backed Up: {{ _backup_query.resources[0].status.progress.itemsBackedUp | default(0) }}

        - name: Delete PostgreSQL cluster
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: acid.zalan.do/v1
            kind: postgresql
            name: "{{ postgres_cluster_name }}"
            namespace: "{{ postgres_namespace }}"
            state: absent
            wait: true
            wait_timeout: 300

        - name: Query existing PVCs
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ postgres_namespace }}"
          register: _pvc_query

        - name: Force delete existing PVCs
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            name: "{{ item }}"
            namespace: "{{ postgres_namespace }}"
            state: absent
          loop: "{{ _pvc_query.resources | map(attribute='metadata.name') }}"

        - name: Wait for PVC deletion to complete
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ postgres_namespace }}"
          register: _pvc_query
          until: _pvc_query.resources | length == 0
          retries: 30
          delay: 10

        - name: Scale down Postgres operator
          kubernetes.core.k8s_scale:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: apps/v1
            kind: Deployment
            name: postgres-operator
            namespace: postgres-operator
            replicas: 0
            wait: true
            wait_timeout: 120

        - name: Restore PostgreSQL database
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: velero.io/v1
              kind: Restore
              metadata:
                name: "{{ restore_name }}"
                namespace: velero
                labels:
                  app.kubernetes.io/managed-by: ansible
                  restore.velero.io/backup: "{{ backup_name }}"
              spec:
                backupName: "{{ backup_name }}"
                includedNamespaces:
                  - "{{ postgres_namespace }}"
                restorePVs: true
                includeClusterResources: false
                includedResources:
                  - persistentvolumeclaims
                  - secrets
                  - configmaps
                  - postgresqls.acid.zalan.do
                existingResourcePolicy: update
            state: present

        - name: Wait for CRD restore to complete
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v1
            kind: Restore
            name: "{{ restore_name }}"
            namespace: velero
          register: _restore_query
          until:
            - _restore_query.resources[0].status.phase is defined
            - _restore_query.resources[0].status.phase in ["Completed", "PartiallyFailed", "Failed", "FailedValidation"]
          retries: 30
          delay: 10

        - name: Verify restore completed successfully
          ansible.builtin.assert:
            that: _restore_query.resources[0].status.phase == "Completed"
            fail_msg: >-
              Restore phase is {{ _restore_query.resources[0].status.phase }}.
              Errors: {{ _restore_query.resources[0].status.errors | default('n/a') }}
              Warnings: {{ _restore_query.resources[0].status.warnings | default('n/a') }}

        - name: Query restore DataDownloads
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v2alpha1
            kind: DataDownload
            namespace: velero
            label_selectors:
              - "velero.io/restore-name={{ restore_name }}"
          register: _download_query
          until:
            - _download_query.resources | length > 0
            - _download_query.resources
              | selectattr('status.phase', 'defined')
              | map(attribute='status.phase') | list
              | reject('in', ['Completed', 'Failed', 'Canceled']) | list | length == 0
          retries: 30
          delay: 10

        - name: Verify DataDownload completed successfully
          ansible.builtin.assert:
            that:
              - _download_query.resources | length > 0
              - _download_query.resources
                | selectattr('status.phase', 'equalto', 'Completed')
                | list | length > 0
            fail_msg: >-
              No completed DataDownload for restore {{ restore_name }} — the PVC may
              have been recreated empty instead of restored from object storage.

        - name: Verify restored PVC is bound
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ postgres_namespace }}"
            name: "pgdata-{{ postgres_cluster_name }}-0"
          register: _pvc_query
          until:
            - _pvc_query.resources | length == 1
            - _pvc_query.resources[0].status.phase == "Bound"
          retries: 30
          delay: 10

        - name: Scale up postgres-operator
          kubernetes.core.k8s_scale:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: apps/v1
            kind: Deployment
            name: postgres-operator
            namespace: postgres-operator
            replicas: 1
            wait: true
            wait_timeout: 120

        - name: Wait for PostgreSQL cluster to be ready after restore
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: acid.zalan.do/v1
            kind: postgresql
            name: "{{ postgres_cluster_name }}"
            namespace: "{{ postgres_namespace }}"
          register: _postgresql_query
          until:
            - _postgresql_query.resources[0].status is defined
            - _postgresql_query.resources[0].status.PostgresClusterStatus is defined
            - _postgresql_query.resources[0].status.PostgresClusterStatus == "Running"
          retries: 60
          delay: 20

        - name: Get restored PostgreSQL LoadBalancer external IP
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Service
            name: "{{ postgres_cluster_name }}"
            namespace: "{{ postgres_namespace }}"
          register: _lb_service
          until:
            - _lb_service.resources[0].status.loadBalancer is defined
            - _lb_service.resources[0].status.loadBalancer.ingress is defined
            - _lb_service.resources[0].status.loadBalancer.ingress | length > 0
          retries: 30
          delay: 10

        - name: Set restored PostgreSQL facts
          ansible.builtin.set_fact:
            postgres_external_ip: "{{ _lb_service.resources[0].status.loadBalancer.ingress[0].ip }}"

        - name: Wait for restored PostgreSQL to be accessible
          ansible.builtin.wait_for:
            host: "{{ postgres_external_ip }}"
            port: "{{ postgres_service_port }}"
            timeout: 300

        - name: Get PostgreSQL user password from secret
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Secret
            name: "{{ postgres_user }}.{{ postgres_cluster_name }}.credentials.postgresql.acid.zalan.do"
            namespace: "{{ postgres_namespace }}"
          register: _secret_query

        - name: Set PostgreSQL password from secret
          ansible.builtin.set_fact:
            postgres_password: "{{ _secret_query.resources[0].data.password | b64decode }}"

        - name: Wait for PostgreSQL connection to be ready after restore
          community.postgresql.postgresql_ping:
            login_db: "{{ postgres_database_name }}"
            login_host: "{{ postgres_external_ip }}"
            login_port: "{{ postgres_service_port }}"
            login_user: "{{ postgres_user }}"
            login_password: "{{ postgres_password }}"
          register: _ping
          until: _ping is succeeded
          retries: 30
          delay: 10

        - name: Verify Pagila database exists after restore
          community.postgresql.postgresql_query:
            login_db: "{{ postgres_database_name }}"
            login_host: "{{ postgres_external_ip }}"
            login_port: "{{ postgres_service_port }}"
            login_user: "{{ postgres_user }}"
            login_password: "{{ postgres_password }}"
            query: "SELECT datname FROM pg_database WHERE datname = '{{ postgres_database_name }}'"
          register: _db_query

        - name: Assert Pagila database was restored
          assert:
            that:
              - _db_query.query_result | length > 0
            fail_msg: "Pagila database was not found after restore"
            success_msg: "Pagila database successfully restored"

        - name: Get list of tables in restored Pagila database
          community.postgresql.postgresql_query:
            login_db: "{{ postgres_database_name }}"
            login_host: "{{ postgres_external_ip }}"
            login_port: "{{ postgres_service_port }}"
            login_user: "{{ postgres_user }}"
            login_password: "{{ postgres_password }}"
            query: |
              SELECT table_name
              FROM information_schema.tables
              WHERE table_schema = 'public'
              ORDER BY table_name;
          register: _table_query

        - name: Store restored table list as fact
          ansible.builtin.set_fact:
            restored_pagila_tables: "{{ _table_query.query_result | map(attribute='table_name') | list | sort }}"

        - name: Get restored data counts for verification
          community.postgresql.postgresql_query:
            login_db: "{{ postgres_database_name }}"
            login_host: "{{ postgres_external_ip }}"
            login_port: "{{ postgres_service_port }}"
            login_user: "{{ postgres_user }}"
            login_password: "{{ postgres_password }}"
            query: |
              SELECT
                'actor' as table_name, COUNT(*) as row_count FROM actor
              UNION ALL
              SELECT
                'film' as table_name, COUNT(*) as row_count FROM film
              UNION ALL
              SELECT
                'customer' as table_name, COUNT(*) as row_count FROM customer
              ORDER BY table_name;
          register: _data_query

        - name: Store restored data counts as fact
          ansible.builtin.set_fact:
            restored_pagila_data_counts: "{{ _data_query.query_result }}"

        - name: Compare original and restored table lists
          assert:
            that:
              - original_pagila_tables == restored_pagila_tables
              - original_pagila_tables | length == restored_pagila_tables | length
            fail_msg: |
              Table mismatch detected!
              Original tables ({{ original_pagila_tables | length }}): {{ original_pagila_tables | join(', ') }}
              Restored tables ({{ restored_pagila_tables | length }}): {{ restored_pagila_tables | join(', ') }}
              Missing tables: {{ original_pagila_tables | difference(restored_pagila_tables) }}
              Extra tables: {{ restored_pagila_tables | difference(original_pagila_tables) }}
            success_msg: |
              Database restore verification successful!
              All {{ original_pagila_tables | length }} tables were successfully restored.

        - name: Compare original and restored data counts
          ansible.builtin.assert:
            that:
              - original_pagila_data_counts == restored_pagila_data_counts
            fail_msg: |
              Data count mismatch detected!
              Original counts: {{ original_pagila_data_counts }}
              Restored counts: {{ restored_pagila_data_counts }}
            success_msg: Data integrity verification successful!

        - name: Display verification results
          ansible.builtin.debug:
            msg: |
              Velero Backup and Restore Verification Completed Successfully!

              Summary:
              - Backup Name: {{ backup_name }}
              - Restore Name: {{ restore_name }}
              - Original PostgreSQL IP: {{ postgres_external_ip }}
              - Restored PostgreSQL IP: {{ postgres_external_ip }}
              - Database: {{ postgres_database_name }}
              - Tables Verified: {{ original_pagila_tables | length }}

              All verification tests passed!

      rescue:
        - name: Query PostgreSQL clusters
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: acid.zalan.do/v1
            kind: postgresql
            namespace: "{{ postgres_namespace }}"
          register: _cluster_query

        - name: Debug PostgreSQL clusters
          ansible.builtin.debug:
            msg: "{{ _cluster_query }}"

        - name: Query Velero backups
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v1
            kind: Backup
            namespace: velero
          register: _backup_query
          retries: 60
          delay: 15

        - name: Debug Velero backups
          ansible.builtin.debug:
            msg: "{{ _backup_query }}"

        - name: Query Velero restores
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v1
            kind: Restore
            namespace: velero
          register: _restore_query

        - name: Debug Velero restores
          ansible.builtin.debug:
            msg: "{{ _restore_query }}"

        - name: Query restore DataDownloads
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v2alpha1
            kind: DataDownload
          register: _download_query

        - name: Debug Velero DataDownloads
          ansible.builtin.debug:
            msg: "{{ _download_query }}"

        - name: Query backup DataUploads
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v2alpha1
            kind: DataUpload
            namespace: velero
          register: _upload_query

        - name: Debug backup DataUploads
          ansible.builtin.debug:
            msg: "{{ _upload_query }}"

        - name: Query VolumeSnapshotClasses
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: snapshot.storage.k8s.io/v1
            kind: VolumeSnapshotClass
          register: _vsc_query

        - name: Debug VolumeSnapshotClasses
          ansible.builtin.debug:
            msg: "{{ _vsc_query.resources | map(attribute='metadata') | list }}"

        - name: Query VolumeSnapshots
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: snapshot.storage.k8s.io/v1
            kind: VolumeSnapshot
            namespace: velero
          register: _vs_query

        - name: Debug VolumeSnapshots
          ansible.builtin.debug:
            msg: "{{ _vs_query }}"

        - name: Query VolumeSnapshotContents
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: snapshot.storage.k8s.io/v1
            kind: VolumeSnapshotContent
          register: _vscontent_query

        - name: Debug VolumeSnapshotContents
          ansible.builtin.debug:
            msg: "{{ _vscontent_query }}"

        - name: Query Velero node-agent pods
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: velero
            label_selectors:
              - "name=node-agent"
          register: _nodeagent_query

        - name: Debug Velero node-agent pods
          ansible.builtin.debug:
            msg: >-
              {{ _nodeagent_query.resources
                 | map(attribute='status.phase') | list }}

        - name: Query Velero server deployment
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: apps/v1
            kind: Deployment
            namespace: velero
            name: velero
          register: _velero_deploy

        - name: Debug Velero server args
          ansible.builtin.debug:
            msg: "{{ _arguments }}"
          vars:
            _deployments: "{{ _velero_deploy.resources }}"
            _containers: "{{ _deployments | map(attribute='spec.template.spec.containers') | flatten }}"
            _arguments: "{{ _containers | map(attribute='args') }}"

        - name: Query Velero server pod
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: velero
            label_selectors:
              - "name=velero"
          register: _velero_pod_query

        - name: Get Velero server logs
          kubernetes.core.k8s_log:
            kubeconfig: "{{ kubeconfig_path }}"
            namespace: velero
            name: "{{ _velero_pod_query.resources | map(attribute='metadata.name') | first }}"
            container: velero
          register: _velero_log
          when: _velero_pod_query.resources | length > 0

        - name: Debug Velero warning/snapshot log lines
          ansible.builtin.debug:
            msg: >-
              {{ _velero_log.log_lines | default([])
                 | select('search', 'level=warning|skip|snapshot|VolumeSnapshot') | list }}

        - name: Terminate playbook
          ansible.builtin.fail:
            msg: "backup verification failed"

---
dependency:
  name: galaxy
  options:
    role-file: requirements.yml
    requirements-file: requirements.yml
driver:
  name: default
platforms:
  - name: rke2-${MOLECULE_SCENARIO_NAME}-server-01
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 4
    mem: 8
    groups:
      - rke2_server
  - name: rke2-${MOLECULE_SCENARIO_NAME}-agent-01
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 2
    mem: 4
    groups:
      - rke2_agent
  - name: rke2-${MOLECULE_SCENARIO_NAME}-agent-02
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 2
    mem: 4
    groups:
      - rke2_agent
  - name: rke2-${MOLECULE_SCENARIO_NAME}-agent-03
    image: "${MOLECULE_KVM_IMAGE}"
    cpu: 2
    mem: 4
    groups:
      - rke2_agent
provisioner:
  name: ansible
  playbooks:
    create: ../common/libvirt.yml
    prepare: ../common/prepare.yml
    converge: ../common/bgp.yml
    destroy: ../common/destroy.yml
    side_effect: ../common/deploy.yml
    verify: ../common/verify/bgp.yml
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      callback_whitelist: profile_tasks, timer, yaml
  inventory:
    links:
      group_vars: ../common/group_vars
    hosts:
      all:
        vars:
          libvirt_network: molecule
          molecule_bgp_group: "rke2_agent"
          molecule_rke2_ingress_services: 2
          # Optional rke2 params
          rke2_nginx_controller_deploy: false
          rke2_argocd_ingress_class: traefik-private
          rke2_longhorn_ingress_class: traefik-private
          # Required rke2 params
          rke2_cluster_name: rke2.pokerops.net
          rke2_ippool_private: "172.16.16.0/24"
          rke2_ippool_public: "172.16.17.0/24"
          rke2_api_url: "https://api.{{ rke2_cluster_name }}:6443"
          rke2_token: "secret"
          # Test rke2 params
          rke2_argocd_apps_deploy: false
          rke2_metallb_mode: "bgp"
          rke2_metallb_bgp_asn: 64513
          rke2_skip_deploy: true
          rke2_longhorn_replica_count: 2
verifier:
  name: ansible
scenario:
  create_sequence:
    - dependency
    - create
  prepare_sequence:
    - prepare
  converge_sequence:
    - converge
  destroy_sequence:
    - destroy
  test_sequence:
    - dependency
    - create
    - prepare
    - converge
    - side_effect
    - verify

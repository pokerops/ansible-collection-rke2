---
- name: Verify cluster
  ansible.builtin.import_playbook: cluster.yml

- name: Verify monitoring pipeline
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    monitoring_namespace: monitoring
    monitoring_ingestor_selector: app=vector-ingestor
    monitoring_ingestor_file: /data/metrics.log
    monitoring_ingestor_logs_file: /data/logs.log
    monitoring_alloy_pod: alloy-0
    monitoring_cluster_id: "{{ rke2_cluster_name }}"
    monitoring_dropped_metric: container_tasks_state
    monitoring_settle_retries: 30
    monitoring_settle_delay: 10
  tasks:
    - name: Query ingestor pod
      kubernetes.core.k8s_info:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        kind: Pod
        namespace: "{{ monitoring_namespace }}"
        label_selectors:
          - "{{ monitoring_ingestor_selector }}"
        field_selectors:
          - status.phase=Running
      register: _ingestor_query
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until: _ingestor_query.resources | length > 0

    - name: Set ingestor facts
      ansible.builtin.set_fact:
        _ingestor_pod: "{{ _ingestor_query.resources | first | json_query('metadata.name') }}"

    - name: Wait for metrics to reach the ingestor
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- wc -l {{ monitoring_ingestor_file }}
      register: _received
      changed_when: false
      failed_when: false
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until:
        - _received.rc == 0
        - (_received.stdout.split() | first | int) > 0

    - name: Verify metrics are being delivered
      ansible.builtin.assert:
        that: (_received.stdout.split() | first | int) > 0
        fail_msg: >-
          No metrics reached the ingestor. Alloy is scraping but not delivering;
          check the remote_write endpoint path and Alloy logs for HTTP errors.
        success_msg: "Ingestor received {{ _received.stdout.split() | first }} events"

    - name: Wait for logs to reach the ingestor
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- wc -l {{ monitoring_ingestor_logs_file }}
      register: _received_logs
      changed_when: false
      failed_when: false
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until:
        - _received_logs.rc == 0
        - (_received_logs.stdout.split() | first | int) > 0

    - name: Verify logs are being delivered
      ansible.builtin.assert:
        that: (_received_logs.stdout.split() | first | int) > 0
        fail_msg: >-
          No logs reached the ingestor. Vector is running but not delivering;
          check the ClusterVectorPipeline sink address and the vector agent's
          logs for connection errors.
        success_msg: "Ingestor received {{ _received_logs.stdout.split() | first }} log lines"

    # kube-system always has running pods (coredns, etc.) in every scenario, so
    # this is a reliable, cheap proof that collection is not limited to the
    # pipeline's own namespace. A VectorPipeline (namespaced) is restricted by
    # the operator to its own namespace by default; only ClusterVectorPipeline
    # collects cluster-wide. Matches the exact JSON field, not a bare
    # substring, so an incidental mention elsewhere (e.g. kube-state-metrics
    # logging a watched resource's namespace) can't produce a false pass.
    - name: Wait for a non-monitoring namespace's logs to reach the ingestor
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- sh -c "grep -c '\"pod_namespace\":\"kube-system\"' {{ monitoring_ingestor_logs_file }} || true"
      register: _received_cross_namespace_logs
      changed_when: false
      failed_when: false
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until:
        - _received_cross_namespace_logs.rc == 0
        - (_received_cross_namespace_logs.stdout | trim | int) > 0

    - name: Verify log collection is not restricted to the agent's own namespace
      ansible.builtin.assert:
        that: (_received_cross_namespace_logs.stdout | trim | int) > 0
        fail_msg: >-
          No kube-system pod logs reached the ingestor although kube-system
          always has running pods. The logging pipeline is likely a namespaced
          VectorPipeline, which the operator restricts to its own namespace by
          default - it must be a ClusterVectorPipeline for cluster-wide
          collection.
        success_msg: >-
          Ingestor received {{ _received_cross_namespace_logs.stdout | trim }}
          log lines from kube-system

    - name: Wait for SeaweedFS logs cluster to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: seaweed.seaweedfs.com/v1
        kind: Seaweed
        name: logs
        namespace: seaweedfs-logs
      register: _seaweedfs_logs_cluster
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until:
        - _seaweedfs_logs_cluster.resources | length > 0
        - _seaweedfs_logs_cluster.resources[0].status.conditions | default([])
          | selectattr('type', 'equalto', 'Ready')
          | selectattr('status', 'equalto', 'True')
          | list | length > 0

    - name: Wait for SeaweedFS logs bucket to be ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: seaweed.seaweedfs.com/v1
        kind: Bucket
        name: logs
        namespace: seaweedfs-logs
      register: _seaweedfs_logs_bucket
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until:
        - _seaweedfs_logs_bucket.resources | length > 0
        - _seaweedfs_logs_bucket.resources[0].status.phase | default('') == 'Ready'

    - name: Query received events
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- sh -c "grep -c '{{ item.pattern }}' {{ monitoring_ingestor_file }} || true"
      register: _event_query
      changed_when: false
      loop:
        - { name: cluster_label, pattern: "{{ monitoring_cluster_id }}" }
        - { name: dropped_metric, pattern: "{{ monitoring_dropped_metric }}" }
      loop_control:
        label: "{{ item.name }}"

    - name: Set event count facts
      ansible.builtin.set_fact:
        _count_total: "{{ _received.stdout.split() | first | int }}"
        _count_labelled: "{{ _event_query.results[0].stdout | trim | int }}"
        _count_dropped: "{{ _event_query.results[1].stdout | trim | int }}"

    - name: Verify every event carries the cluster label
      ansible.builtin.assert:
        that: _count_labelled | int == _count_total | int
        fail_msg: >-
          {{ _count_labelled }} of {{ _count_total }} events carry
          cluster={{ monitoring_cluster_id }}. Unlabelled series collide with
          other clusters in the shared tenant and read as plausible data.
        success_msg: "All {{ _count_total }} events carry the cluster label"

    - name: Verify the cardinality drop list is applied
      ansible.builtin.assert:
        that: _count_dropped | int == 0
        fail_msg: >-
          {{ monitoring_dropped_metric }} reached the ingestor
          {{ _count_dropped }} times but is on the drop list; the
          metric_relabel rules are not being applied.
        success_msg: "{{ monitoring_dropped_metric }} correctly dropped"

    - name: Query Alloy for skipped monitors
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          logs -n {{ monitoring_namespace }} {{ monitoring_alloy_pod }}
          -c alloy --tail=2000
      register: _alloy_logs
      changed_when: false

    - name: Verify no monitor was silently skipped
      ansible.builtin.assert:
        that: _skipped | length == 0
        fail_msg: >-
          Alloy skipped {{ _skipped | length }} monitor(s), which produce no
          metrics and no failure: {{ _skipped | join(' | ') }}
        success_msg: "All ServiceMonitors and PodMonitors accepted by Alloy"
      vars:
        _skipped: >-
          {{ _alloy_logs.stdout_lines
             | select('search', 'error generating scrapeconfig')
             | list }}

    # A monitor whose selector matches nothing is accepted by Alloy and simply
    # produces no metrics, so the skipped-monitor check above cannot see it.
    # Namespace coverage catches the case a monitor scrapes nothing at all.
    # Monitors labelled optional select resources users create after deploy, so
    # emptiness carries no information: no Kafka clusters is a valid state, and
    # indistinguishable from a broken selector. Coverage for those comes from an
    # alert on the kube-state-metrics custom-resource-state series instead.
    - name: Query declared monitors
      kubernetes.core.k8s_info:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: monitoring.coreos.com/v1
        kind: "{{ item }}"
        label_selectors:
          - "pokerops.net/monitor-optional notin (true)"
      register: _monitor_query
      loop:
        - ServiceMonitor
        - PodMonitor

    - name: Query namespaces present in received metrics
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- sh -c "grep -o '\"namespace\":\"[^\"]*\"' {{ monitoring_ingestor_file }} | sort -u"
      register: _received_namespaces
      changed_when: false

    - name: Verify every monitor namespace is represented in received metrics
      ansible.builtin.assert:
        that: _unscraped | length == 0
        fail_msg: >-
          No metrics arrived from {{ _unscraped | join(', ') }}, which declare
          monitors. Their selectors match nothing, which Alloy reports as success.
        success_msg: "All {{ _declared | length }} monitor namespace(s) delivered metrics"
      vars:
        _declared: >-
          {{ _monitor_query.results | map(attribute='resources') | flatten
             | map(attribute='metadata.namespace') | unique | sort | list }}
        _scraped: >-
          {{ _received_namespaces.stdout_lines
             | map('regex_replace', '^.*:"(.*)"$', '\\1') | unique | list }}
        _unscraped: "{{ _declared | difference(_scraped) }}"

- name: Verify local log retention mount on every node
  hosts: "rke2_server:rke2_agent"
  any_errors_fatal: true
  vars:
    _mount_path: "{{ rke2_seaweedfs_logs_mount_path | default('/var/log/cluster') }}"
    _mount_settle_retries: 30
    _mount_settle_delay: 10
  tasks:
    # The mount is non-blocking by design - it may still be retrying if the
    # SeaweedFS cluster wasn't up yet when this node first booted. Active is
    # the right thing to wait for; it says nothing about whether the backend
    # has actually been reachable yet, which the content check below covers.
    - name: Wait for the weed mount service to be active
      ansible.builtin.systemd_service:
        name: weed-mount.service
      register: _weed_mount_status
      become: true
      retries: "{{ _mount_settle_retries }}"
      delay: "{{ _mount_settle_delay }}"
      until: _weed_mount_status.status.ActiveState == 'active'

- name: Verify local log retention cross-node visibility
  hosts: "rke2_server:rke2_agent"
  any_errors_fatal: true
  vars:
    _mount_path: "{{ rke2_seaweedfs_logs_mount_path | default('/var/log/cluster') }}"
    _marker_namespace: molecule-retention-check
    # Computed once on the controller so writer and reader agree on the
    # exact same path regardless of which host resolves it - avoids any
    # per-node clock-skew edge case around a date rollover.
    _marker_date: "{{ now(utc=true).strftime('%Y-%m-%d') }}"
    _marker_file: "{{ _mount_path }}/{{ _marker_namespace }}/marker-{{ _marker_date }}.log"
    _writer_host: "{{ groups['rke2_server'][0] }}"
    _reader_host: "{{ groups['rke2_agent'][0] }}"
    _visibility_retries: 30
    _visibility_delay: 1
  tasks:
    # A real round-trip through the actual mechanism (the mount + whatever
    # wrote through it), not the hand-run weed mount used to measure this
    # live during implementation (~1.4s, default settings) - that number
    # was a sanity check on the underlying mechanism, not proof this
    # specific wiring behaves the same way.
    - name: Write a latency marker on the writer node
      ansible.builtin.shell:
        cmd: >-
          mkdir -p {{ _mount_path }}/{{ _marker_namespace }} &&
          date -u +%s%N > {{ _marker_file }}
      become: true
      when: inventory_hostname == _writer_host
      changed_when: true

    - name: Poll for the marker on the reader node
      ansible.builtin.command:
        cmd: cat {{ _marker_file }}
      register: _marker_read
      become: true
      when: inventory_hostname == _reader_host
      changed_when: false
      failed_when: false
      retries: "{{ _visibility_retries }}"
      delay: "{{ _visibility_delay }}"
      until: _marker_read.rc == 0

    - name: Verify the marker became visible on a different node
      ansible.builtin.assert:
        that: _marker_read.rc == 0
        fail_msg: >-
          A log line written on {{ _writer_host }} never became visible on
          {{ _reader_host }} within {{ _visibility_retries * _visibility_delay }}s.
          This is the entire point of writing through the mount instead of
          the old S3-batch sink - if this fails, that architecture change
          didn't deliver what it was for.
        success_msg: >-
          Marker written on {{ _writer_host }} became visible on
          {{ _reader_host }}
      when: inventory_hostname == _reader_host

- name: Verify the mount survives a SeaweedFS outage
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Scale the SeaweedFS logs filer to zero
      kubernetes.core.k8s_scale:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: apps/v1
        kind: StatefulSet
        name: logs-filer
        namespace: seaweedfs-logs
        replicas: 0
        wait: false

- name: Verify affected nodes stay responsive during the outage
  hosts: "rke2_server:rke2_agent"
  any_errors_fatal: true
  vars:
    _mount_path: "{{ rke2_seaweedfs_logs_mount_path | default('/var/log/cluster') }}"
  tasks:
    # Measured live during implementation: a write while the filer is down
    # fails cleanly after ~13s, not a hang. 30s is headroom on that, not a
    # new assumption - if this hangs past it, that's the regression this
    # whole host-level-vs-DaemonSet design exists to prevent.
    - name: Attempt a write during the outage
      ansible.builtin.command:
        cmd: timeout 30 sh -c "echo outage-check > {{ _mount_path }}/outage-check.txt"
      become: true
      register: _outage_write
      changed_when: false
      failed_when: _outage_write.rc == 124

    - name: Verify the node is otherwise still fully responsive
      ansible.builtin.command: "true"
      changed_when: false

- name: Restore the SeaweedFS logs filer
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Scale the SeaweedFS logs filer back up
      kubernetes.core.k8s_scale:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: apps/v1
        kind: StatefulSet
        name: logs-filer
        namespace: seaweedfs-logs
        replicas: 1
        wait: false

- name: Verify the mount recovers automatically after the outage
  hosts: "rke2_server:rke2_agent"
  any_errors_fatal: true
  vars:
    _mount_path: "{{ rke2_seaweedfs_logs_mount_path | default('/var/log/cluster') }}"
    _recovery_retries: 30
    _recovery_delay: 10
  tasks:
    # No remount needed, confirmed live - the same weed mount process just
    # starts succeeding again once the filer is reachable.
    - name: Wait for a write to succeed again after recovery
      ansible.builtin.command:
        cmd: sh -c "echo recovered > {{ _mount_path }}/recovery-check.txt"
      become: true
      register: _recovery_write
      changed_when: false
      failed_when: false
      retries: "{{ _recovery_retries }}"
      delay: "{{ _recovery_delay }}"
      until: _recovery_write.rc == 0

    - name: Verify recovery was automatic
      ansible.builtin.assert:
        that: _recovery_write.rc == 0
        fail_msg: >-
          Writes never succeeded again after the filer recovered - the
          mount needed manual intervention, which defeats the point of the
          Restart=on-failure design.
        success_msg: "Mount recovered automatically after the outage"

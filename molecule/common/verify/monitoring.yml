---
- name: Verify cluster
  ansible.builtin.import_playbook: cluster.yml

- name: Verify monitoring pipeline
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    monitoring_namespace: monitoring
    monitoring_ingestor_selector: app=vector-ingestor
    monitoring_ingestor_file: /data/metrics.log
    monitoring_ingestor_logs_file: /data/logs.log
    monitoring_ingestor_units_file: /data/node-units.log
    monitoring_alloy_pod: alloy-0
    monitoring_cluster_id: "{{ rke2_cluster_name }}"
    monitoring_dropped_metric: container_tasks_state
    monitoring_settle_retries: 30
    monitoring_settle_delay: 10
  tasks:
    - name: Query ingestor pod
      kubernetes.core.k8s_info:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        kind: Pod
        namespace: "{{ monitoring_namespace }}"
        label_selectors:
          - "{{ monitoring_ingestor_selector }}"
        field_selectors:
          - status.phase=Running
      register: _ingestor_query
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until: _ingestor_query.resources | length > 0

    - name: Set ingestor facts
      ansible.builtin.set_fact:
        _ingestor_pod: "{{ _ingestor_query.resources | first | json_query('metadata.name') }}"

    - name: Wait for metrics to reach the ingestor
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- wc -l {{ monitoring_ingestor_file }}
      register: _received
      changed_when: false
      failed_when: false
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until:
        - _received.rc == 0
        - (_received.stdout.split() | first | int) > 0

    - name: Verify metrics are being delivered
      ansible.builtin.assert:
        that: (_received.stdout.split() | first | int) > 0
        fail_msg: >-
          No metrics reached the ingestor. Alloy is scraping but not delivering;
          check the remote_write endpoint path and Alloy logs for HTTP errors.
        success_msg: "Ingestor received {{ _received.stdout.split() | first }} events"

    - name: Wait for logs to reach the ingestor
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- wc -l {{ monitoring_ingestor_logs_file }}
      register: _received_logs
      changed_when: false
      failed_when: false
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until:
        - _received_logs.rc == 0
        - (_received_logs.stdout.split() | first | int) > 0

    - name: Verify logs are being delivered
      ansible.builtin.assert:
        that: (_received_logs.stdout.split() | first | int) > 0
        fail_msg: >-
          No logs reached the ingestor. Vector is running but not delivering;
          check the ClusterVectorPipeline sink address and the vector agent's
          logs for connection errors.
        success_msg: "Ingestor received {{ _received_logs.stdout.split() | first }} log lines"

    # kube-system always has running pods (coredns, etc.) in every scenario, so
    # this is a reliable, cheap proof that collection is not limited to the
    # pipeline's own namespace. A VectorPipeline (namespaced) is restricted by
    # the operator to its own namespace by default; only ClusterVectorPipeline
    # collects cluster-wide. Matches the exact JSON field, not a bare
    # substring, so an incidental mention elsewhere (e.g. kube-state-metrics
    # logging a watched resource's namespace) can't produce a false pass.
    - name: Wait for a non-monitoring namespace's logs to reach the ingestor
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- sh -c "grep -c '\"pod_namespace\":\"kube-system\"' {{ monitoring_ingestor_logs_file }} || true"
      register: _received_cross_namespace_logs
      changed_when: false
      failed_when: false
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until:
        - _received_cross_namespace_logs.rc == 0
        - (_received_cross_namespace_logs.stdout | trim | int) > 0

    - name: Verify log collection is not restricted to the agent's own namespace
      ansible.builtin.assert:
        that: (_received_cross_namespace_logs.stdout | trim | int) > 0
        fail_msg: >-
          No kube-system pod logs reached the ingestor although kube-system
          always has running pods. The logging pipeline is likely a namespaced
          VectorPipeline, which the operator restricts to its own namespace by
          default - it must be a ClusterVectorPipeline for cluster-wide
          collection.
        success_msg: >-
          Ingestor received {{ _received_cross_namespace_logs.stdout | trim }}
          log lines from kube-system

    # The logging invariant (CLAUDE.md): every shipped event carries the
    # common fields set by the pipeline's logs_normalized remap. Recent
    # window only, so lines received before a pipeline change can't fail a
    # rerun; one awk pass over a single read, for the same race reason as
    # the metrics counts below.
    - name: Query normalized log fields
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- sh -c "tail -n 2000 {{ monitoring_ingestor_logs_file }} |
          awk '{t++} /\"log_format\":\"/ && /\"level\":\"/ && /\"msg\":/ && /\"node\":\"/ {n++}
          END {print t+0; print n+0}'"
      register: _normalized_logs
      changed_when: false

    - name: Verify every log event carries the common fields
      ansible.builtin.assert:
        that: (_normalized_logs.stdout_lines[1] | int) == (_normalized_logs.stdout_lines[0] | int)
        fail_msg: >-
          {{ _normalized_logs.stdout_lines[1] }} of
          {{ _normalized_logs.stdout_lines[0] }} recent log events carry
          node, log_format, level and msg. The ingestor sink must read from
          the pipeline's logs_normalized remap.
        success_msg: >-
          All {{ _normalized_logs.stdout_lines[0] }} recent log events carry
          the common fields

    # Node logs that never pass through a pod: the kubelet's file and
    # rke2's own journal unit, from every node - control plane included,
    # which the agent only reaches by tolerating its taint. Read from the
    # ingestor's node-units file (one line per node and unit ever seen),
    # not logs.log: rke2-agent logs at boot and then goes quiet, and
    # logs.log only keeps recent history. Prints one "node unit" pair per
    # line; the unit field is set only on node events, so pod logs can't
    # produce a false pass.
    - name: Wait for node logs from every node to reach the ingestor
      vars:
        _node_count: "{{ query('ansible.builtin.inventory_hostnames', 'rke2_server:rke2_agent') | length }}"
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- sh -c "awk 'match($0, /\"unit\":\"(kubelet|rke2-server|rke2-agent)\"/) {
          u = substr($0, RSTART + 8, RLENGTH - 9); n = $0;
          sub(/.*\"node\":\"/, \"\", n); sub(/\".*/, \"\", n); print n, u
          }' {{ monitoring_ingestor_units_file }} | sort -u"
      register: _received_node_logs
      changed_when: false
      failed_when: false
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until:
        - _received_node_logs.rc == 0
        - (_received_node_logs.stdout_lines | select('search', ' kubelet$') | list | length)
          == (_node_count | int)
        - (_received_node_logs.stdout_lines | select('search', ' rke2-(server|agent)$') | list | length)
          == (_node_count | int)

    - name: Verify kubelet and rke2 logs arrive from every node
      vars:
        _node_count: "{{ query('ansible.builtin.inventory_hostnames', 'rke2_server:rke2_agent') | length }}"
      ansible.builtin.assert:
        that:
          - (_received_node_logs.stdout_lines | select('search', ' kubelet$') | list | length)
            == (_node_count | int)
          - (_received_node_logs.stdout_lines | select('search', ' rke2-(server|agent)$') | list | length)
            == (_node_count | int)
        fail_msg: >-
          Expected kubelet and rke2-server/rke2-agent logs from all
          {{ _node_count }} nodes, got:
          {{ _received_node_logs.stdout_lines }}. Check the agent runs on
          every node (tolerations), its host-log mounts, and the pipeline's
          node_files/node_journal sources.
        success_msg: >-
          kubelet and rke2 logs arrive from all {{ _node_count }} nodes

    # _received (above) is a stale snapshot by the time this runs - several
    # tasks and real wall-clock time earlier - and metrics.log only ever
    # grows (continuous scraping). Comparing a stale total against a fresh
    # labelled-count recheck is racy by construction, not by bad luck -
    # confirmed live, repeatedly, labelled exceeding that stale total by a
    # margin tracking how much time had passed. Even two SEPARATE reads of
    # the file back-to-back in the same shell invocation (wc -l; grep -c)
    # still raced - confirmed live a second time, same symptom, smaller but
    # still nonzero gap - this ingestor receives bursts faster than two
    # sequential syscalls apart can outrun. A single awk pass counting both
    # over the exact same read of the file is what actually closes this.
    # Lines not starting with "{" are skipped: the ingestor's trim cuts the
    # file block-aligned, so its first line can be a partial event.
    - name: Query received events
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- awk -v "pat={{ item.pattern }}"
          '!/^[{]/ {next} {t++} $0 ~ pat {l++} END {print t+0; print l+0}'
          {{ monitoring_ingestor_file }}
      register: _event_query
      changed_when: false
      loop:
        - { name: cluster_label, pattern: "{{ monitoring_cluster_id }}" }
        - { name: dropped_metric, pattern: "{{ monitoring_dropped_metric }}" }
      loop_control:
        label: "{{ item.name }}"

    - name: Set event count facts
      ansible.builtin.set_fact:
        _count_total: "{{ _event_query.results[0].stdout_lines[0] | trim | int }}"
        _count_labelled: "{{ _event_query.results[0].stdout_lines[1] | trim | int }}"
        _count_dropped: "{{ _event_query.results[1].stdout_lines[1] | trim | int }}"

    - name: Verify every event carries the cluster label
      ansible.builtin.assert:
        that: _count_labelled | int == _count_total | int
        fail_msg: >-
          {{ _count_labelled }} of {{ _count_total }} events carry
          cluster={{ monitoring_cluster_id }}. Unlabelled series collide with
          other clusters in the shared tenant and read as plausible data.
        success_msg: "All {{ _count_total }} events carry the cluster label"

    - name: Verify the cardinality drop list is applied
      ansible.builtin.assert:
        that: _count_dropped | int == 0
        fail_msg: >-
          {{ monitoring_dropped_metric }} reached the ingestor
          {{ _count_dropped }} times but is on the drop list; the
          metric_relabel rules are not being applied.
        success_msg: "{{ monitoring_dropped_metric }} correctly dropped"

    - name: Query Alloy for skipped monitors
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          logs -n {{ monitoring_namespace }} {{ monitoring_alloy_pod }}
          -c alloy --tail=2000
      register: _alloy_logs
      changed_when: false

    - name: Verify no monitor was silently skipped
      ansible.builtin.assert:
        that: _skipped | length == 0
        fail_msg: >-
          Alloy skipped {{ _skipped | length }} monitor(s), which produce no
          metrics and no failure: {{ _skipped | join(' | ') }}
        success_msg: "All ServiceMonitors and PodMonitors accepted by Alloy"
      vars:
        _skipped: >-
          {{ _alloy_logs.stdout_lines
             | select('search', 'error generating scrapeconfig')
             | list }}

    # A monitor whose selector matches nothing is accepted by Alloy and simply
    # produces no metrics, so the skipped-monitor check above cannot see it.
    # Namespace coverage catches the case a monitor scrapes nothing at all.
    # Monitors labelled optional select resources users create after deploy, so
    # emptiness carries no information: no Kafka clusters is a valid state, and
    # indistinguishable from a broken selector. Coverage for those comes from an
    # alert on the kube-state-metrics custom-resource-state series instead.
    - name: Query declared monitors
      kubernetes.core.k8s_info:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: monitoring.coreos.com/v1
        kind: "{{ item }}"
        label_selectors:
          - "pokerops.net/monitor-optional notin (true)"
      register: _monitor_query
      loop:
        - ServiceMonitor
        - PodMonitor

    - name: Query namespaces present in received metrics
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- sh -c "grep -o '\"namespace\":\"[^\"]*\"' {{ monitoring_ingestor_file }} | sort -u"
      register: _received_namespaces
      changed_when: false

    - name: Verify every monitor namespace is represented in received metrics
      ansible.builtin.assert:
        that: _unscraped | length == 0
        fail_msg: >-
          No metrics arrived from {{ _unscraped | join(', ') }}, which declare
          monitors. Their selectors match nothing, which Alloy reports as success.
        success_msg: "All {{ _declared | length }} monitor namespace(s) delivered metrics"
      vars:
        _declared: >-
          {{ _monitor_query.results | map(attribute='resources') | flatten
             | map(attribute='metadata.namespace') | unique | sort | list }}
        _scraped: >-
          {{ _received_namespaces.stdout_lines
             | map('regex_replace', '^.*:"(.*)"$', '\1') | unique | list }}
        _unscraped: "{{ _declared | difference(_scraped) }}"

# The cluster-local log store (VictoriaLogs). Queried only through
# kubectl port-forward, the admin path: its NetworkPolicy admits only the
# Vector agents and Alloy, and port-forward traffic enters the pod over its
# own loopback, which the policy doesn't filter.
- name: Verify the local log store
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _vl_namespace: monitoring
    _vl_name: victoria-logs
    _vl_port: 19428
    _vl_settle_retries: 30
    _vl_settle_delay: 10
    _vl_probe_image: "curlimages/curl:8.11.1"
    _kubectl: "kubectl --kubeconfig {{ molecule_local_kubeconfig }}"
    _node_count: "{{ query('ansible.builtin.inventory_hostnames', 'rke2_server:rke2_agent') | length }}"
    # Runs one LogsQL query through a port-forward and prints the JSON
    # lines it returns.
    _vl_query: >-
      {{ _kubectl }} -n {{ _vl_namespace }} port-forward svc/{{ _vl_name }}
      {{ _vl_port }}:9428 >/dev/null 2>&1 & pf=$!; trap 'kill $pf' EXIT;
      for i in $(seq 1 40); do
      curl -sf http://127.0.0.1:{{ _vl_port }}/health >/dev/null && break; sleep 0.25;
      done;
      curl -sf http://127.0.0.1:{{ _vl_port }}/select/logsql/query --data-urlencode
  tasks:
    - name: Wait for VictoriaLogs to become ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: apps/v1
        kind: StatefulSet
        name: "{{ _vl_name }}"
        namespace: "{{ _vl_namespace }}"
      register: _vl_sts
      retries: "{{ _vl_settle_retries }}"
      delay: "{{ _vl_settle_delay }}"
      until:
        - _vl_sts.resources | length > 0
        - (_vl_sts.resources[0].status.readyReplicas | default(0)) == 1

    # rke2-agent logs at boot and then goes quiet, so look back a full day
    # (the scenario's whole life); the store keeps it for its retention.
    - name: Wait for node logs from every node to reach the local store
      ansible.builtin.shell:
        cmd: >-
          {{ _vl_query }}
          'query=_time:1d unit:in("kubelet", "rke2-server", "rke2-agent") | stats by (node, unit) count() hits'
      register: _vl_node_logs
      changed_when: false
      failed_when: false
      retries: "{{ _vl_settle_retries }}"
      delay: "{{ _vl_settle_delay }}"
      until:
        - _vl_node_logs.rc == 0
        - (_vl_node_logs.stdout_lines | map('from_json') | selectattr('unit', 'equalto', 'kubelet') | list | length)
          == (_node_count | int)
        - (_vl_node_logs.stdout_lines | map('from_json') | selectattr('unit', 'match', '^rke2-(server|agent)$') | list | length)
          == (_node_count | int)

    - name: Verify kubelet and rke2 logs reach the local store from every node
      ansible.builtin.assert:
        that:
          - _vl_node_logs.rc == 0
          - (_vl_node_logs.stdout_lines | map('from_json') | selectattr('unit', 'equalto', 'kubelet') | list | length)
            == (_node_count | int)
          - (_vl_node_logs.stdout_lines | map('from_json') | selectattr('unit', 'match', '^rke2-(server|agent)$') | list | length)
            == (_node_count | int)
        fail_msg: >-
          Expected kubelet and rke2-server/rke2-agent logs from all {{ _node_count }}
          nodes in VictoriaLogs, got (rc={{ _vl_node_logs.rc }}):
          {{ _vl_node_logs.stdout_lines | default([]) }}. Check the pipeline's
          local sink and VictoriaLogs' NetworkPolicy.
        success_msg: "kubelet and rke2 logs reach the local store from all {{ _node_count }} nodes"

    # Fields arrive flattened and searchable: a recent kube-system pod event
    # must carry its namespace, node and a real level.
    - name: Query recent pod log levels in the local store
      ansible.builtin.shell:
        cmd: >-
          {{ _vl_query }}
          'query=_time:15m kubernetes.pod_namespace:="kube-system" node:* | stats by (level) count() hits'
      register: _vl_levels
      changed_when: false

    - name: Verify pod logs are searchable by field with real levels
      ansible.builtin.assert:
        that: _levels | reject('equalto', 'unknown') | list | length > 0
        fail_msg: >-
          No kube-system pod event in the last 15 minutes has a level other
          than unknown ({{ _vl_levels.stdout_lines }}). Check the local sink's
          inputs (logs_normalized) and its query fields.
        success_msg: "Pod logs are searchable by field (levels: {{ _levels | join(', ') }})"
      vars:
        _levels: "{{ _vl_levels.stdout_lines | map('from_json') | map(attribute='level') | list }}"

    # Retention by age and by disk usage, as rendered from the role's values.
    - name: Query VictoriaLogs container args
      kubernetes.core.k8s_info:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: apps/v1
        kind: StatefulSet
        name: "{{ _vl_name }}"
        namespace: "{{ _vl_namespace }}"
      register: _vl_sts_spec

    - name: Set VictoriaLogs container args fact
      ansible.builtin.set_fact:
        _vl_args: "{{ _vl_sts_spec.resources[0].spec.template.spec.containers[0].args }}"

    - name: Verify VictoriaLogs retention flags
      ansible.builtin.assert:
        that:
          - "'--retentionPeriod=' ~ (rke2_logging_retention_days | default(3)) ~ 'd' in _vl_args"
          - "'--retention.maxDiskUsagePercent=85' in _vl_args"
          - "'--loggerFormat=json' in _vl_args"
        fail_msg: "VictoriaLogs runs with {{ _vl_args }}"
        success_msg: "VictoriaLogs retention flags are applied"

    - name: Probe VictoriaLogs from a pod the NetworkPolicy doesn't admit
      ansible.builtin.command:
        cmd: >-
          {{ _kubectl }} -n {{ _vl_namespace }} run victoria-logs-probe
          --image={{ _vl_probe_image }} --restart=Never --rm -i --quiet
          --command -- curl -s -m 5 -o /dev/null -w '%{http_code}'
          http://{{ _vl_name }}.{{ _vl_namespace }}.svc:9428/health
      register: _vl_probe
      changed_when: false
      failed_when: false

    - name: Verify the NetworkPolicy blocks other pods
      ansible.builtin.assert:
        that: _vl_probe.stdout is not search('200')
        fail_msg: >-
          A pod outside the NetworkPolicy's allowed set reached VictoriaLogs
          (HTTP {{ _vl_probe.stdout }}). Check the policy and that Cilium
          enforces it.
        success_msg: "The NetworkPolicy blocks other pods ({{ _vl_probe.stdout | default('no response', true) }})"

# The agents' disk buffer for the local sink must carry events logged while
# the store is down. Argo CD's self-heal would restore the StatefulSet at
# once, so automated sync is paused for the outage and restored after.
- name: Verify the local store catches up after an outage
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    _vl_namespace: monitoring
    _vl_name: victoria-logs
    _vl_port: 19428
    _vl_settle_retries: 30
    _vl_settle_delay: 10
    _vl_probe_image: "curlimages/curl:8.11.1"
    _kubectl: "kubectl --kubeconfig {{ molecule_local_kubeconfig }}"
    _vl_query: >-
      {{ _kubectl }} -n {{ _vl_namespace }} port-forward svc/{{ _vl_name }}
      {{ _vl_port }}:9428 >/dev/null 2>&1 & pf=$!; trap 'kill $pf' EXIT;
      for i in $(seq 1 40); do
      curl -sf http://127.0.0.1:{{ _vl_port }}/health >/dev/null && break; sleep 0.25;
      done;
      curl -sf http://127.0.0.1:{{ _vl_port }}/select/logsql/query --data-urlencode
  tasks:
    - name: Name the outage marker
      ansible.builtin.set_fact:
        _vl_marker: "local-store-outage-{{ lookup('ansible.builtin.pipe', 'date +%s') }}"

    - name: Pause automated sync of the VictoriaLogs application
      ansible.builtin.command:
        cmd: >-
          {{ _kubectl }} -n argocd patch application {{ _vl_name }} --type merge
          -p '{"spec":{"syncPolicy":{"automated":null}}}'
      changed_when: true

    - name: Scale VictoriaLogs to zero
      kubernetes.core.k8s_scale:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: apps/v1
        kind: StatefulSet
        name: "{{ _vl_name }}"
        namespace: "{{ _vl_namespace }}"
        replicas: 0
        wait: true
        wait_timeout: 180

    # Kept until the end: deleting the pod removes its log file, and the
    # agent's kubernetes_logs source only looks for new files about once a
    # minute.
    - name: Log the marker while the store is down
      ansible.builtin.command:
        cmd: >-
          {{ _kubectl }} -n {{ _vl_namespace }} run victoria-logs-marker
          --image={{ _vl_probe_image }} --restart=Never
          --command -- sh -c 'echo {{ _vl_marker }}'
      changed_when: true

    - name: Wait for the marker pod to finish
      ansible.builtin.command:
        cmd: >-
          {{ _kubectl }} -n {{ _vl_namespace }} wait pod/victoria-logs-marker
          --for=jsonpath='{.status.phase}'=Succeeded --timeout=180s
      changed_when: false

    # Long enough for the agent to discover the marker's log file and fail
    # delivery to the store, so the marker can only arrive from the buffer.
    - name: Keep the store down while the agent picks up the marker
      ansible.builtin.wait_for:
        timeout: 90

    - name: Scale VictoriaLogs back up
      kubernetes.core.k8s_scale:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        api_version: apps/v1
        kind: StatefulSet
        name: "{{ _vl_name }}"
        namespace: "{{ _vl_namespace }}"
        replicas: 1
        wait: true
        wait_timeout: 300

    - name: Restore automated sync of the VictoriaLogs application
      ansible.builtin.command:
        cmd: >-
          {{ _kubectl }} -n argocd patch application {{ _vl_name }} --type merge
          -p '{"spec":{"syncPolicy":{"automated":{"prune":true,"selfHeal":true}}}}'
      changed_when: true

    - name: Wait for the marker to reach the local store
      ansible.builtin.shell:
        cmd: >-
          {{ _vl_query }}
          'query=_time:1h "{{ _vl_marker }}" | stats count() hits'
      register: _vl_marker_query
      changed_when: false
      failed_when: false
      retries: "{{ _vl_settle_retries }}"
      delay: "{{ _vl_settle_delay }}"
      until:
        - _vl_marker_query.rc == 0
        - (_vl_marker_query.stdout_lines | map('from_json') | map(attribute='hits') | map('int') | sum) > 0

    - name: Verify events logged during the outage arrive afterwards
      ansible.builtin.assert:
        that: (_vl_marker_query.stdout_lines | default([]) | map('from_json') | map(attribute='hits') | map('int') | sum) > 0
        fail_msg: >-
          The marker logged while VictoriaLogs was down never arrived
          (rc={{ _vl_marker_query.rc }}, {{ _vl_marker_query.stdout_lines | default([]) }}).
          Check the local sink's disk buffer and that Argo CD restored the
          StatefulSet.
        success_msg: "Events logged during the outage arrive afterwards"

    - name: Remove the marker pod
      ansible.builtin.command:
        cmd: "{{ _kubectl }} -n {{ _vl_namespace }} delete pod victoria-logs-marker --ignore-not-found"
      changed_when: true

# Vector's internal metrics, scraped through the operator's PodMonitor and
# allowlisted in Alloy (rke2_monitoring_keep_metrics_vector): the allowed
# counters must arrive, and nothing else from the agent may.
- name: Verify the Vector agent's metrics are forwarded
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    monitoring_namespace: monitoring
    monitoring_ingestor_file: /data/metrics.log
    monitoring_settle_retries: 30
    monitoring_settle_delay: 10
  tasks:
    - name: Wait for the agent's sent-events counter to reach the ingestor
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- sh -c "tail -n 100000 {{ monitoring_ingestor_file }} |
          grep -c '\"name\":\"vector_component_sent_events_total\"' || true"
      register: _vector_sent_metrics
      changed_when: false
      retries: "{{ monitoring_settle_retries }}"
      delay: "{{ monitoring_settle_delay }}"
      until: (_vector_sent_metrics.stdout | trim | int) > 0

    - name: Verify allowlisted vector metrics are forwarded
      ansible.builtin.assert:
        that: (_vector_sent_metrics.stdout | trim | int) > 0
        fail_msg: >-
          No vector_component_sent_events_total sample reached the ingestor.
          Check the Vector CR's internalMetrics, the vector-agent PodMonitor
          and rke2_monitoring_keep_metrics_vector in Alloy's relabel rules.
        success_msg: >-
          Allowlisted vector metrics are forwarded ({{ _vector_sent_metrics.stdout | trim }}
          recent samples)

    # ~80% of the agent's ~770 series per node are histogram buckets; only
    # the allowlisted counters may be forwarded.
    - name: Count forwarded vector histogram samples
      ansible.builtin.command:
        cmd: >-
          kubectl --kubeconfig {{ molecule_local_kubeconfig }}
          exec -n {{ monitoring_namespace }} {{ _ingestor_pod }}
          -- sh -c "tail -n 100000 {{ monitoring_ingestor_file }} |
          grep -cE '\"name\":\"vector_[a-z_]+_bucket\"|__tmp_keep' || true"
      register: _vector_histograms
      changed_when: false

    - name: Verify only allowlisted vector metrics are forwarded
      ansible.builtin.assert:
        that: (_vector_histograms.stdout | trim | int) == 0
        fail_msg: >-
          {{ _vector_histograms.stdout | trim }} recent samples are vector
          histogram buckets or carry the __tmp_keep marker label; Alloy's
          vector allowlist rules are not applied.
        success_msg: Only allowlisted vector metrics are forwarded

---
- name: Gather cluster facts
  hosts: all
  gather_facts: true

- name: Verify cluster BGP configuration
  hosts: localhost
  become: true
  any_errors_fatal: true
  vars:
    ingress_namespaces: ["nginx", "traefik-public", "traefik-private"]
    bgp_peer_names: "{{ groups['all'] }}"
    bgp_hop_names: "{{ groups[molecule_bgp_group] }}"
    bgp_hop_addrs: "{{ bgp_hop_names | map('extract', hostvars, ['ansible_default_ipv4', 'address']) }}"
  tasks:
    - name: Verify BGP Peer resources exist
      block:
        - name: Query BGPPeer resources
          kubernetes.core.k8s_info:
            api_version: metallb.io/v1beta2
            kind: BGPPeer
            namespace: metallb-system
            kubeconfig: "{{ molecule_local_kubeconfig }}"
          register: _bgp_peers

        - name: Verify BGPPeer
          ansible.builtin.assert:
            that: _bgp_peers.resources | length > 0
            fail_msg: "Found no BGPPeers"

    - name: Verify BGP Advertisement resource exists
      block:
        - name: Query BGPAdvertisement resources
          kubernetes.core.k8s_info:
            api_version: metallb.io/v1beta1
            kind: BGPAdvertisement
            namespace: metallb-system
            kubeconfig: "{{ molecule_local_kubeconfig }}"
          register: _bgp_advertisements
          changed_when: false

        - name: Verify BGPAdvertisement
          ansible.builtin.assert:
            that: _bgp_advertisements.resources | selectattr('metadata.name', 'equalto', 'metallb') | length == 1
            fail_msg: "Found no BGPAdvertisements"

        - name: Query L2Advertisement resources
          kubernetes.core.k8s_info:
            api_version: metallb.io/v1beta2
            kind: L2Advertisement
            namespace: metallb-system
            kubeconfig: "{{ molecule_local_kubeconfig }}"
          register: _l2_advertisements
          changed_when: false

        - name: Verify no L2Advertisement resources exist
          ansible.builtin.assert:
            that: _l2_advertisements.resources | length == 0
            fail_msg: "Found L2Advertisement resources in BGP mode: {{ _l2_advertisements.resources | map(attribute='metadata.name') }}"

    - name: Verify cluster pod status
      ansible.builtin.shell:
        cmd: "/var/lib/rancher/rke2/bin/kubectl get pod -A -o json | jq '.items'"
      vars:
        _pod_data: "{{ _pod_data.stdout | from_json }}"
        _pod_status: "{{ _pod_data | selectattr('status', 'defined') }}"
        _pod_phase: "{{ _pod_status | selectattr('status.phase', 'defined') }}"
        _pod_completed: "{{ _pod_phase | rejectattr('status.phase', 'equalto', 'Running') }}"
        _pod_failed: "{{ _pod_completed | rejectattr('status.phase', 'equalto', 'Succeeded') }}"
      register: _pod_data
      retries: 15
      delay: 20
      until: _pod_failed | length == 0
      failed_when:
        - (_pod_status | length) != (_pod_data | length)
        - (_pod_phase | length) != (_pod_data | length)
        - _pod_failed | length > 0
      changed_when: false

    - name: Verify ingress controller LoadBalancer services
      block:
        - name: Wait for Ingress controller LoadBalancer IPs to be assigned
          kubernetes.core.k8s_info:
            kubeconfig: "{{ molecule_local_kubeconfig }}"
            kind: Service
          register: _svc_info
          vars:
            _ics: "{{ _svc_info.resources | selectattr('spec.type', 'equalto', 'LoadBalancer') | selectattr('metadata.namespace', 'in', ingress_namespaces) }}"
            _ingresses: "{{ _ics | selectattr('status.loadBalancer.ingress', 'defined') | map(attribute='status.loadBalancer.ingress') }}"
            _ips: "{{ _ingresses | map('first') | map(attribute='ip') | list }}"
          until: (_ics | length > 0) and (_ips | length == _ics | length)
          retries: 15
          delay: 20

        - name: Store Ingress controller services and IPs
          ansible.builtin.set_fact:
            _ingress_svcs: "{{ _ics }}"
            _ingress_ips: "{{ _ics | map(attribute='status.loadBalancer.ingress') | map('first') | map(attribute='ip') | list }}"
          vars:
            _ics: "{{ _svc_info.resources | selectattr('spec.type', 'equalto', 'LoadBalancer') | selectattr('metadata.namespace', 'in', ingress_namespaces) }}"

        - name: Verify LoadBalancer IPs
          ansible.builtin.assert:
            that: (_ingress_ips | length) == (_ingress_svcs | length)
            fail_msg: "Expected {{ _ingress_svcs | length }} Ingress controllers addresses, found {{ _ingress_ips | length }}"

        - name: Debug ingress IPs
          ansible.builtin.debug:
            var: _ingress_ips

    - name: Verify FRR container is running
      block:
        - name: Query FRR container status
          community.docker.docker_container_info:
            name: frr
          register: _frr_container_query
          changed_when: false

        - name: Assert FRR container is running
          ansible.builtin.assert:
            that: _status == 'running'
            fail_msg: "FRR container is in state {{ _status }}"
          vars:
            _status: "{{ _frr_container_query.container.State.Status }}"

    - name: Verify FRR BGP daemon is active
      block:
        - name: Query BGP summary
          ansible.builtin.shell:
            cmd: "docker exec frr vtysh -c 'show bgp summary json'"
          vars:
            _bgp_summary: "{{ (_bgp_summary_query.stdout | from_json) }}"
            _neighbors: "{{ _bgp_summary.ipv4Unicast.peers.values() | map(attribute='hostname') }}"
            _neighbors_names: "{{ _neighbors | map(attribute='hostname') }}"
          until:
            - _neighbors | length > 0
            - _neighbors | symmetric_difference(bgp_peer_names) | length == 0
            - _bgp_summary.ipv4Unicast.failedPeers == 0
          retries: 15
          delay: 20
          register: _bgp_summary_query
          changed_when: false

      rescue:
        - name: Parse BGP neighbor data
          ansible.builtin.set_fact:
            _bgp_summary: "{{ _bgp_data }}"
            _neighbors: "{{ _bgp_data.ipv4Unicast.peers.values() }}"
          vars:
            _bgp_data: "{{ _bgp_summary_query.stdout | from_json }}"

        - name: Debug neighbor list
          ansible.builtin.debug:
            msg: "Expected {{ bgp_peer_names }}, got {{ _neighbors | map(attribute='hostname') }} "

        - name: Verify neighbor state
          ansible.builtin.debug:
            msg: "The following neighbors are in a failed state: {{ _neighbors_ko | map(attribute='hostname') }}"
          vars:
            _neighbors_ko: "{{ _bgp_summary | rejectattr('state', 'equalto', 'Established') }}"

        - name: Fail BGP checks
          ansible.builtin.fail:
            msg: "Failed BGP neighbor verification"

    - name: Verify BGP route propagation
      block:
        - name: Query BGP IPv4 unicast routes
          ansible.builtin.shell:
            cmd: "docker exec frr vtysh -c 'show bgp ipv4 unicast json'"
          vars:
            _bgp_routes: "{{ _bgp_route_query.stdout | from_json }}"
            _ingress_routes: "{{ _ingress_ips | product(['32']) | map('join', '/') }}"
          register: _bgp_route_query
          retries: 30
          delay: 20
          until:
            - _bgp_routes.totalRoutes | int > 0
            - _bgp_routes.routes.keys() | symmetric_difference(_ingress_routes) | length == 0
          changed_when: false

      always:
        - name: Parse BGP IPv4 unicast data
          ansible.builtin.set_fact:
            _bgp_routes: "{{ _bgp_route_query.stdout }}"
            _ingress_routes: "{{ _ingress_ips | product(['32']) | map('join', '/') }}"

        - name: Verify route validity
          ansible.builtin.assert:
            that:
              - _routes | length > 0
              - _routes_best | length > 0
            fail_msg: "No best route registered for prefix {{ item }}"
            success_msg: "Best path found for prefix {{ item }} through peers {{ _routes_best | map(attribute='peerId') }}"
          vars:
            _routes: "{{ _bgp_routes.routes[item] | default([]) }}"
            _routes_valid: "{{ _routes | selectattr('valid', 'defined') | selectattr('valid', 'equalto', true) }}"
            _routes_best: "{{ _routes_valid | selectattr('bestpath', 'defined') | selectattr('bestpath', 'equalto', true) }}"
          loop: "{{ _ingress_routes }}"

        - name: Verify route next hops
          ansible.builtin.assert:
            that:
              - _routes_ok | length > 0
              - _routes_ko | length == 0
            fail_msg: "No next hops found for routes from peers {{ _routes_ko | map(attribute='peerId') }}"
            success_msg: "Found next hops for {{ item }}: {{ _routes_ok | map(attribute='peerId') }}"
          vars:
            _routes: "{{ _bgp_routes.routes[item] }}"
            _routes_ok: "{{ _routes | rejectattr('nexthops', 'equalto', []) }}"
            _routes_ko: "{{ _routes | selectattr('nexthops', 'equalto', []) }}"
          loop: "{{ _ingress_routes }}"

    - name: Verify FRR route table
      block:
        - name: Query FRR routes
          ansible.builtin.shell:
            cmd: "docker exec frr ip -j -d route show"
          vars:
            _routes_data: "{{ _frr_route_query.stdout | from_json }}"
            _routes_bgp: "{{ _routes_data | selectattr('protocol', 'equalto', 'bgp') }}"
            _routes_ingress: "{{ _routes_bgp | selectattr('dst', 'in', _ingress_ips) }}"
            _routes_wnexthops: "{{ _routes_ingress | selectattr('nexthops', 'defined') }}"
            _routes_hopcount: "{{ _routes_wnexthops | map(attribute='nexthops') | map('length') }}"
          register: _frr_route_query
          changed_when: false
          retries: 30
          delay: 20
          until:
            - _routes_wnexthops | length == _ingress_ips | length
            - _routes_hopcount | reject('equalto', bgp_hop_addrs | length) | length == 0

        - name: Parse FRR route data
          ansible.builtin.set_fact:
            _frr_routes: "{{ _routes_dict }}"
          vars:
            _routes_data: "{{ _frr_route_query.stdout | from_json }}"
            _routes_bgp: "{{ _routes_data | selectattr('protocol', 'equalto', 'bgp') }}"
            _routes_ingress: "{{ _routes_bgp | selectattr('dst', 'in', _ingress_ips) }}"
            _routes_wnexthops: "{{ _routes_ingress | selectattr('nexthops', 'defined') }}"
            _routes_dsts: "{{ _routes_wnexthops | map(attribute='dst') }}"
            _routes_nexthops: "{{ _routes_wnexthops | map(attribute='nexthops') }}"
            _routes_gateways: "{{ _routes_nexthops | map('map', attribute='gateway') }}"
            _routes_dict: "{{ _routes_dsts | zip(_routes_gateways) | nephelaiio.plugins.to_dict }}"

        - name: Verify ingress routes on FRR table
          ansible.builtin.assert:
            that: _gateways | intersect(bgp_hop_addrs) | length == bgp_hop_addrs | length
            fail_msg: "Routes missing for address {{ _address }}, {{ bgp_hop_addrs | difference(_gateways) }}"
            success_msg: "Routes installed for address {{ _address }} with gateways {{ _gateways }}"
          vars:
            _address: "{{ item.key }}"
            _gateways: "{{ item.value }}"
          loop_control:
            label: "{{ _address }}"
          loop: "{{ _frr_routes | dict2items }}"

      rescue:
        - name: Debug FRR route data
          ansible.builtin.debug:
            msg: "{{ _routes_dict }}"
          vars:
            _routes_data: "{{ _frr_route_query.stdout | from_json }}"
            _routes_bgp: "{{ _routes_data | selectattr('protocol', 'equalto', 'bgp') }}"
            _routes_ingress: "{{ _routes_bgp | selectattr('dst', 'in', _ingress_ips) }}"
            _routes_wnexthops: "{{ _routes_ingress | selectattr('nexthops', 'defined') }}"
            _routes_dsts: "{{ _routes_wnexthops | map(attribute='dst') }}"
            _routes_nexthops: "{{ _routes_wnexthops | map(attribute='nexthops') }}"
            _routes_gateways: "{{ _routes_nexthops | map('map', attribute='gateway') }}"
            _routes_dict: "{{ _routes_dsts | zip(_routes_gateways) | nephelaiio.plugins.to_dict }}"

        - name: Fail execution on FRR route verification error
          ansible.builtin.fail:
            msg: "FRR route verification checks failed"

    - name: Verify local route table
      block:
        - name: Query local routes
          ansible.builtin.shell:
            cmd: "ip -j -d route show"
          register: _host_route_query
          changed_when: false
          vars:
            _routes_data: "{{ _host_route_query.stdout | from_json }}"
            _routes_bgp: "{{ _routes_data | selectattr('protocol', 'equalto', 'bgp') }}"
            _routes_ingress: "{{ _routes_bgp | selectattr('dst', 'in', _ingress_ips) }}"
            _routes_nexthops: "{{ _routes_ingress | selectattr('nexthops', 'defined') }}"
            _routes_hopcount: "{{ _routes_nexthops | map(attribute='nexthops') | map('length') }}"
          retries: 15
          delay: 20
          until:
            - _routes_nexthops | length == _ingress_ips | length
            - _routes_hopcount | reject('equalto', bgp_hop_addrs | length) | length == 0

        - name: Parse local route data
          ansible.builtin.set_fact:
            _local_routes: "{{ _routes_dict }}"
          vars:
            _routes_data: "{{ _frr_route_query.stdout | from_json }}"
            _routes_ingress: "{{ _routes_data | selectattr('dst', 'in', _ingress_ips) }}"
            _routes_wnexthops: "{{ _routes_ingress | selectattr('nexthops', 'defined') }}"
            _routes_dsts: "{{ _routes_wnexthops | map(attribute='dst') }}"
            _routes_nexthops: "{{ _routes_wnexthops | map(attribute='nexthops') }}"
            _routes_gateways: "{{ _routes_nexthops | map('map', attribute='gateway') }}"
            _routes_dict: "{{ _routes_dsts | zip(_routes_gateways) | nephelaiio.plugins.to_dict }}"

        - name: Verify ingress routes on local table
          ansible.builtin.assert:
            that: _gateways | intersect(bgp_hop_addrs) | length == bgp_hop_addrs | length
            fail_msg: "Routes missing for address {{ _address }}, {{ bgp_hop_addrs | difference(_gateways) }}"
            success_msg: "Routes installed for address {{ _address }} with gateways {{ _gateways }}"
          vars:
            _address: "{{ item.key }}"
            _gateways: "{{ item.value }}"
          loop_control:
            label: "{{ _address }}"
          loop: "{{ _local_routes | dict2items }}"

      rescue:
        - name: Debug local route data
          ansible.builtin.debug:
            msg: "{{ _routes_dict }}"
          vars:
            _routes_data: "{{ _frr_route_query.stdout | from_json }}"
            _routes_ingress: "{{ _routes_data | selectattr('dst', 'in', _ingress_ips) }}"
            _routes_wnexthops: "{{ _routes_ingress | selectattr('nexthops', 'defined') }}"
            _routes_dsts: "{{ _routes_wnexthops | map(attribute='dst') }}"
            _routes_nexthops: "{{ _routes_wnexthops | map(attribute='nexthops') }}"
            _routes_gateways: "{{ _routes_nexthops | map('map', attribute='gateway') }}"
            _routes_dict: "{{ _routes_dsts | zip(_routes_gateways) | nephelaiio.plugins.to_dict }}"

        - name: Fail execution on local route verification error
          ansible.builtin.fail:
            msg: "Local route verification checks failed"

    - name: Verify HTTP/HTTPS connectivity via ingress
      block:
        - name: Wait for Ingress IPs to be assigned
          kubernetes.core.k8s_info:
            kubeconfig: "{{ molecule_local_kubeconfig }}"
            kind: Ingress
          register: _ingress_info
          vars:
            _ingresses: "{{ _ingress_info.resources | selectattr('status.loadBalancer.ingress', 'defined') | map(attribute='status.loadBalancer.ingress') }}"
            _ips: "{{ _ingresses | map('first') | map(attribute='ip') | list }}"
          until: (_ingresses | length > 0) and (_ips | length == _ingresses | length)
          retries: 15
          delay: 20

        - name: Set Ingress facts
          ansible.builtin.set_fact:
            _ingress_data: "{{ _keys | zip(_values) | map('combine') }}"
          vars:
            _ips: "{{ _ingress_info.resources | map(attribute='status.loadBalancer.ingress') | map('first') | map(attribute='ip') }}"
            _hosts: "{{ _ingress_info.resources | map(attribute='spec.tls') | map('first') | map(attribute='hosts') | map('first') }}"
            _keys: "{{ _hosts | map('nephelaiio.plugins.to_dict', 'key') }}"
            _values: "{{ _ips | map('nephelaiio.plugins.to_dict', 'value') }}"

        - name: Verify ingress endpoints
          ansible.builtin.uri:
            url: "https://{{ item.value }}"
            method: GET
            headers:
              Host: "{{ item.key }}"
            validate_certs: false
            timeout: 5
            status_code:
              - 200
              - 301
              - 302
              - 307
              - 308
          loop_control:
            label: "{{ item.key }}"
          loop: "{{ _ingress_data }}"
          changed_when: false

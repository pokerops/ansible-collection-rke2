---
# Stands in for the remote monitoring infrastructure so the cluster agents have
# somewhere to ship to. Test scaffolding only: never part of a deployed cluster.
- name: Deploy Vector test ingestor
  hosts: localhost
  connection: local
  vars:
    ingestor_name: vector-ingestor
    ingestor_namespace: monitoring
    ingestor_image: "timberio/vector:0.58.0-debian"
    ingestor_metrics_port: 9090
    ingestor_logs_port: 8989
    ingestor_api_port: 8686
    # Per file (logs.log, metrics.log): trimmed back to keep once past max.
    ingestor_max_bytes: 2147483648
    ingestor_keep_bytes: 1073741824
    # File sinks rather than a real backend: the verify playbook asserts on them.
    ingestor_config:
      data_dir: /vector-data-dir
      api:
        enabled: true
        address: "0.0.0.0:{{ ingestor_api_port }}"
      sources:
        metrics_in:
          type: prometheus_remote_write
          address: "0.0.0.0:{{ ingestor_metrics_port }}"
        logs_in:
          type: vector
          address: "0.0.0.0:{{ ingestor_logs_port }}"
          version: "2"
      transforms:
        # One line per node and unit ever seen, in a file of its own: the
        # node-logs check needs units that log once at boot and then go
        # quiet (rke2-agent), which the trimmed logs.log can't keep.
        node_units:
          type: remap
          inputs: [logs_in]
          source: |
            if !exists(.unit) { abort }
            . = {"node": .node, "unit": .unit}
        node_units_seen:
          type: dedupe
          inputs: [node_units]
          fields:
            match: [node, unit]
      sinks:
        metrics_file:
          type: file
          inputs: [metrics_in]
          path: /data/metrics.log
          encoding:
            codec: json
        logs_file:
          type: file
          inputs: [logs_in]
          path: /data/logs.log
          encoding:
            codec: json
        node_units_file:
          type: file
          inputs: [node_units_seen]
          path: /data/node-units.log
          encoding:
            codec: json
  tasks:
    - name: Create ingestor namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{ ingestor_namespace }}"

    - name: Create ingestor configuration
      kubernetes.core.k8s:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ ingestor_name }}"
            namespace: "{{ ingestor_namespace }}"
          data:
            vector.yaml: "{{ ingestor_config | to_nice_yaml(indent=2) }}"
      register: _ingestor_config

    - name: Deploy ingestor
      kubernetes.core.k8s:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        state: present
        apply: true
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: "{{ ingestor_name }}"
            namespace: "{{ ingestor_namespace }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: "{{ ingestor_name }}"
            template:
              metadata:
                labels:
                  app: "{{ ingestor_name }}"
                annotations:
                  # Restart on config change, which apply alone does not trigger.
                  checksum/config: "{{ ingestor_config | to_json | hash('sha256') }}"
              spec:
                containers:
                  - name: vector
                    image: "{{ ingestor_image }}"
                    args: ["--config", "/etc/vector/vector.yaml"]
                    ports:
                      - {containerPort: "{{ ingestor_metrics_port }}", name: metrics}
                      - {containerPort: "{{ ingestor_logs_port }}", name: logs}
                      - {containerPort: "{{ ingestor_api_port }}", name: api}
                    readinessProbe:
                      httpGet:
                        path: /health
                        port: "{{ ingestor_api_port }}"
                      initialDelaySeconds: 5
                    volumeMounts:
                      - {name: config, mountPath: /etc/vector}
                      - {name: data, mountPath: /data}
                      - {name: state, mountPath: /vector-data-dir}
                  # logs.log and metrics.log grow by ~3 GB an hour; untrimmed
                  # they fill the node's disk and the pod is evicted for disk
                  # pressure, losing everything received so far. Cuts the
                  # oldest data in place, keeping the newest ingestor_keep_bytes:
                  # the file sink appends (O_APPEND), so its writes keep landing
                  # at the new end. The cut is block-aligned, so the first line
                  # left can be partial; readers of the whole file skip lines
                  # not starting with "{".
                  - name: trim
                    image: "{{ ingestor_image }}"
                    command: ["/bin/sh", "-c"]
                    args:
                      - |
                        while true; do
                          for f in /data/logs.log /data/metrics.log; do
                            size=$(stat -c %s "$f" 2>/dev/null || echo 0)
                            if [ "$size" -gt {{ ingestor_max_bytes }} ]; then
                              cut=$(( (size - {{ ingestor_keep_bytes }}) / 4096 * 4096 ))
                              fallocate --collapse-range --offset 0 --length "$cut" "$f" &&
                                echo "level=info msg=\"trimmed ingestor file\" file=$f bytes=$cut"
                            fi
                          done
                          sleep 60
                        done
                    volumeMounts:
                      - {name: data, mountPath: /data}
                volumes:
                  - name: config
                    configMap:
                      name: "{{ ingestor_name }}"
                  - name: data
                    emptyDir: {}
                  - name: state
                    emptyDir: {}

    - name: Expose ingestor
      kubernetes.core.k8s:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        state: present
        apply: true
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: "{{ ingestor_name }}"
            namespace: "{{ ingestor_namespace }}"
          spec:
            selector:
              app: "{{ ingestor_name }}"
            ports:
              - {name: metrics, port: "{{ ingestor_metrics_port }}", targetPort: metrics}
              - {name: logs, port: "{{ ingestor_logs_port }}", targetPort: logs}
              - {name: api, port: "{{ ingestor_api_port }}", targetPort: api}

    - name: Wait for ingestor to become ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{ molecule_local_kubeconfig }}"
        kind: Pod
        namespace: "{{ ingestor_namespace }}"
        label_selectors:
          - "app={{ ingestor_name }}"
        wait: true
        wait_condition:
          type: Ready
          status: "True"
        wait_timeout: 180
      register: _ingestor_pods
      retries: "{{ _rke2_retry_num | default(30) }}"
      delay: 10
      until: _ingestor_pods.resources | length > 0

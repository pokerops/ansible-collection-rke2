---
- name: Destroy FRR router on KVM host
  import_playbook: pokerops.rke2.frr
  vars:
    rke2_frr_state: absent

- name: Restore KVM host
  hosts: rke2_server
  gather_facts: false
  connection: local
  run_once: true
  vars_files:
    - ../../playbooks/vars/main.yml
  become: true
  tasks:
    - name: Destroy api host file entry
      delegate_to: localhost
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: ".*{{ _rke2_api_url | urlsplit('hostname') }}.*"
        state: absent

- name: Archive RKE2 install logs
  hosts: rke2_server
  gather_facts: false
  become: true
  vars_files:
    - ../../playbooks/vars/main.yml
  vars:
    _logfile: "{{ molecule_install_log | default('/tmp/install') }}"
  tasks:
    - name: Ping host
      ansible.builtin.ping:
      register: _ping_check
      ignore_unreachable: true
      failed_when: false

    - name: Archive RKE2 install logs
      when: _ping_check is not unreachable
      block:
        - name: Gather facts
          ansible.builtin.setup:

        - name: Create install log directory
          ansible.builtin.file:
            dest: "{{ _logfile | dirname }}"
            state: directory
            mode: "u=rwx,go=rx"
          delegate_to: localhost
          run_once: true

        - name: Archive hostfile
          block:
            - name: Slurp hostfile
              ansible.builtin.slurp:
                src: /etc/hosts
              register: _rke2_hostfile_slurp

            - name: Create hostfile archive
              ansible.builtin.copy:
                dest: "{{ _logfile }}.{{ inventory_hostname }}.hostfile"
                content: "{{ _rke2_hostfile_slurp['content'] | b64decode }}"
                mode: "u=rw,go=r"
              delegate_to: localhost

        - name: Archive RKE2 install logs
          block:
            - name: Stat cluster configuration
              ansible.builtin.stat:
                path: "{{ _rke2_config_path }}/config.yaml"
              register: _rke2_clusterconfig_stat

            - name: Archive cluster configuration
              when: _rke2_clusterconfig_stat.stat.exists
              block:
                - name: Slurp cluster configuration
                  ansible.builtin.slurp:
                    src: "{{ _rke2_config_path }}/config.yaml"
                  register: _rke2_clusterconfig_slurp

                - name: Create cluster configuration archive
                  ansible.builtin.copy:
                    dest: "{{ _logfile }}.{{ inventory_hostname }}.config.yaml.{{ ansible_facts.date_time.iso8601_basic_short }}"
                    content: "{{ _rke2_clusterconfig_slurp['content'] | b64decode }}"
                    mode: "u=rw,go=r"
                  delegate_to: localhost

            - name: Query systemd logs
              ansible.builtin.command: journalctl -rxu rke2-server
              register: _rke2_journalctl
              changed_when: false

            - name: Create systemd log archive
              ansible.builtin.copy:
                dest: "{{ _logfile }}.{{ inventory_hostname }}.journalctl.{{ ansible_facts.date_time.iso8601_basic_short }}"
                content: "{{ _rke2_journalctl.stdout }}"
                mode: "u=rw,go=r"
              delegate_to: localhost

            - name: Stat install kubeconfig
              ansible.builtin.stat:
                path: "{{ _rke2_config_path }}/rke2.yaml"
              register: _rke2_kubeconfig_stat

            - name: Archive install kubeconfig
              when: _rke2_kubeconfig_stat.stat.exists
              block:
                - name: Slurp install kubeconfig
                  ansible.builtin.slurp:
                    src: "{{ _rke2_config_path }}/rke2.yaml"
                  register: _rke2_kubeconfig_slurp

                - name: Create install kubeconfig archive
                  ansible.builtin.copy:
                    dest: "{{ _logfile }}.{{ inventory_hostname }}.kubeconfig.install.{{ ansible_facts.date_time.iso8601_basic_short }}"
                    content: "{{ _rke2_kubeconfig_slurp['content'] | b64decode }}"
                    mode: "u=rw,go=r"
                  delegate_to: localhost

            - name: Stat user kubeconfig
              ansible.builtin.stat:
                path: "~{{ ansible_facts.user_id }}/.kube/config"
              register: _rke2_kubeconfig_stat

            - name: Archive user kubeconfig
              when: _rke2_kubeconfig_stat.stat.exists
              block:
                - name: Slurp user kubeconfig
                  ansible.builtin.slurp:
                    src: "~{{ ansible_facts.user_id }}/.kube/config"
                  register: _rke2_kubeconfig_slurp

                - name: Create install kubeconfig archive
                  ansible.builtin.copy:
                    dest: "{{ _logfile }}.{{ inventory_hostname }}.kubeconfig.user.{{ ansible_facts.date_time.iso8601_basic_short }}"
                    content: "{{ _rke2_kubeconfig_slurp['content'] | b64decode }}"
                    mode: "u=rw,go=r"
                  delegate_to: localhost

- name: Archive node diagnostics
  hosts: rke2_server:rke2_agent
  gather_facts: false
  become: true
  vars:
    _logfile: "{{ molecule_install_log | default('/tmp/install') }}"
  tasks:
    - name: Ping host
      ansible.builtin.ping:
      register: _ping_check
      ignore_unreachable: true
      failed_when: false

    - name: Archive node diagnostics
      when: _ping_check is not unreachable
      block:
        - name: Query node diagnostics
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o pipefail
              section() { printf '\n##### %s\n' "$*"; }
              section uname; uname -a
              section memory; free -m
              section "load and pressure"; uptime
              for f in cpu io memory; do echo "$f:"; cat "/proc/pressure/$f" 2>&1; done
              section "top processes by cpu"; top -b -n 1 -w 200 -o %CPU 2>&1 | head -n 30
              section "cpu sample"; vmstat 1 5 2>&1
              section "timers"; systemctl list-timers --all --no-pager 2>&1
              section "oom and kernel errors"
              journalctl -k --no-pager 2>/dev/null \
                | grep -iE 'oom|out of memory|killed process|segfault|apparmor.*denied|call trace|blocked for more' \
                | tail -n 200
              section "limits"
              sysctl fs.inotify.max_user_instances fs.inotify.max_user_watches fs.file-max 2>&1
              section "failed units"
              systemctl --failed --no-pager 2>&1
              section "rke2 agent journal"
              journalctl -u rke2-agent --no-pager -n 300 2>&1
              section "kubelet log"
              tail -n 1000 /var/lib/rancher/rke2/agent/logs/kubelet.log 2>&1
              section "containerd log"
              tail -n 500 /var/lib/rancher/rke2/agent/containerd/containerd.log 2>&1
              section "resolv.conf"
              cat /etc/resolv.conf 2>&1
              section "dmesg tail"
              dmesg 2>&1 | tail -n 200
          register: _node_diagnostics
          changed_when: false
          failed_when: false

        - name: Create node diagnostics archive
          ansible.builtin.copy:
            dest: "{{ _logfile }}.{{ inventory_hostname }}.diagnostics"
            content: "{{ _node_diagnostics.stdout }}"
            mode: "u=rw,go=r"
          delegate_to: localhost

      rescue:
        - name: Report diagnostics failure
          ansible.builtin.debug:
            msg: "Could not archive diagnostics: {{ ansible_failed_result.msg | default('unknown error') }}"

- name: Archive cluster diagnostics
  hosts: rke2_server
  gather_facts: false
  run_once: true
  become: true
  vars_files:
    - ../../playbooks/vars/main.yml
  vars:
    _logfile: "{{ molecule_install_log | default('/tmp/install') }}"
    _kubectl: "{{ _rke2_bin_path }}/kubectl --kubeconfig {{ _rke2_config_path }}/rke2.yaml"
  tasks:
    - name: Ping host
      ansible.builtin.ping:
      register: _ping_check
      ignore_unreachable: true
      failed_when: false

    - name: Archive cluster diagnostics
      when: _ping_check is not unreachable
      block:
        - name: Query cluster diagnostics
          ansible.builtin.shell:
            executable: /bin/bash
            cmd: |
              set -o pipefail
              section() { printf '\n##### %s\n' "$*"; }
              K="{{ _kubectl }} --request-timeout=30s"
              section nodes; $K get nodes -o wide 2>&1
              section "node resource usage"; $K top nodes 2>&1
              section "pod resource usage by cpu"; $K top pods -A --sort-by=cpu 2>&1 | head -n 30
              section "pod resource usage by memory"; $K top pods -A --sort-by=memory 2>&1 | head -n 30
              section "pods"; $K get pods -A -o wide 2>&1
              section "events"; $K get events -A --sort-by=.lastTimestamp 2>&1 | tail -n 300
              section "persistent volume claims"; $K get pvc -A 2>&1
              section "longhorn volumes"; $K get volumes.longhorn.io -n longhorn-system 2>&1
              # Pods that are not Ready, are not finished jobs, or have restarted
              $K get pods -A --no-headers 2>/dev/null | awk '
                { split($3, r, "/") }
                ($4 != "Completed" && $4 != "Succeeded" && (r[1] != r[2] || $4 != "Running")) || $5 + 0 > 0 { print $1, $2 }
              ' | while read -r ns pod; do
                section "describe $ns/$pod"; $K describe pod -n "$ns" "$pod" 2>&1
                section "logs $ns/$pod"; $K logs -n "$ns" "$pod" --all-containers --prefix --tail=200 --ignore-errors 2>&1
                section "previous logs $ns/$pod"; $K logs -n "$ns" "$pod" --all-containers --prefix --tail=200 --previous --ignore-errors 2>&1
              done
          register: _cluster_diagnostics
          changed_when: false
          failed_when: false

        - name: Create cluster diagnostics archive
          ansible.builtin.copy:
            dest: "{{ _logfile }}.cluster.diagnostics"
            content: "{{ _cluster_diagnostics.stdout }}"
            mode: "u=rw,go=r"
          delegate_to: localhost

      rescue:
        - name: Report diagnostics failure
          ansible.builtin.debug:
            msg: "Could not archive diagnostics: {{ ansible_failed_result.msg | default('unknown error') }}"

- name: Clean ingress hostfile entries
  hosts: rke2_server
  gather_facts: false
  vars_files:
    - ../../playbooks/vars/main.yml
  tasks:
    - name: Ping host
      ansible.builtin.ping:
      register: _ping_check
      ignore_unreachable: true
      failed_when: false

    - name: Remove ingress entrypoint definitions
      run_once: true
      when: _ping_check is not unreachable
      block:
        - name: Query cluster ingresses
          ansible.builtin.command:
            cmd: "{{ _rke2_bin_path }}/kubectl get ingresses -A -o json --kubeconfig {{ _rke2_config_path }}/rke2.yaml"
          register: _ingress_query
          changed_when: false
          become: true
          ignore_errors: true

        - name: Skip on ingress query failure
          ansible.builtin.meta: end_play
          when: _ingress_query is failed

        - name: Set ingress facts
          ansible.builtin.set_fact:
            _ingress_hosts: "{{ _ingress_data['items'] | map(attribute='spec.rules') | map('map', attribute='host') | flatten }}"
          vars:
            _ingress_data: "{{ _ingress_query.stdout | from_json }}"

        - name: Remove ingress endpoints from local hostfile
          ansible.builtin.lineinfile:
            path: /etc/hosts
            regexp: ".*{{ item }}.*"
            state: absent
          loop: "{{ _ingress_hosts }}"
          become: true
          delegate_to: localhost

- name: Import libvirt destroy playbook
  import_playbook: nephelaiio.libvirt.destroy

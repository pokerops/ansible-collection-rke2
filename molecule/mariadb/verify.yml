---
- name: Verify Velero MariaDB backup and restore
  hosts: localhost
  gather_facts: true
  vars:
    mariadb_namespace: "{{ molecule_namespace | default('molecule') }}"
    mariadb_name: "molecule-mariadb"
    mariadb_database: "testdb"
    mariadb_port: 3306
    mariadb_root_secret_name: "mariadb-root-secret"
    mariadb_root_password: "molecule-password"
    backup_name: "molecule-mariadb-backup-{{ ansible_date_time.epoch }}"
    restore_name: "molecule-mariadb-restore-{{ ansible_date_time.epoch }}"
    kubeconfig_path: "{{ molecule_local_kubeconfig }}"
    mariadb_operator_namespace: "mariadb-operator"
    mariadb_operator_deployment: "mariadb-operator"
    mariadb_chart_version: "26.6.0"
    mariadb_chart_repo: "ghcr.io/mariadb-operator/charts"
    # Single-replica Longhorn class. Velero's CSI data mover provisions its backup
    # PVC from the source PVC's storage class, so a 3-replica class makes every
    # DataUpload clone 3x the volume before the backup pod can start.
    mariadb_storage_class: "{{ molecule_storage_class | default('mariadb') }}"
  tasks:

    # Checked before anything is deployed: unset, converge skipped the whole
    # monitoring stack, so the assertions below cannot pass and failing here
    # costs seconds instead of a cluster build plus two ten minute waits.
    - name: Verify the monitoring collector is enabled
      ansible.builtin.assert:
        that: rke2_monitoring_endpoint | default('') | length > 0
        fail_msg: >-
          rke2_monitoring_endpoint is unset, so converge skipped the monitoring
          stack and nothing ships to the ingestor. Set it in the scenario
          inventory.
        success_msg: "Collector ships to {{ rke2_monitoring_endpoint }}"

    # Setup rather than backup coverage, so it sits outside the Velero block: a
    # cluster that never starts reports itself instead of surfacing as a backup
    # failure with a page of Velero diagnostics.
    - name: Deploy the MariaDB test cluster
      block:
        - name: Destroy existing MariaDB deployment
          block:
            - name: Delete existing MariaDB cluster gracefully
              block:
                - name: Delete MariaDB cluster
                  kubernetes.core.k8s:
                    kubeconfig: "{{ kubeconfig_path }}"
                    api_version: k8s.mariadb.com/v1alpha1
                    kind: MariaDB
                    name: "{{ mariadb_name }}"
                    namespace: "{{ mariadb_namespace }}"
                    state: absent
                    wait: true
                    wait_timeout: 300

              rescue:
                - name: Remove finalizers from MariaDB cluster
                  kubernetes.core.k8s:
                    kubeconfig: "{{ kubeconfig_path }}"
                    api_version: k8s.mariadb.com/v1alpha1
                    kind: MariaDB
                    name: "{{ mariadb_name }}"
                    namespace: "{{ mariadb_namespace }}"
                    definition:
                      metadata:
                        finalizers: []
                    state: present
                    merge_type: merge

                - name: Force delete MariaDB cluster
                  kubernetes.core.k8s:
                    kubeconfig: "{{ kubeconfig_path }}"
                    api_version: k8s.mariadb.com/v1alpha1
                    kind: MariaDB
                    name: "{{ mariadb_name }}"
                    namespace: "{{ mariadb_namespace }}"
                    state: absent
                    wait: false

            - name: Query existing PVCs
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                namespace: "{{ mariadb_namespace }}"
              register: _pvc_query

            - name: Force delete existing PVCs
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                name: "{{ item }}"
                namespace: "{{ mariadb_namespace }}"
                state: absent
              loop: "{{ _pvc_query.resources | map(attribute='metadata.name') }}"

            - name: Wait for PVC deletion to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: v1
                kind: PersistentVolumeClaim
                namespace: "{{ mariadb_namespace }}"
              register: _pvc_query
              until: _pvc_query.resources | length == 0
              retries: 30
              delay: 10

        - name: Create MariaDB test namespace
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            name: "{{ mariadb_namespace }}"
            api_version: v1
            kind: Namespace
            state: present

        - name: Deploy single-replica Longhorn storage class
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: present
            apply: true
            definition:
              apiVersion: storage.k8s.io/v1
              kind: StorageClass
              metadata:
                name: "{{ mariadb_storage_class }}"
              provisioner: driver.longhorn.io
              allowVolumeExpansion: true
              reclaimPolicy: Delete
              volumeBindingMode: Immediate
              parameters:
                numberOfReplicas: "1"
                staleReplicaTimeout: "30"
                fsType: ext4

        - name: Create MariaDB root password secret
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: v1
              kind: Secret
              metadata:
                name: "{{ mariadb_root_secret_name }}"
                namespace: "{{ mariadb_namespace }}"
              type: Opaque
              stringData:
                password: "{{ mariadb_root_password }}"
            state: present

        - name: Deploy MariaDB cluster
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: k8s.mariadb.com/v1alpha1
              kind: MariaDB
              metadata:
                name: "{{ mariadb_name }}"
                namespace: "{{ mariadb_namespace }}"
                labels:
                  environment: molecule
              spec:
                rootPasswordSecretKeyRef:
                  name: "{{ mariadb_root_secret_name }}"
                  key: password
                storage:
                  size: 2Gi
                  storageClassName: "{{ mariadb_storage_class }}"
                service:
                  type: LoadBalancer
                  annotations:
                    metallb.universe.tf/address-pool: metallb-private
                replicas: 1
                # The operator deploys a mysqld-exporter and creates the
                # ServiceMonitor itself, so nothing here declares a monitor.
                # username and passwordSecretKeyRef are defaulted by the
                # operator, which provisions the monitoring user for them.
                metrics:
                  enabled: true
                resources:
                  requests:
                    cpu: 100m
                    memory: 128Mi
                  limits:
                    cpu: 500m
                    memory: 512Mi
            state: present

        - name: Wait for MariaDB cluster to be ready
          block:
            - name: Poll MariaDB cluster Ready condition
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: k8s.mariadb.com/v1alpha1
                kind: MariaDB
                name: "{{ mariadb_name }}"
                namespace: "{{ mariadb_namespace }}"
              register: _mariadb_query
              until:
                - _mariadb_query.resources | length > 0
                - _mariadb_query.resources[0].status is defined
                - _mariadb_query.resources[0].status.conditions is defined
                - _mariadb_query.resources[0].status.conditions
                  | selectattr('type', 'equalto', 'Ready')
                  | selectattr('status', 'equalto', 'True')
                  | list | length > 0
              retries: 60
              delay: 20

          rescue:
            - name: Debug MariaDB cluster startup failure
              ansible.builtin.debug:
                var: _mariadb_query

            - name: Fail the playbook if MariaDB cluster is not ready
              ansible.builtin.fail:
                msg: "MariaDB cluster {{ mariadb_name }} did not become ready before timeout."

    - name: Verify mariadb metrics collection
      block:
        # Unlike strimzi and zalando, nothing in this collection declares a
        # monitor for mariadb: spec.metrics.enabled makes the operator both
        # deploy the exporter and create the ServiceMonitor. Its presence is
        # therefore the evidence that metrics are enabled at all.
        - name: Query the operator-created ServiceMonitor
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: monitoring.coreos.com/v1
            kind: ServiceMonitor
            namespace: "{{ mariadb_namespace }}"
          register: _mariadb_monitor
          retries: 30
          delay: 10
          until: _mariadb_monitor.resources | length > 0

        - name: Set exporter monitor facts
          ansible.builtin.set_fact:
            _monitor_selector: "{{ _mariadb_monitor.resources | first | json_query('spec.selector.matchLabels') }}"

        # Driven off the monitor's own selector rather than a hardcoded
        # label: an empty result here is exactly the failure the
        # namespace-coverage assert cannot see, a monitor that matches
        # nothing and so reports success while scraping air.
        - name: Query services the monitor selects
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Service
            namespace: "{{ mariadb_namespace }}"
            label_selectors: "{{ _monitor_selector.keys() | zip(_monitor_selector.values()) | map('join', '=') | list }}"
          register: _exporter_svc
          retries: 30
          delay: 10
          until: _exporter_svc.resources | length > 0

        - name: Verify the monitor selector matches a service
          ansible.builtin.assert:
            that: _exporter_svc.resources | length > 0
            fail_msg: >-
              The operator created a ServiceMonitor but its selector
              {{ _monitor_selector }} matches no service, so it scrapes
              nothing and still reports success to alloy.
            success_msg: "Monitor selector matches {{ _exporter_svc.resources | length }} service(s)"

        - name: Set exporter scrape facts
          ansible.builtin.set_fact:
            _exporter_target: "{{ _svc.metadata.name }}.{{ mariadb_namespace }}.svc.cluster.local:{{ _svc.spec.ports | first | json_query('port') }}"
          vars:
            _svc: "{{ _exporter_svc.resources | first }}"

        - name: Scrape the mysqld exporter
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig {{ kubeconfig_path }}
              run mariadb-metrics-probe-{{ 999 | random }} -n {{ mariadb_namespace }}
              --rm -i --restart=Never --image=curlimages/curl:8.11.1 --
              curl -sS --max-time 10 http://{{ _exporter_target }}/metrics
          register: _exporter_metrics
          changed_when: false
          retries: 10
          delay: 15
          until:
            - _exporter_metrics.rc == 0
            - "'mysql_up' in _exporter_metrics.stdout"

        # mysql_up 0 means the exporter is running but cannot authenticate.
        # The operator defaults metrics.username and passwordSecretKeyRef
        # and provisions that user itself, so a zero here means that
        # provisioning failed rather than a misconfiguration on our side.
        - name: Verify the exporter is connected to mariadb
          ansible.builtin.assert:
            that: _mysql_up | length > 0
            fail_msg: >-
              The exporter serves metrics but reports mysql_up 0: it cannot
              authenticate. The operator did not provision the monitoring
              user it defaulted onto spec.metrics.
            success_msg: "Exporter reports mysql_up 1"
          vars:
            _mysql_up: "{{ _exporter_metrics.stdout_lines | select('match', '^mysql_up 1') | list }}"

        - name: Query ingestor pod
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            kind: Pod
            namespace: monitoring
            label_selectors:
              - "app=vector-ingestor"
            field_selectors:
              - status.phase=Running
          register: _ingestor_query
          retries: 30
          delay: 10
          until: _ingestor_query.resources | length > 0

        - name: Wait for mariadb metrics to reach the ingestor
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig {{ kubeconfig_path }}
              exec -n monitoring {{ _ingestor_query.resources | first | json_query('metadata.name') }}
              -- sh -c "grep -c mysql_up /data/metrics.log || true"
          register: _ingested_mysql
          changed_when: false
          retries: 40
          delay: 15
          until:
            - _ingested_mysql.rc == 0
            - (_ingested_mysql.stdout | trim | int) > 0

        - name: Verify mariadb metrics are collected end to end
          ansible.builtin.assert:
            that: (_ingested_mysql.stdout | trim | int) > 0
            fail_msg: >-
              The exporter serves metrics but none reached the ingestor.
              Alloy is not scraping the ServiceMonitor the operator created.
            success_msg: "Ingestor received {{ _ingested_mysql.stdout | trim }} mysql_up events"

        # Matches the kafka and postgres checks: the CR-state series are the
        # only signal that a cluster exists at all, so they are worth as
        # much as the pod metrics themselves.
        - name: Wait for mariadb CR state metrics to reach the ingestor
          ansible.builtin.command:
            cmd: >-
              kubectl --kubeconfig {{ kubeconfig_path }}
              exec -n monitoring {{ _ingestor_query.resources | first | json_query('metadata.name') }}
              -- sh -c "grep -c kube_mariadb_created /data/metrics.log || true"
          register: _ingested_crstate
          changed_when: false
          retries: 40
          delay: 15
          until:
            - _ingested_crstate.rc == 0
            - (_ingested_crstate.stdout | trim | int) > 0

        - name: Verify mariadb CR state metrics are collected end to end
          ansible.builtin.assert:
            that: (_ingested_crstate.stdout | trim | int) > 0
            fail_msg: >-
              No kube_mariadb_created series reached the ingestor although a
              MariaDB cluster exists. Either the kube-state-metrics
              customResourceState config or its RBAC rule for
              k8s.mariadb.com is not producing the series.
            success_msg: "Ingestor received {{ _ingested_crstate.stdout | trim }} kube_mariadb_created events"

    - name: Test MariaDB Velero backup and restore
      block:
        - name: Wait for MariaDB LoadBalancer to get external IP
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Service
            name: "{{ mariadb_name }}"
            namespace: "{{ mariadb_namespace }}"
          register: _lb_query
          until:
            - _lb_query.resources[0].status.loadBalancer is defined
            - _lb_query.resources[0].status.loadBalancer.ingress is defined
            - _lb_query.resources[0].status.loadBalancer.ingress | length > 0
          retries: 30
          delay: 10

        - name: Set MariaDB external IP fact
          ansible.builtin.set_fact:
            mariadb_external_ip: "{{ _lb_query.resources[0].status.loadBalancer.ingress[0].ip }}"

        - name: Wait for MariaDB port to be accessible
          ansible.builtin.wait_for:
            host: "{{ mariadb_external_ip }}"
            port: "{{ mariadb_port }}"
            timeout: 300

        - name: Create test database
          community.mysql.mysql_db:
            login_host: "{{ mariadb_external_ip }}"
            login_port: "{{ mariadb_port }}"
            login_user: root
            login_password: "{{ mariadb_root_password }}"
            name: "{{ mariadb_database }}"
            state: present

        - name: Create test table
          community.mysql.mysql_query:
            login_host: "{{ mariadb_external_ip }}"
            login_port: "{{ mariadb_port }}"
            login_user: root
            login_password: "{{ mariadb_root_password }}"
            login_db: "{{ mariadb_database }}"
            query: >
              CREATE TABLE IF NOT EXISTS test_entries
              (id INT AUTO_INCREMENT PRIMARY KEY, value VARCHAR(255) NOT NULL)

        - name: Insert test rows
          community.mysql.mysql_query:
            login_host: "{{ mariadb_external_ip }}"
            login_port: "{{ mariadb_port }}"
            login_user: root
            login_password: "{{ mariadb_root_password }}"
            login_db: "{{ mariadb_database }}"
            query: >
              INSERT INTO test_entries (value) VALUES
              ('row-01'),('row-02'),('row-03'),('row-04'),('row-05'),
              ('row-06'),('row-07'),('row-08'),('row-09'),('row-10')

        - name: Get pre-backup row count
          community.mysql.mysql_query:
            login_host: "{{ mariadb_external_ip }}"
            login_port: "{{ mariadb_port }}"
            login_user: root
            login_password: "{{ mariadb_root_password }}"
            login_db: "{{ mariadb_database }}"
            query: "SELECT COUNT(*) FROM test_entries"
          register: _count_before

        - name: Store pre-backup row count
          ansible.builtin.set_fact:
            mariadb_row_count_before: "{{ _count_before.query_result | first | first }}"

        - name: Display pre-backup row count
          ansible.builtin.debug:
            msg: "Pre-backup row count: {{ mariadb_row_count_before }}"

        - name: Report Longhorn capacity before backup
          block:
            - name: Query Longhorn scheduling floor
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: longhorn.io/v1beta2
                kind: Setting
                name: storage-minimal-available-percentage
                namespace: longhorn-system
              register: _lh_floor_query
              failed_when: false

            - name: Query Longhorn node capacity
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: longhorn.io/v1beta2
                kind: Node
                namespace: longhorn-system
              register: _lh_capacity_query
              failed_when: false

            - name: Debug Longhorn capacity headroom
              ansible.builtin.debug:
                msg: >-
                  {{ item.metadata.name }}
                  max={{ (_max | int / _gib) | round(1) }}GiB
                  avail={{ (_avail | int / _gib) | round(1) }}GiB
                  scheduled={{ (_sched | int / _gib) | round(1) }}GiB
                  avail_pct={{ (_avail | int / (_max | int) * 100) | round(1) }}
                  floor_pct={{ _floor }}
                  headroom={{ ((_avail | int - (_max | int * (_floor | int) / 100)) / _gib) | round(1) }}GiB
              vars:
                _gib: 1073741824
                _floor: "{{ _lh_floor_query.resources | default([]) | map(attribute='value') | list | first | default(25) }}"
                _disks: "{{ item.status.diskStatus | default({}) | dict2items | map(attribute='value') | list }}"
                _max: "{{ _disks | map(attribute='storageMaximum') | list | first | default(0) }}"
                _avail: "{{ _disks | map(attribute='storageAvailable') | list | first | default(0) }}"
                _sched: "{{ _disks | map(attribute='storageScheduled') | list | first | default(0) }}"
              when: (_max | int) > 0
              loop: "{{ _lh_capacity_query.resources | default([]) }}"
              loop_control:
                label: "{{ item.metadata.name }}"

        - name: Create Velero backup
          block:
            - name: Create Velero backup of MariaDB namespace
              kubernetes.core.k8s:
                kubeconfig: "{{ kubeconfig_path }}"
                definition:
                  apiVersion: velero.io/v1
                  kind: Backup
                  metadata:
                    name: "{{ backup_name }}"
                    namespace: velero
                    labels:
                      app.kubernetes.io/managed-by: ansible
                      backup.velero.io/type: mariadb
                  spec:
                    includedNamespaces:
                      - "{{ mariadb_namespace }}"
                    volumeSnapshotLocations: []
                    includeClusterResources: true
                    defaultVolumesToFsBackup: false
                    excludedResources: []
                    snapshotMoveData: true
                    storageLocation: "{{ rke2_velero_s3_storage }}"
                    csiSnapshotTimeout: 5m
                    itemOperationTimeout: 10m
                    ttl: "72h0m0s"
                state: present

            - name: Wait for Velero backup to complete
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: velero.io/v1
                kind: Backup
                name: "{{ backup_name }}"
                namespace: velero
              register: _backup_query
              until:
                - _backup_query.resources | length == 1
                - _backup_query.resources[0].status.phase is defined
                - _backup_query.resources[0].status.phase in ["Completed", "PartiallyFailed", "Failed", "FailedValidation"]
              retries: 60
              delay: 10

            - name: Verify backup completed successfully
              ansible.builtin.assert:
                that: _backup_query.resources[0].status.phase == "Completed"
                fail_msg: >-
                  Backup failed with status: {{ _backup_query.resources[0].status.phase }}.
                  Errors: {{ _backup_query.resources[0].status.errors | default([]) }}
                  Warnings: {{ _backup_query.resources[0].status.warnings | default(0) }}
                success_msg: "Backup completed successfully"

            - name: Verify backup moved volume data to object storage
              kubernetes.core.k8s_info:
                kubeconfig: "{{ kubeconfig_path }}"
                api_version: velero.io/v2alpha1
                kind: DataUpload
                namespace: velero
                label_selectors:
                  - "velero.io/backup-name={{ backup_name }}"
              register: _upload_query
              until:
                - _upload_query.resources | length > 0
                - _upload_query.resources
                  | selectattr('status.phase', 'defined')
                  | map(attribute='status.phase') | list
                  | reject('in', ['Completed', 'Failed', 'Canceled']) | list | length == 0
              retries: 30
              delay: 10

            - name: Assert backup DataUpload completed successfully
              ansible.builtin.assert:
                that:
                  - _upload_query.resources | length > 0
                  - _upload_query.resources
                    | selectattr('status.phase', 'equalto', 'Completed')
                    | list | length > 0
                fail_msg: No DataUpload completed for backup {{ backup_name }}

        - name: Display backup completion details
          ansible.builtin.debug:
            msg: |
              Backup Status:
              - Name: {{ backup_name }}
              - Phase: {{ _backup_query.resources[0].status.phase }}
              - Start Time: {{ _backup_query.resources[0].status.startTimestamp }}
              - Completion Time: {{ _backup_query.resources[0].status.completionTimestamp }}
              - Items Backed Up: {{ _backup_query.resources[0].status.progress.itemsBackedUp | default(0) }}

        - name: Delete MariaDB cluster
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: k8s.mariadb.com/v1alpha1
            kind: MariaDB
            name: "{{ mariadb_name }}"
            namespace: "{{ mariadb_namespace }}"
            state: absent
            wait: true
            wait_timeout: 300

        - name: Query existing PVCs
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ mariadb_namespace }}"
          register: _pvc_query

        - name: Force delete existing PVCs
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            name: "{{ item }}"
            namespace: "{{ mariadb_namespace }}"
            state: absent
          loop: "{{ _pvc_query.resources | map(attribute='metadata.name') }}"

        - name: Wait for PVC deletion to complete
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ mariadb_namespace }}"
          register: _pvc_query
          until: _pvc_query.resources | length == 0
          retries: 30
          delay: 10

        - name: Disable ArgoCD auto-sync for mariadb-operator
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: patched
            api_version: argoproj.io/v1alpha1
            kind: Application
            name: mariadb-operator
            namespace: argocd
            definition:
              spec:
                syncPolicy:
                  automated:
                    enabled: false

        - name: Scale down mariadb-operator
          kubernetes.core.k8s_scale:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: apps/v1
            kind: Deployment
            name: "{{ mariadb_operator_deployment }}"
            namespace: "{{ mariadb_operator_namespace }}"
            replicas: 0
            wait: true
            wait_timeout: 120

        - name: Restore MariaDB database
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            definition:
              apiVersion: velero.io/v1
              kind: Restore
              metadata:
                name: "{{ restore_name }}"
                namespace: velero
                labels:
                  app.kubernetes.io/managed-by: ansible
                  restore.velero.io/backup: "{{ backup_name }}"
              spec:
                backupName: "{{ backup_name }}"
                includedNamespaces:
                  - "{{ mariadb_namespace }}"
                restorePVs: true
                includeClusterResources: false
                includedResources:
                  - persistentvolumeclaims
                  - secrets
                  - configmaps
                  - mariadbs.k8s.mariadb.com
                existingResourcePolicy: update
            state: present

        - name: Wait for Velero restore to complete
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v1
            kind: Restore
            name: "{{ restore_name }}"
            namespace: velero
          register: _restore_query
          until:
            - _restore_query.resources[0].status.phase is defined
            - _restore_query.resources[0].status.phase in ["Completed", "PartiallyFailed", "Failed", "FailedValidation"]
          retries: 60
          delay: 10

        - name: Verify restore completed successfully
          ansible.builtin.assert:
            that: _restore_query.resources[0].status.phase == "Completed"
            fail_msg: >-
              Restore phase is {{ _restore_query.resources[0].status.phase }}.
              Errors: {{ _restore_query.resources[0].status.errors | default('n/a') }}
              Warnings: {{ _restore_query.resources[0].status.warnings | default('n/a') }}

        - name: Query restore DataDownloads
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v2alpha1
            kind: DataDownload
            namespace: velero
            label_selectors:
              - "velero.io/restore-name={{ restore_name }}"
          register: _download_query
          until:
            - _download_query.resources | length > 0
            - _download_query.resources
              | selectattr('status.phase', 'defined')
              | map(attribute='status.phase') | list
              | reject('in', ['Completed', 'Failed', 'Canceled']) | list | length == 0
          retries: 30
          delay: 10

        - name: Verify DataDownload completed successfully
          ansible.builtin.assert:
            that:
              - _download_query.resources | length > 0
              - _download_query.resources
                | selectattr('status.phase', 'equalto', 'Completed')
                | list | length > 0
            fail_msg: >-
              No completed DataDownload for restore {{ restore_name }} — the PVC may
              have been recreated empty instead of restored from object storage.

        - name: Verify restored PVCs are bound
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ mariadb_namespace }}"
          register: _restored_pvcs
          until:
            - _restored_pvcs.resources | length > 0
            - _restored_pvcs.resources
              | rejectattr('status.phase', 'equalto', 'Bound')
              | list | length == 0
          retries: 30
          delay: 10

        - name: Scale up mariadb-operator
          kubernetes.core.k8s_scale:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: apps/v1
            kind: Deployment
            name: "{{ mariadb_operator_deployment }}"
            namespace: "{{ mariadb_operator_namespace }}"
            replicas: 1
            wait: true
            wait_timeout: 120

        - name: Enable ArgoCD auto-sync for mariadb-operator
          kubernetes.core.k8s:
            kubeconfig: "{{ kubeconfig_path }}"
            state: patched
            api_version: argoproj.io/v1alpha1
            kind: Application
            name: mariadb-operator
            namespace: argocd
            definition:
              spec:
                syncPolicy:
                  automated:
                    enabled: true

        - name: Wait for MariaDB cluster to be ready after restore
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: k8s.mariadb.com/v1alpha1
            kind: MariaDB
            name: "{{ mariadb_name }}"
            namespace: "{{ mariadb_namespace }}"
          register: _mariadb_query
          until:
            - _mariadb_query.resources | length > 0
            - _mariadb_query.resources[0].status is defined
            - _mariadb_query.resources[0].status.conditions is defined
            - _mariadb_query.resources[0].status.conditions
              | selectattr('type', 'equalto', 'Ready')
              | selectattr('status', 'equalto', 'True')
              | list | length > 0
          retries: 60
          delay: 20

        - name: Wait for restored MariaDB LoadBalancer to get external IP
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Service
            name: "{{ mariadb_name }}"
            namespace: "{{ mariadb_namespace }}"
          register: _lb_query
          until:
            - _lb_query.resources[0].status.loadBalancer is defined
            - _lb_query.resources[0].status.loadBalancer.ingress is defined
            - _lb_query.resources[0].status.loadBalancer.ingress | length > 0
          retries: 30
          delay: 10

        - name: Set restored MariaDB external IP fact
          ansible.builtin.set_fact:
            mariadb_external_ip: "{{ _lb_query.resources[0].status.loadBalancer.ingress[0].ip }}"

        - name: Wait for restored MariaDB port to be accessible
          ansible.builtin.wait_for:
            host: "{{ mariadb_external_ip }}"
            port: "{{ mariadb_port }}"
            timeout: 300

        - name: Get post-restore row count
          community.mysql.mysql_query:
            login_host: "{{ mariadb_external_ip }}"
            login_port: "{{ mariadb_port }}"
            login_user: root
            login_password: "{{ mariadb_root_password }}"
            login_db: "{{ mariadb_database }}"
            query: "SELECT COUNT(*) FROM test_entries"
          register: _count_after
          until: _count_after is succeeded
          retries: 30
          delay: 10

        - name: Store post-restore row count
          ansible.builtin.set_fact:
            mariadb_row_count_after: "{{ _count_after.query_result | first | first }}"

        - name: Assert row counts match after restore
          ansible.builtin.assert:
            that:
              - mariadb_row_count_before == mariadb_row_count_after
            fail_msg: >-
              Row count mismatch after restore!
              Before backup: {{ mariadb_row_count_before }}
              After restore: {{ mariadb_row_count_after }}
            success_msg: "Data integrity verified: {{ mariadb_row_count_after }} rows restored successfully."

        - name: Display verification summary
          ansible.builtin.debug:
            msg: |
              MariaDB Velero Backup and Restore Verification Completed Successfully!

              Summary:
              - Backup Name: {{ backup_name }}
              - Restore Name: {{ restore_name }}
              - Database: {{ mariadb_database }}
              - Rows Before Backup: {{ mariadb_row_count_before }}
              - Rows After Restore: {{ mariadb_row_count_after }}

              All verification tests passed!

      rescue:
        - name: Query MariaDB operator pods
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: "{{ mariadb_operator_namespace }}"
          register: _operator_pods

        - name: Debug MariaDB operator pods
          ansible.builtin.debug:
            msg: "{{ _operator_pods }}"

        - name: Query MariaDB clusters
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: k8s.mariadb.com/v1alpha1
            kind: MariaDB
            namespace: "{{ mariadb_namespace }}"
          register: _mariadb_query

        - name: Debug MariaDB clusters
          ansible.builtin.debug:
            msg: "{{ _mariadb_query }}"

        - name: Query MariaDB pods
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: "{{ mariadb_namespace }}"
          register: _mariadb_pods

        - name: Debug MariaDB pods
          ansible.builtin.debug:
            msg: "{{ _mariadb_pods }}"

        - name: Query MariaDB PVCs
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: PersistentVolumeClaim
            namespace: "{{ mariadb_namespace }}"
          register: _mariadb_pvcs

        - name: Debug MariaDB PVCs
          ansible.builtin.debug:
            msg: "{{ _mariadb_pvcs }}"

        - name: Query Velero backups
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v1
            kind: Backup
            namespace: velero
          register: _backup_query
          retries: 60
          delay: 15

        - name: Debug Velero backups
          ansible.builtin.debug:
            msg: "{{ _backup_query }}"

        - name: Query Velero restores
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v1
            kind: Restore
            namespace: velero
          register: _restore_query

        - name: Debug Velero restores
          ansible.builtin.debug:
            msg: "{{ _restore_query }}"

        - name: Query restore DataDownloads
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v2alpha1
            kind: DataDownload
          register: _download_query

        - name: Debug Velero DataDownloads
          ansible.builtin.debug:
            msg: "{{ _download_query }}"

        - name: Query backup DataUploads
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: velero.io/v2alpha1
            kind: DataUpload
            namespace: velero
          register: _upload_query

        - name: Debug backup DataUploads
          ansible.builtin.debug:
            msg: "{{ _upload_query }}"

        - name: Query VolumeSnapshotClasses
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: snapshot.storage.k8s.io/v1
            kind: VolumeSnapshotClass
          register: _vsc_query

        - name: Debug VolumeSnapshotClasses
          ansible.builtin.debug:
            msg: "{{ _vsc_query.resources | map(attribute='metadata') | list }}"

        - name: Query VolumeSnapshots
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: snapshot.storage.k8s.io/v1
            kind: VolumeSnapshot
            namespace: velero
          register: _vs_query

        - name: Debug VolumeSnapshots
          ansible.builtin.debug:
            msg: "{{ _vs_query }}"

        - name: Query VolumeSnapshotContents
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: snapshot.storage.k8s.io/v1
            kind: VolumeSnapshotContent
          register: _vscontent_query

        - name: Debug VolumeSnapshotContents
          ansible.builtin.debug:
            msg: "{{ _vscontent_query }}"

        - name: Query Velero node-agent pods
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: velero
            label_selectors:
              - "name=node-agent"
          register: _nodeagent_query

        - name: Debug Velero node-agent pods
          ansible.builtin.debug:
            msg: >-
              {{ _nodeagent_query.resources
                 | map(attribute='status.phase') | list }}

        - name: Query Velero server deployment
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: apps/v1
            kind: Deployment
            namespace: velero
            name: velero
          register: _velero_deploy

        - name: Debug Velero server args
          ansible.builtin.debug:
            msg: "{{ _arguments }}"
          vars:
            _deployments: "{{ _velero_deploy.resources }}"
            _containers: "{{ _deployments | map(attribute='spec.template.spec.containers') | flatten }}"
            _arguments: "{{ _containers | map(attribute='args') }}"

        - name: Query Velero server pod
          kubernetes.core.k8s_info:
            kubeconfig: "{{ kubeconfig_path }}"
            api_version: v1
            kind: Pod
            namespace: velero
            label_selectors:
              - "name=velero"
          register: _velero_pod_query

        - name: Get Velero server logs
          kubernetes.core.k8s_log:
            kubeconfig: "{{ kubeconfig_path }}"
            namespace: velero
            name: "{{ _velero_pod_query.resources | map(attribute='metadata.name') | first }}"
            container: velero
          register: _velero_log
          when: _velero_pod_query.resources | length > 0

        - name: Debug Velero warning/snapshot log lines
          ansible.builtin.debug:
            msg: >-
              {{ _velero_log.log_lines | default([])
                 | select('search', 'level=warning|skip|snapshot|VolumeSnapshot') | list }}

        - name: Terminate playbook
          ansible.builtin.fail:
            msg: "backup verification failed"

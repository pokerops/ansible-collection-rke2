---
# Host-level POSIX mount for the local short-retention log destination.
# Runs on every node - agents need it so Vector can write, server nodes need
# it so admins can read. Same mount, both purposes; no separate variant.
- name: Resolve cluster DNS for the local log retention mount
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - main.yml
  tasks:
    - name: End play when local log retention is not enabled
      ansible.builtin.meta: end_play
      when: not (rke2_seaweedfs_logs_enable | default(false) | bool)

    # weed mount runs as a bare host-level systemd unit, not a pod - it has
    # none of the cluster-DNS resolution kubelet injects into every pod's
    # own /etc/resolv.conf.
    - name: Create local kubeconfig tempdir
      ansible.builtin.tempfile:
        state: directory
        suffix: weed-mount-kubeconfig
      register: _weed_kubeconfig_tempdir
      changed_when: false

    - name: Slurp cluster kubeconfig from a server node
      ansible.builtin.slurp:
        src: "{{ _rke2_config_path }}/rke2.yaml"
      register: _weed_kubeconfig_slurp
      become: true
      delegate_to: "{{ groups[rke2_server_group][0] }}"

    - name: Write local kubeconfig
      ansible.builtin.copy:
        dest: "{{ _weed_kubeconfig_tempdir.path }}/kubeconfig.yaml"
        content: "{{ _weed_kubeconfig_data | combine(_weed_kubeconfig_override) | to_nice_json(indent=2) }}"
        mode: "u=rw,go=r"
      vars:
        _weed_kubeconfig_data: "{{ _weed_kubeconfig_slurp['content'] | b64decode | from_yaml }}"
        _weed_kubeconfig_cluster: "{{ _weed_kubeconfig_data.clusters[0] }}"
        _weed_kubeconfig_override:
          clusters:
            - name: "{{ _weed_kubeconfig_cluster.name }}"
              cluster:
                server: "{{ _rke2_api_url }}"
                certificate-authority-data: "{{ _weed_kubeconfig_cluster.cluster['certificate-authority-data'] }}"
      changed_when: false

    - name: Look up the cluster CoreDNS service
      kubernetes.core.k8s_info:
        kubeconfig: "{{ _weed_kubeconfig_tempdir.path }}/kubeconfig.yaml"
        api_version: v1
        kind: Service
        name: rke2-coredns-rke2-coredns
        namespace: kube-system
      register: _cluster_coredns_service
      retries: 30
      delay: 10
      until: _cluster_coredns_service.resources | default([]) | length > 0

    - name: Set the cluster DNS fact
      ansible.builtin.set_fact:
        _cluster_dns_clusterip: "{{ _cluster_coredns_service.resources[0].spec.clusterIP }}"

    - name: Remove local kubeconfig tempdir
      ansible.builtin.file:
        path: "{{ _weed_kubeconfig_tempdir.path }}"
        state: absent
      changed_when: false

- name: Configure the local log retention mount
  hosts: "{{ rke2_server_group }}:{{ rke2_agent_group }}"
  become: true
  any_errors_fatal: true
  vars_files:
    - main.yml
  vars:
    # Underscore-prefixed internal names throughout, matching this
    # collection's own convention - never shadow the public rke2_* var
    # name in a play-level vars: block (self-referencing precedence there
    # is ambiguous; this way an inventory override is unambiguously honored).
    _seaweedfs_logs_namespace: "{{ rke2_seaweedfs_logs_namespace | default('seaweedfs-logs') }}"
    _seaweedfs_logs_bucket: "{{ rke2_seaweedfs_logs_bucket | default('logs') }}"
    _seaweedfs_logs_version: "{{ rke2_seaweedfs_logs_version | default('4.48') }}"
    _seaweedfs_logs_mount_path: "{{ rke2_seaweedfs_logs_mount_path | default('/var/log/cluster') }}"
    _seaweedfs_logs_filer_endpoint: >-
      logs-filer.{{ _seaweedfs_logs_namespace }}.svc.cluster.local:8888
    _cluster_dns_clusterip: "{{ hostvars['localhost']['_cluster_dns_clusterip'] }}"
    _weed_release_url: >-
      https://github.com/seaweedfs/seaweedfs/releases/download/{{ _seaweedfs_logs_version }}/linux_amd64.tar.gz
  tasks:
    - name: End play when local log retention is not enabled
      ansible.builtin.meta: end_play
      when: not (rke2_seaweedfs_logs_enable | default(false) | bool)

    - name: Create log retention mountpoint
      ansible.builtin.file:
        path: "{{ _seaweedfs_logs_mount_path }}"
        state: directory
        mode: "u=rwx,go=rx"

    - name: Ensure systemd-resolved drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "u=rwx,go=rx"

    - name: Configure host DNS to resolve cluster-internal names
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/cluster-local.conf
        content: |
          [Resolve]
          DNS={{ _cluster_dns_clusterip }}
          Domains=svc.cluster.local cluster.local
        owner: root
        group: root
        mode: "u=rw,go=r"
      register: _cluster_dns_resolved_conf

    - name: Restart systemd-resolved
      ansible.builtin.systemd_service:
        name: systemd-resolved
        state: restarted
      when: _cluster_dns_resolved_conf.changed

    - name: Ensure FUSE package is present
      ansible.builtin.apt:
        name: fuse3
        state: present

    - name: Create weed binary tempdir
      ansible.builtin.tempfile:
        state: directory
        suffix: weed
      register: _weed_tempdir
      changed_when: false

    - name: Download and verify weed release archive
      ansible.builtin.get_url:
        url: "{{ _weed_release_url }}"
        dest: "{{ _weed_tempdir.path }}/weed.tar.gz"
        checksum: "md5:{{ _weed_release_url }}.md5"
        mode: "u=rw,go=r"

    - name: Extract weed binary
      ansible.builtin.unarchive:
        src: "{{ _weed_tempdir.path }}/weed.tar.gz"
        dest: "{{ _weed_tempdir.path }}"
        remote_src: true

    - name: Install weed binary
      ansible.builtin.copy:
        src: "{{ _weed_tempdir.path }}/weed"
        dest: /usr/local/bin/weed
        mode: "u=rwx,go=rx"
        remote_src: true

    - name: Remove weed binary tempdir
      ansible.builtin.file:
        path: "{{ _weed_tempdir.path }}"
        state: absent
      changed_when: false

    - name: Template weed mount systemd unit
      ansible.builtin.template:
        src: templates/weed-mount.service.j2
        dest: /etc/systemd/system/weed-mount.service
        owner: root
        group: root
        mode: "u=rw,go=r"
      register: _weed_mount_unit

    - name: Reload systemd daemon
      ansible.builtin.systemd_service:
        daemon_reload: true
      when: _weed_mount_unit.changed

    - name: Enable and start weed mount service
      ansible.builtin.systemd_service:
        name: weed-mount.service
        enabled: true
        state: "{{ 'restarted' if _weed_mount_unit.changed else 'started' }}"

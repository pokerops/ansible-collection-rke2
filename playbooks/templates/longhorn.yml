---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    chart: longhorn
    repoURL: https://charts.longhorn.io
    targetRevision: "1.12.1"
    helm:
      valuesObject:
        preUpgradeChecker:
          jobEnabled: false
        persistence:
          defaultClass: true
          reclaimPolicy: Retain
        ingress:
          enabled: true
          tls: true
          secureBackends: true
        enablePSP: false
        concurrentAutomaticEngineUpgradePerNodeLimit: 1
        # JSON for longhorn-manager and the driver deployer (chart 1.12.1).
        # longhorn-csi-plugin stays logfmt: the deployer hardcodes its args
        # without -j (longhorn-manager csi/deployment.go); the CSI sidecars
        # log klog
        longhornManager:
          log:
            format: json
        longhornDriver:
          log:
            format: json
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo's built-in retry for automated syncs (5 attempts, about 2.5m)
    # gives up on a repo-server restart, and an automated sync never
    # retries a failed revision.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields

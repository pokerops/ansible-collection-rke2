#jinja2: lstrip_blocks: True
---
apiVersion: observability.kaasops.io/v1alpha1
kind: Vector
metadata:
  name: vector
  namespace: "{{ rke2_monitoring_scraper_namespace }}"
spec:
  # Only pipelines carrying this label are merged into this agent's config.
  selector:
    matchLabels:
      pokerops.net/vector-pipeline: "true"
  agent:
    # The operator's own default (100m/200Mi request, 1 cpu/1Gi limit) is sized
    # for a general-purpose host, not a per-node DaemonSet - on a cluster with
    # several other operators competing for CPU requests on small nodes, that
    # default is enough on its own to leave other pods unschedulable (observed:
    # a MariaDB pod requesting 100m CPU stuck Pending with 0/4 nodes available,
    # solely because every agent node's CPU requests were already saturated by
    # existing DaemonSets/operators plus this one). Observed real usage here is
    # well under 50m CPU / 50Mi memory even while shipping cluster-wide logs.
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
    # Matches the ingestor's own data_dir so dev and prod agree on the path.
    dataDir: /vector-data-dir
    volumes:
      - name: data
        emptyDir:
          sizeLimit: "{{ rke2_monitoring_logs_volume_size }}"
      # The operator does not mount this by default; without it the
      # kubernetes_logs source has no files to tail and ships nothing.
      - name: varlogpods
        hostPath:
          path: /var/log/pods
    volumeMounts:
      - name: data
        mountPath: /vector-data-dir
      - name: varlogpods
        mountPath: /var/log/pods
        readOnly: true

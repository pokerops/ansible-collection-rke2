frr version {{ _frr_version }}
frr defaults traditional
hostname {{ ansible_facts.hostname }}
log syslog informational
service integrated-vtysh-config
!
ip forwarding
!
router bgp {{ _frr_asn }}
 bgp router-id {{ _frr_address | ansible.utils.ipaddr('address') }}
 bgp log-neighbor-changes
 !
 neighbor metallb-peers peer-group
 neighbor metallb-peers remote-as {{ _frr_asn }}
 neighbor metallb-peers ebgp-multihop 255
 !
 bgp listen range {{ _frr_address | ansible.utils.ipaddr('network/prefix') }} peer-group metallb-peers
 !
 address-family ipv4 unicast
  neighbor metallb-peers activate
  maximum-paths ibgp {{ groups[_frr_group] | length }}
 exit-address-family
exit
!

---
# Query logging for rke2's bundled CoreDNS (rke2-coredns 1.45.201, whose
# image is CoreDNS 1.14.1): the log plugin prints every query in CoreDNS's
# common format, which the Vector remap parses (CoreDNS has no JSON
# logging). Helm replaces lists, so this restates the chart's default server
# block with log added; keep it in step with the chart's values.yaml when
# rke2 bumps it.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: rke2-coredns
  namespace: kube-system
spec:
  valuesContent: |-
    servers:
      - zones:
          - zone: .
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: log
          - name: health
            configBlock: |-
              lameduck 10s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              pods insecure
              fallthrough in-addr.arpa ip6.arpa
              ttl 30
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            parameters: 30
          - name: loop
          - name: reload
          - name: loadbalance

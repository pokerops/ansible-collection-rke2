---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: ingress-class-values
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["networking.k8s.io"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ingresses"]
  variables:
    - name: class
      expression: >-
        has(object.spec.ingressClassName) ? object.spec.ingressClassName : ''
  validations:
    - expression: >-
        variables.class == '' || variables.class in ['{{ _policy_ingress_classes | join("', '") }}']
      messageExpression: >-
        "spec.ingressClassName must be one of " +
        "['{{ _policy_ingress_classes | join("', '") }}'], got: " +
        (variables.class == "" ? "<unset>" : variables.class)
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: ingress-class-values
spec:
  policyName: ingress-class-values
  validationActions: [Deny]

#jinja2: lstrip_blocks: True
---
apiVersion: observability.kaasops.io/v1alpha1
# A namespaced VectorPipeline is restricted by the operator to sources in its
# own namespace (extra_namespace_label_selector, injected automatically) -
# logs would never leave rke2_monitoring_scraper_namespace. ClusterVectorPipeline
# carries no such restriction, which is what cluster-wide log shipping needs.
kind: ClusterVectorPipeline
metadata:
  name: logging
  labels:
    pokerops.net/vector-pipeline: "true"
spec:
  sources:
    k8s_logs:
      type: kubernetes_logs
    # Node logs that never pass through a pod (mounted in agent.j2.yml).
    # rke2 runs the kubelet and containerd as children of its own unit and
    # points their output at files under its data dir instead of the
    # journal. etcd, kube-apiserver and the other control-plane components
    # are static pods, already covered by k8s_logs.
    node_files:
      type: file
      include:
        - /var/lib/rancher/rke2/agent/logs/kubelet.log
        - /var/lib/rancher/rke2/agent/containerd/containerd.log
    # rke2 itself (supervisor, embedded helm-controller, etcd snapshots,
    # certificate rotation) and the units this collection installs on the
    # host. Units absent on a node (rke2-agent on a server) just match
    # nothing.
    node_journal:
      type: journald
      journal_directory: /var/log/journal
      include_units:
        - rke2-server
        - rke2-agent
  transforms:
    # Known noise dropped before any sink. longhorn-manager logs the API
    # server's "v1 Endpoints is deprecated" warning every few minutes from
    # its own code - nothing configurable stops it until upstream switches
    # to EndpointSlices (longhorn/longhorn#10796, planned for v1.14.0;
    # tracked in TODO.md). Scoped to longhorn-system so the same warning
    # from anything else still surfaces.
    k8s_logs_filtered:
      type: filter
      inputs: [k8s_logs]
      condition:
        type: vrl
        source: >-
          !(.kubernetes.pod_namespace == "longhorn-system" &&
          contains(string(.message) ?? "", "v1 Endpoints is deprecated"))
    # A pod's multi-line events (Java, .NET and Python stack traces, Caused
    # by: chains) arrive one line per event; kubernetes_logs has no multiline
    # option, so lines are merged here, per container log file. A blank
    # line, or one that starts with whitespace, "Caused by: ", Python's
    # traceback header and chaining notes, an exception name (dotted, or a
    # bare Python builtin like "KeyError: ") or Postgres's follow-ups
    # ("DETAIL:  ", "HINT:  ") joins the event before it; anything else
    # starts a new one. Each event waits for its container's next line or 1s
    # of quiet, and max_events caps a container that only ever prints
    # indented lines (above Kafka's ~300-line "KafkaConfig values:" dump,
    # which a lower cap split into an unparsed tail).
    k8s_logs_merged:
      type: reduce
      inputs: [k8s_logs_filtered]
      group_by: [file]
      starts_when:
        type: vrl
        source: >-
          !match(string(.message) ?? "",
          r'^($|\s|Caused by: |Traceback \(most recent call last\):|During handling of the above exception|The above exception was the direct cause|(DETAIL|HINT|CONTEXT|STATEMENT):  |([A-Za-z_$][\w$]*\.)*[A-Z][\w$]*(Exception|Error|Throwable)(: |$))')
      merge_strategies:
        message: concat_newline
        # The first line's time; without this reduce adds timestamp_end
        timestamp: discard
      expire_after_ms: 1000
      flush_period_ms: 500
      max_events: 500
    # Node events carry no kubernetes.* to say where they came from: node is
    # the agent's own node (the file source's .host is the agent pod's
    # hostname, so it's dropped), unit the systemd unit without .service or
    # the log file's name without .log (kubelet, containerd).
    node_logs_labeled:
      type: remap
      inputs: [node_files, node_journal]
      source: |
        .node = get_env_var("VECTOR_SELF_NODE_NAME") ?? "unknown"
        if .source_type == "journald" {
          .unit = replace(string(._SYSTEMD_UNIT) ?? "unknown", r'\.service$', "")
        } else {
          del(.host)
          name, err = parse_regex(string(.file) ?? "", r'(?P<name>[^/]+?)(\.log)?$')
          .unit = if err == null { string(name.name) ?? "unknown" } else { "unknown" }
        }
    # Normalizes every event to the project's common log fields (CLAUDE.md,
    # "Logging invariant"): node, log_format (json, klog, logfmt or text),
    # level (trace, debug, info, warn, error, fatal or unknown), msg (the
    # line's own message, else the raw line) and log (every parsed field,
    # kept under its own key so a component's ts/time/level can never
    # clobber Vector's own fields). .message stays the untouched raw line,
    # and .timestamp stays the source's (container runtime write, journal
    # entry, or file read) time.
    logs_normalized:
      type: remap
      inputs: [k8s_logs_merged, node_logs_labeled]
      source: |
        if .node == null { .node = .kubernetes.pod_node_name }
        raw = string(.message) ?? ""
        # Formats are recognized on the first line; the rest of a merged
        # event (k8s_logs_merged: a stack trace) is appended to msg below.
        lines = split(raw, "\n", limit: 2)
        line = string(lines[0]) ?? raw
        rest = string(lines[1]) ?? ""
        .log_format = "text"
        .level = "unknown"
        .msg = raw
        fields = {}
        if starts_with(line, "{") {
          parsed, err = parse_json(line)
          if err == null && is_object(parsed) {
            fields = object!(parsed)
            .log_format = "json"
          }
        }
        if .log_format == "text" && match(line, r'^[IWEF]\d{4} \d{2}:\d{2}:\d{2}\.\d+\s+\d+ ') {
          parsed, err = parse_klog(line)
          if err == null {
            fields = parsed
            .log_format = "klog"
          }
        }
        # SeaweedFS's glog fork drops klog's thread id and "]", which
        # parse_klog rejects: "E1018 19:43:53.060246 mount_common.go:166 msg".
        if .log_format == "text" {
          parsed, err = parse_regex(line, r'^(?P<severity>[IWEF])(?P<time>\d{4} \d{2}:\d{2}:\d{2}\.\d+) (?P<file>[\w.-]+):(?P<line>\d+)\]? (?P<message>.*)$')
          if err == null {
            parsed.level = get(
              {"I": "info", "W": "warning", "E": "error", "F": "fatal"},
              [string(parsed.severity) ?? ""]
            ) ?? null
            fields = parsed
            .log_format = "klog"
          }
        }
        # Longhorn's instance-manager prefixes each process's logfmt line
        # with its name ("[pvc-...-r-21cdfbed] time=... level=..."); parsed
        # as is, the name became a field of its own per process.
        if .log_format == "text" && match(line, r'(^|\s)(level|lvl)=\S') {
          prefix, perr = parse_regex(line, r'^\[(?P<process>[\w.-]+)\] (?P<rest>.*)$')
          body = if perr == null { string(prefix.rest) ?? line } else { line }
          parsed, err = parse_logfmt(body)
          if err == null {
            if perr == null { parsed.process = prefix.process }
            fields = parsed
            .log_format = "logfmt"
          }
        }
        # Leveled plain text from components that can't be switched to JSON
        # (or not yet - TODO.md): log_format stays "text", but level and msg
        # come from the line. zap's console encoder first (time, level,
        # logger, msg and an optional JSON object, tab-separated - e.g.
        # seaweedfs-operator), then a level token after a leading timestamp
        # (Vector's text format, log4j patterns like strimzi's), Serilog's
        # "time [LVL] (Source) msg" (reflector), redis's "pid:role time sym
        # msg", FRR's "time DAEMON: [ID] msg", nginx's "time [level] pid#tid:
        # msg", MariaDB's "time [Note] msg",
        # Python's "time - logger - LEVEL - msg", Postgres's "LEVEL:  msg"
        # (bare from psql, or after the server's log_line_prefix), pgqd's
        # "time TZ [pid] LEVEL msg", the Prometheus JMX exporter agent's
        # "time | thread | LEVEL | logger | msg", Longhorn's iSCSI frontend
        # "[time] Info: msg", HTTP access lines (common/combined log format),
        # coredns's and haproxy's "[LEVEL] msg", and the kubelet's startup
        # flag deprecation notices.
        if .log_format == "text" {
          parsed, err = parse_regex(line, r'^(?P<time>\d{4}-\d{2}-\d{2}T\S+)\t(?P<level>[A-Z]+)\t(?P<logger>[^\t]*)\t(?P<msg>[^\t]*)\t?(?P<extra>.*)$')
          if err == null {
            extra = {}
            if parsed.extra != "" {
              extra = object(parse_json(string(parsed.extra) ?? "") ?? {}) ?? {}
            }
            fields = merge(extra, {"time": parsed.time, "level": parsed.level, "logger": parsed.logger, "msg": parsed.msg})
          } else {
            parsed, err = parse_regex(line, r'^\d{4}-\d{2}-\d{2}[T ][\d:.,]+Z?\s+(?P<level>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|CRITICAL|FATAL):?\s+(?P<msg>.*)$')
            if err != null {
              parsed, err = parse_regex(line, r'^\d{4}-\d{2}-\d{2} [\d:.]+ [+-]\d{2}:\d{2} \[(?P<level>VRB|DBG|INF|WRN|ERR|FTL)\] \((?P<logger>[^)]*)\) (?P<msg>.*)$')
            }
            # redis and sentinel: "1:M 23 Oct 2026 03:44:35.339 * msg", the
            # symbol is the level ("." debug, "-" verbose, "*" notice, "#"
            # warning)
            if err != null {
              parsed, err = parse_regex(line, r'^\d+:[XCSM] \d{1,2} \w{3} \d{4} [\d:.]+ (?P<sym>[.*#-]) (?P<msg>.*)$')
              if err == null {
                parsed.level = get({".": "debug", "-": "debug", "*": "notice", "#": "warning"}, [string(parsed.sym) ?? ""]) ?? null
              }
            }
            # FRR (MetalLB's frr-k8s): "2026/10/24 02:20:41.890 BGP: [ID] msg";
            # the level is only there with FRR's log record-priority, which
            # frr-k8s doesn't set ("... notifications: BGP: ...")
            if err != null {
              parsed, err = parse_regex(line, r'^\d{4}/\d{2}/\d{2} [\d:.]+ ((?P<level>emergencies|alerts|critical|errors|warnings|notifications|informational|debugging): )?(?P<daemon>[A-Z0-9]+): (\[(?P<id>[A-Z0-9]{5}-[A-Z0-9]{5})\] )?(?P<msg>.*)$')
            }
            # nginx's error log (ingress-nginx's controller): "2026/10/26
            # 22:22:22 [error] 93#93: *1456 msg", the "*N" a connection id
            if err != null {
              parsed, err = parse_regex(line, r'^\d{4}/\d{2}/\d{2} [\d:]+ \[(?P<level>debug|info|notice|warn|error|crit|alert|emerg)\] \d+#\d+: (\*(?P<connection>\d+) )?(?P<msg>.*)$')
            }
            # MariaDB: the server's "2026-10-24  5:22:21 0 [Note] msg" (hour
            # space-padded, then a thread id) and its entrypoint script's
            # "2026-10-24 05:22:19+00:00 [Note] [Entrypoint]: msg"
            if err != null {
              parsed, err = parse_regex(line, r'^\d{4}-\d{2}-\d{2}\s+\d{1,2}:\d{2}:\d{2}([+-]\d{2}:\d{2}| \d+) \[(?P<level>Note|Warning|ERROR|System)\] (?P<msg>.*)$')
            }
            # Python's "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
            # (Spilo's bootstrap: "2026-10-24 14:48:10,123 - bootstrapping -
            # INFO - msg")
            if err != null {
              parsed, err = parse_regex(line, r'^\d{4}-\d{2}-\d{2} [\d:.,]+ - (?P<logger>\S+) - (?P<level>DEBUG|INFO|WARNING|ERROR|CRITICAL) - (?P<msg>.*)$')
            }
            # Postgres: "NOTICE:  msg" from psql, or the server's stderr
            # before its logging collector starts, after a log_line_prefix
            # that begins with a timestamp ("2026-10-24 14:48:20 UTC [68]:
            # [1-1] ... LOG:  msg"); always two spaces after the level
            if err != null {
              parsed, err = parse_regex(line, r'^(\d{4}-\d{2}-\d{2} [\d:.]+ [A-Z]{2,5} .*?)?(?P<level>DEBUG[1-5]|LOG|INFO|NOTICE|WARNING|ERROR|FATAL|PANIC):  (?P<msg>.*)$')
            }
            # pgqd (Spilo's PgQ ticker): "2026-10-24 14:54:28.123 UTC [93]
            # LOG msg"
            if err != null {
              parsed, err = parse_regex(line, r'^\d{4}-\d{2}-\d{2} [\d:.]+ [A-Z]{2,5} \[\d+\] (?P<level>DEBUG|LOG|INFO|NOTICE|WARNING|ERROR|FATAL) (?P<msg>.*)$')
            }
            # The Prometheus JMX exporter's Java agent (in Strimzi's Kafka
            # pods): "2026-10-24 19:29:11.627 | main | INFO |
            # io.prometheus.jmx.JavaAgent | Starting ..."
            if err != null {
              parsed, err = parse_regex(line, r'^\d{4}-\d{2}-\d{2} [\d:.,]+ \| (?P<thread>[^|]+?) \| (?P<level>[A-Z]+) \| (?P<logger>[^|]+?) \| (?P<msg>.*)$')
            }
            # Longhorn's iSCSI frontend (liblonghorn, in instance-manager):
            # "[2026-10-23 03:52:23.365223] Info: msg"
            if err != null {
              parsed, err = parse_regex(line, r'^\[\d{4}-\d{2}-\d{2} [\d:.]+\] (?P<level>Debug|Info|Warn|Warning|Error): (?P<msg>.*)$')
            }
            # HTTP access lines in common/combined log format
            # (longhorn-manager's API, ingress-nginx): level from the status
            if err != null {
              parsed, err = parse_regex(line, r'^(?P<client>\S+) \S+ (?P<user>\S+) \[(?P<time>[^\]]+)\] "(?P<method>[A-Z]+) (?P<path>\S+) (?P<protocol>[^"]*)" (?P<status>\d{3}) (?P<bytes>\S+)')
              if err == null {
                status = to_int(parsed.status) ?? 0
                parsed.level = if status >= 500 { "error" } else if status >= 400 { "warn" } else { "info" }
                parsed.msg = join([string(parsed.method) ?? "", string(parsed.path) ?? "", string(parsed.status) ?? ""], " ") ?? line
              }
            }
            # CoreDNS's query log (its log plugin, templates/coredns.yml) in the
            # common format: "[INFO] 10.42.1.109:58631 - 45106 "A IN name.
            # udp 54 false 512" NXDOMAIN qr,aa,rd 147 0.000075914s". The level
            # comes from the rcode (SERVFAIL error; REFUSED, FORMERR, NOTIMP
            # warn; else info: NXDOMAIN is routine with search domains), msg
            # is "TYPE name RCODE"
            if err != null {
              parsed, err = parse_regex(line, r'^\[INFO\] (?P<client>\[[0-9a-fA-F:.]+\]|[0-9.]+):(?P<port>\d+) - (?P<id>\d+) "(?P<type>\S+) (?P<class>\S+) (?P<name>\S+) (?P<proto>\S+) (?P<size>\d+) (?P<do>\S+) (?P<bufsize>\d+)" (?P<rcode>\S+) (?P<rflags>\S+) (?P<rsize>\d+) (?P<duration>[\d.]+)s$')
              if err == null {
                rcode = string(parsed.rcode) ?? ""
                parsed.level = if rcode == "SERVFAIL" { "error" } else if includes(["REFUSED", "FORMERR", "NOTIMP"], rcode) { "warn" } else { "info" }
                parsed.msg = join([string(parsed.type) ?? "", string(parsed.name) ?? "", rcode], " ") ?? line
              }
            }
            # coredns "[INFO] msg" and haproxy "[NOTICE]   (1) : msg"
            if err != null {
              parsed, err = parse_regex(line, r'^\[(?P<level>DEBUG|INFO|NOTICE|WARNING|ERROR|ALERT|EMERG|FATAL)\]\s+(\(\d+\)\s*:\s*)?(?P<msg>.*)$')
            }
            if err != null && match(line, r'^Flag --\S+ has been deprecated') {
              parsed = {"level": "warning", "msg": line}
              err = null
            }
            if err == null { fields = parsed }
          }
        }
        if length(fields) > 0 {
          .log = fields
          level = fields.level
          if level == null { level = fields.lvl }
          if level == null { level = fields.severity }
          if level == null { level = get(fields, ["log.level"]) ?? null }
          # Kubernetes' component-base JSON format (the control plane, the
          # kubelet, metrics-server, cert-manager) has no level key: info
          # lines carry their verbosity "v" (0 info, more is debug), error
          # lines no "v", with an "err" (ErrorS) or without (Error, which
          # still has the format's "ts" and "caller")
          if level == null && is_integer(fields.v) {
            level = if fields.v == 0 { "info" } else { "debug" }
          }
          if level == null && fields.v == null && (fields.err != null || (fields.ts != null && fields.caller != null)) {
            level = "error"
          }
          # Quotes stripped: Vector's own JSON can repeat "level" as a field
          # holding a quoted value ("\"info\""), which wins in parse_json
          l = replace(downcase(to_string(level) ?? ""), "\"", "")
          .level = if starts_with(l, "trace") || l == "vrb" {
            "trace"
          } else if starts_with(l, "debug") || l == "dbg" {
            "debug"
          } else if starts_with(l, "info") || l == "inf" || l == "log" || l == "notice" || l == "notifications" || l == "note" || l == "system" {
            "info"
          } else if starts_with(l, "warn") || l == "wrn" {
            "warn"
          } else if starts_with(l, "err") || l == "eror" {
            "error"
          } else if starts_with(l, "fatal") || starts_with(l, "crit") || starts_with(l, "panic") || starts_with(l, "alert") || starts_with(l, "emerg") || l == "dpanic" || l == "ftl" {
            "fatal"
          } else {
            "unknown"
          }
          message = fields.msg
          if message == null { message = fields.message }
          if message != null { .msg = to_string(message) ?? raw }
        }
        # Ingress request logs: Traefik's JSON access log, and ingress-nginx's
        # log-format-upstream (playbooks/templates/nginx.yml), which uses
        # Traefik's field names. Neither has a level of its own (Traefik
        # writes "info" and an empty msg): the level comes from the status, as
        # for the text access lines above, and msg is "METHOD path status".
        # nginx logs headers and upstream fields it hasn't got as "" (Traefik
        # leaves them out); those are dropped, so both read the same.
        if .log_format == "json" && fields.DownstreamStatus != null && fields.RequestMethod != null {
          .log = compact(fields, string: true, null: false, object: false, array: false)
          status = to_int(fields.DownstreamStatus) ?? 0
          .level = if status >= 500 { "error" } else if status >= 400 { "warn" } else { "info" }
          .msg = join([string(fields.RequestMethod) ?? "", string(fields.RequestPath) ?? "", to_string(status)], " ") ?? raw
        }
        # Structured klog (the kubelet, most control-plane components) puts
        # a quoted message and then key="value" pairs in the message part.
        # The pairs go under .log, never over klog's own file/line/level.
        if .log_format == "klog" {
          parts, err = parse_regex(.msg, r'^"(?P<msg>(?:[^"\\]|\\.)*)"\s*(?P<kv>.*)$')
          if err == null {
            .msg = parts.msg
            kv = parse_logfmt(parts.kv) ?? {}
            .log = merge(kv, object(.log) ?? {})
          }
        }
        # MetalLB's FRR reloader wrapper (a shell script) reports a config it
        # could not apply without any level.
        if .level == "unknown" && .kubernetes.pod_namespace == "metallb-system" && .kubernetes.container_name == "reloader" &&
          match(line, r'^(Syntax error spotted|Failed to fully apply configuration file)') {
          .level = "error"
        }
        # CoreDNS prints its startup banner without a level (CoreDNS 1.14.1's
        # coremain and dnsserver): the version, "os/arch, go version, commit",
        # automaxprocs' "maxprocs: ..." and each server's listen address
        # ("[proto]zone:port[ on ip]"), plus a warning for a zone that breaks
        # RFC 1035 syntax.
        if .level == "unknown" && .kubernetes.container_name == "coredns" {
          if starts_with(line, "Warning: ") {
            .level = "warn"
          } else if match(line, r'^(CoreDNS-\S+|\w+/\w+, go\S+.*|maxprocs: .*|([a-z]+://)?\S*:\d+( on \S+)?)$') {
            .level = "info"
          }
        }
        # Spilo runs its bootstrap SQL through psql, which echoes each
        # statement's command tag ("GRANT", "CREATE FUNCTION", "INSERT 0 1")
        # and database switches without a level: they report success.
        if .level == "unknown" && contains(string(.kubernetes.container_image) ?? "", "/spilo-") &&
          match(line, r'^([A-Z]+( [A-Z]+)*( \d+)*|You are now connected to database .*)$') {
          .level = "info"
        }
        # A merged event's continuation lines (its stack trace) follow the
        # first line's msg; an unparsed event's msg is already the raw text.
        if rest != "" && .msg != raw {
          .msg = to_string(.msg) + "\n" + rest
        }
        # Plain-text journal lines still have the syslog priority the unit
        # logged them at (stdout defaults to info).
        if .level == "unknown" && .PRIORITY != null {
          p = to_int(.PRIORITY) ?? -1
          .level = if p >= 0 && p <= 2 {
            "fatal"
          } else if p == 3 {
            "error"
          } else if p == 4 {
            "warn"
          } else if p == 5 || p == 6 {
            "info"
          } else if p == 7 {
            "debug"
          } else {
            "unknown"
          }
        }
  sinks:
    # The cluster-local store (playbooks/templates/victorialogs.yml), always
    # on. VictoriaLogs takes Elasticsearch's bulk API; nested fields arrive
    # flattened (kubernetes.pod_name, log.*), so every normalized field is
    # searchable. msg is the message shown, timestamp the source's time, and
    # each node's unit or container is its own stream.
    local:
      type: elasticsearch
      inputs: [logs_normalized]
      endpoints:
        - "http://victoria-logs.{{ rke2_monitoring_scraper_namespace }}.svc:9428/insert/elasticsearch/"
      api_version: v8
      compression: gzip
      # Same reason as the remote sink's: the store may not be up yet when
      # this pipeline is first applied.
      healthcheck:
        enabled: false
      query:
        _msg_field: msg
        _time_field: timestamp
        _stream_fields: node,unit,kubernetes.pod_namespace,kubernetes.pod_name,kubernetes.container_name
        # Kubernetes metadata that's the same on every event of a node or
        # namespace, or never searched for: dozens of fields per event.
        # Pod labels, the image and the node stay.
        ignore_fields: >-
          kubernetes.node_labels.*,kubernetes.namespace_labels.*,kubernetes.pod_annotations.*,kubernetes.container_image_id,kubernetes.pod_uid
        # Some components color their text logs (traefik); strip ANSI codes
        # so message searches match.
        decolorize_fields: msg,message
      # Survives agent restarts while VictoriaLogs restarts or moves nodes;
      # the store is a single pod, so short gaps are expected. drop_newest:
      # a struggling local store must never backpressure the sources, and
      # with them the remote sink - its drops are counted
      # (vector_buffer_discarded_events_total, forwarded by Alloy).
      buffer:
        type: disk
        max_size: 268435488
        when_full: drop_newest
      acknowledgements:
        enabled: true
    {% if rke2_logging_endpoint | default('') | length > 0 %}
    ingestor:
      type: vector
      inputs: [logs_normalized]
      address: "{{ rke2_logging_endpoint }}"
      version: "2"
      # Without this, one failed connection at the moment this pipeline is
      # first applied (e.g. the remote ingestor isn't up yet) permanently
      # rejects the config in favor of a blackhole fallback, with no retry.
      # remote_write has no equivalent gate, so logging shouldn't either.
      healthcheck: false
      # Unsent events must survive an agent restart while the remote is
      # unreachable: sources save their read position as soon as an event
      # leaves them, so anything still in a memory buffer is lost for good
      # (seen live: rke2-agent's startup lines, read before the remote was
      # up and dropped by a config-change restart). The disk buffer lives
      # in the agent's data_dir, a hostPath, so it also survives pod
      # recreation. Acknowledgements make the journald and file sources
      # (node logs) hold their position until events are in that buffer;
      # kubernetes_logs can't acknowledge in 0.48 (can_acknowledge is
      # false), so pod logs keep a sub-second window between read and
      # buffer write.
      buffer:
        type: disk
        max_size: {{ rke2_logging_buffer_size }}
        when_full: block
      acknowledgements:
        enabled: true
      {% if rke2_monitoring_tls_enabled | bool %}
      tls:
        ca_file: /etc/vector/tls/ca.crt
        crt_file: /etc/vector/tls/tls.crt
        key_file: /etc/vector/tls/tls.key
      {% endif %}
    {% endif %}

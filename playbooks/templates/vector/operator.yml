---
# Deployed by the components role (logging.yml), not the argocd apps chart:
# the log agents run on every cluster, including those that disable the
# argocd apps (rke2_argocd_apps_deploy).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vector-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: vector-operator
    repoURL: https://kaasops.github.io/vector-operator/helm
    targetRevision: "0.10.0"
    helm:
      valuesObject:
        # The operator's zap logger defaults to its console (text) encoder
        args:
          - --zap-encoder=json
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo's built-in retry for automated syncs (5 attempts, about 2.5m)
    # gives up on a repo-server restart, and an automated sync never
    # retries a failed revision.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
  ignoreDifferences:
    - group: apiextensions.k8s.io
      kind: CustomResourceDefinition
      jsonPointers:
        - /spec/preserveUnknownFields

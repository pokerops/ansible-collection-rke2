---
# No S3Identity/S3Credentials/S3Policy/S3PolicyBinding chain - confirmed live
# that filer/mount access needs no credential unless the Seaweed cluster sets
# spec.securityConfig.jwtSigning, which this one doesn't. That chain exists
# specifically to authorize S3-API access; Vector and admins both reach this
# bucket through the mounted filesystem, never the S3 API.
apiVersion: seaweed.seaweedfs.com/v1
kind: Bucket
metadata:
  name: "{{ rke2_seaweedfs_logs_bucket }}"
  namespace: "{{ rke2_seaweedfs_logs_namespace }}"
spec:
  clusterRef:
    name: logs
    namespace: "{{ rke2_seaweedfs_logs_namespace }}"
  # weed mount's own -dirAutoCreate (playbooks/logretention.yml) creates a
  # plain filer directory at this same /buckets/<name> path the moment it
  # first connects, with no awareness of this CRD's ownership tracking -
  # confirmed live: on a fresh cluster where the mount happened to connect
  # before this CRD was ever applied, the controller refused to proceed,
  # phase: Failed, "already exists ... not created by this resource".
  # Nothing to fix on the mount's side - the directory it creates is the
  # exact right one either way, so adopt it rather than trying to win a
  # race between two independent paths to the same directory.
  adoptExisting: true

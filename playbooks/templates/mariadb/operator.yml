---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mariadb-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-4"
spec:
  project: default
  source:
    chart: mariadb-operator
    repoURL: ghcr.io/mariadb-operator/charts
    targetRevision: "26.6.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: mariadb-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo's built-in retry for automated syncs (5 attempts, about 2.5m)
    # gives up on a repo-server restart, and an automated sync never
    # retries a failed revision.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true

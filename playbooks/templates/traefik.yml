---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: "40.3.0"
    helm:
      valuesObject:
        ingressRoute:
          dashboard:
            enabled: false
          healthcheck:
            enabled: true
            labels:
              "{{ _traefik_label_selector }}": "{{ _traefik_chart_class }}"
        providers:
          kubernetesCRD:
            labelSelector: "{{ _traefik_label_selector }}={{ _traefik_chart_class }}"
        additionalArguments:
          - "--serversTransport.insecureSkipVerify=true"
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

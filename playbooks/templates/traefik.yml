---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-5"
spec:
  project: default
  source:
    chart: traefik
    repoURL: https://traefik.github.io/charts
    targetRevision: "41.5.0"
    helm:
      valuesObject:
        ingressRoute:
          dashboard:
            enabled: false
          healthcheck:
            enabled: true
            labels:
              "{{ _traefik_label_selector }}": "{{ _traefik_chart_class }}"
        providers:
          kubernetesCRD:
            labelSelector: "{{ _traefik_label_selector }}={{ _traefik_chart_class }}"
        additionalArguments:
          - "--serversTransport.insecureSkipVerify=true"
        log:
          format: json
        accessLog:
          enabled: true
          format: json
          fields:
            headers:
              defaultMode: keep
              names:
                Authorization: redact
                Proxy-Authorization: redact
                Cookie: redact
                Set-Cookie: redact
                X-Api-Key: redact
                X-Auth-Token: redact
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo's built-in retry for automated syncs (5 attempts, about 2.5m)
    # gives up on a repo-server restart, and an automated sync never
    # retries a failed revision.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true

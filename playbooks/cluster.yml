---
- name: Deploy RKE2 cluster
  hosts: "{{ rke2_server_group }}:{{ rke2_agent_group }}"
  any_errors_fatal: true
  vars_files:
    - main.yml
  tasks:
    - name: Verify required params
      ansible.builtin.assert:
        that: rke2_token is defined
        fail_msg: "rke2_token must be defined"

    - name: Add nodes to cluster group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: "{{ rke2_cluster_group }}"
      loop: "{{ ansible_play_hosts }}"
      changed_when: false
      run_once: true

    - name: Set RKE2 version default facts
      ansible.builtin.set_fact:
        rke2_version: "{{ rke2_defaults_version }}"
      when: rke2_version is not defined

    - name: Debug RKE2 install target
      ansible.builtin.debug:
        msg: "Installing RKE2 version {{ rke2_version }}"

    - name: Set default RKE2 server options
      ansible.builtin.set_fact:
        rke2_server_options: "{{ rke2_defaults_server_options }}"
      when: rke2_server_options is not defined

    - name: Set default RKE2 agent options
      ansible.builtin.set_fact:
        rke2_agent_options: "{{ rke2_defaults_agent_options }}"
      when: rke2_agent_options is not defined

    - name: Set default RKE2 registry mirrors
      ansible.builtin.set_fact:
        rke2_registry_mirrors: "{{ rke2_defaults_registry_mirrors }}"
      when: rke2_registry_mirrors is not defined

    # Component args: the user's own, else the collection's defaults, with
    # logging-format=_rke2_logging_format added unless they already pick a
    # format (Kubernetes v1.33's component-base JSON logging, on by default
    # since v1.24). etcd 3.5 already logs JSON; the rke2 supervisor only text.
    - name: Set RKE2 kube-proxy args
      ansible.builtin.set_fact:
        rke2_kube_proxy_arg: >-
          {{ rke2_kube_proxy_arg | default(rke2_defaults_kube_proxy_arg)
             | pokerops.rke2.ensure_arg('logging-format', _rke2_logging_format) }}

    # Left undefined when empty: rke2 turns an empty kubelet-arg into a
    # single empty --kubelet-arg= flag
    - name: Set RKE2 kubelet args
      ansible.builtin.set_fact:
        rke2_kubelet_arg: >-
          {{ rke2_kubelet_arg | default([])
             | pokerops.rke2.ensure_arg('logging-format', _rke2_logging_format) }}
      when: rke2_kubelet_arg is defined or _rke2_logging_format | length > 0

    - name: Set RKE2 control plane args
      ansible.builtin.set_fact:
        rke2_kube_apiserver_args: >-
          {{ rke2_kube_apiserver_args | default([])
             | pokerops.rke2.ensure_arg('logging-format', _rke2_logging_format) }}
        rke2_kube_controller_manager_arg: >-
          {{ rke2_kube_controller_manager_arg | default(rke2_defaults_kube_controller_manager_arg)
             | pokerops.rke2.ensure_arg('logging-format', _rke2_logging_format) }}
        rke2_kube_scheduler_arg: >-
          {{ rke2_kube_scheduler_arg | default(rke2_defaults_kube_scheduler_arg)
             | pokerops.rke2.ensure_arg('logging-format', _rke2_logging_format) }}
      when: inventory_hostname in groups[rke2_server_group]

    - name: Configure control plane VIP
      when: _rke2_kubevip_address | length > 0
      block:
        - name: Set kube-vip facts
          ansible.builtin.set_fact:
            rke2_ha_mode_kubevip: true
            rke2_api_ip: "{{ _rke2_kubevip_address }}"
            rke2_kubevip_image: "ghcr.io/kube-vip/kube-vip:v1.2.4"
            rke2_kubevip_arp_enable: true
            rke2_kubevip_svc_enable: false
            rke2_kubevip_cloud_provider_enable: false

        - name: Verify kube-vip address
          ansible.builtin.assert:
            that:
              - rke2_api_ip is ansible.utils.in_network(_network)
              - rke2_api_ip not in [ansible_facts.default_ipv4.address, ansible_facts.default_ipv4.gateway]
          vars:
            _network: "{{ ansible_facts.default_ipv4.network }}/{{ ansible_facts.default_ipv4.prefix }}"
          when: inventory_hostname in groups[rke2_server_group]

    - name: Set RKE2 snapshot file default
      ansible.builtin.set_fact:
        rke2_etcd_snapshot_file: ""
      when: rke2_etcd_snapshot_file is not defined

    - name: Set RKE2 custom manifests default
      ansible.builtin.set_fact:
        rke2_custom_manifests: []
      when: rke2_custom_manifests is not defined

    - name: Set RKE2 static pods default
      ansible.builtin.set_fact:
        rke2_static_pods: []
      when: rke2_static_pods is not defined

    - name: Install RKE2
      ansible.builtin.include_role:
        name: pokerops.rke2.rke2
        apply:
          become: true
      vars:
        rke2_cluster_group_name: "{{ rke2_cluster_group }}"
        rke2_servers_group_name: "{{ rke2_server_group }}"
        rke2_agents_group_name: "{{ rke2_agent_group }}"

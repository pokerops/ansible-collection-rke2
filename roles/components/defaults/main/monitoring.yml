---
# Identity the metrics collector runs as.
rke2_monitoring_scraper_name: alloy
rke2_monitoring_scraper_namespace: monitoring

# Cluster identity carried by every metric and log record leaving this cluster.
rke2_monitoring_cluster_id: "{{ rke2_cluster_name }}"

# Transport to the remote ingestor. Vector terminates mTLS natively, no gateway.
# Off until the ingestor exists. Vector cannot restrict cert subjects or revoke,
# so the CA is the authorization boundary: dedicate it, keep lifetimes short.
rke2_monitoring_tls_enabled: false
rke2_monitoring_tls_secret: ""
rke2_monitoring_tls_ca_secret: ""

# Remote ingestor to ship metrics to. Empty disables monitoring entirely.
rke2_monitoring_endpoint: ""

# Remote ingestor to ship logs to, as a bare host:port (Vector's native
# protocol, not an HTTP URL). Optional: logging always ships to the
# cluster-local VictoriaLogs store; this adds the remote destination.
rke2_logging_endpoint: ""

# Cluster-local log store (VictoriaLogs, playbooks/templates/victorialogs.yml).
# Retention is by age, and by size as a safety net: the oldest days go first
# once the volume is 85% full. An empty storage class uses the cluster default.
rke2_logging_retention_days: 3
rke2_logging_volume_size: 5Gi
rke2_logging_storage_class: ""

# Disk buffer for logs bound for rke2_logging_endpoint, per node, in bytes
# (Vector's minimum is 256 MiB). Unsent events wait here across agent
# restarts while the remote is unreachable; when it fills, reading stops
# until the remote catches up. 1 GiB is roughly an hour of a busy node.
rke2_logging_buffer_size: 1073741824

# Log agent image. The operator's default is the distroless variant, which
# has no journalctl for the journald source (rke2 and host-unit logs); the
# debian variant ships it. Pin only, bumped by rke2 update.
rke2_vector_agent_image: "timberio/vector:0.60.0-debian"

# Alloy's WAL volume; metrics in it are time-bound by the WAL itself.
rke2_monitoring_metrics_volume_size: 2Gi

# Cardinality control, applied by Alloy as metric_relabel_configs. Measured
# against real scrapes, not inherited: together these cut ~45% of active series.
# Drops are unrecoverable and a PrometheusRule on a dropped metric fails
# silently, so confirm nothing reads a metric before adding it here.

# Cilium gives every pod an lxc* veth counting the same traffic as its eth0.
rke2_monitoring_cadvisor_keep_interfaces: "^eth[0-9]+$"

# Emitted but never populated under cgroup v2, which these nodes run.
rke2_monitoring_drop_metrics_cadvisor:
  - container_tasks_state # 570 series/node, all zero
  - container_cpu_load_average_10s # 114 series/node, all zero
  - container_cpu_load_d_average_10s # 114 series/node, all zero

# pgfault is ordinary memory activity; pgmajfault is the thrashing signal.
# The container and hierarchy scopes duplicate each other on leaf cgroups.
rke2_monitoring_keep_memory_failure_type: "^pgmajfault$"
rke2_monitoring_keep_memory_failure_scope: "^container$"

# The only Vector agent metrics forwarded; every other vector_ series is
# dropped. Enough to see each component's flow and, above all, lost
# events: errors and discards per component (component_id, intentional),
# and buffer-full drops (a sink buffer's drop_newest), which Vector counts
# under the buffer, not the component. Several only appear
# once the first such event happens.
rke2_monitoring_keep_metrics_vector:
  - vector_component_received_events_total
  - vector_component_sent_events_total
  - vector_component_discarded_events_total
  - vector_component_errors_total
  - vector_buffer_discarded_events_total
  - vector_buffer_events

rke2_monitoring_drop_metrics_ksm:
  - kube_pod_tolerations # 336 series, not queried

# Redundant once kube-state-metrics is scraped, and correlated: all three or none.
rke2_monitoring_drop_labels_cadvisor:
  - id # cgroup path
  - name # duplicates the container label
  - image # available from kube_pod_container_info

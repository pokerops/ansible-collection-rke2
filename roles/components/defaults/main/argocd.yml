---
rke2_argocd_hostname: "argocd.{{ rke2_cluster_name }}"
rke2_argocd_exec_timeout: "3m"
rke2_argocd_chart:
  name: "argo-cd"
  namespace: "argocd"
  repo: "https://argoproj.github.io/argo-helm"
  release: "10.10.5"
rke2_argocd_redis_ha_enabled: true
rke2_argocd_controller_replicas: 2
rke2_argocd_server_replicas: 2
rke2_argocd_reposerver_replicas: 2
rke2_argocd_applicationset_replicas: 2
rke2_argocd_ingress_class: "{{ rke2_nginx_controller_deploy | bool | ternary('nginx-private', 'traefik-private') }}"
rke2_argocd_values:
  redis-ha:
    enabled: "{{ rke2_argocd_redis_ha_enabled }}"
  controller:
    replicas: "{{ rke2_argocd_controller_replicas }}"
  server:
    replicas: "{{ rke2_argocd_server_replicas }}"
    ingress:
      enabled: true
      ingressClassName: "{{ rke2_argocd_ingress_class }}"
      hostname: "{{ rke2_argocd_hostname }}"
      # No cert-manager.io/cluster-issuer annotation: server.certificate
      # below already issues argocd-server-tls, and ingress-shim would add a
      # second Certificate for the same secret; the two reissue it in a loop
      # that every Argo CD component and the ingress controller reload.
      tls: true
    certificate:
      enabled: true
      domain: "{{ rke2_argocd_hostname }}"
      issuer:
        name: "{{ rke2_certmanager_issuer_name }}"
        kind: ClusterIssuer
  repoServer:
    replicas: "{{ rke2_argocd_reposerver_replicas }}"
  applicationSet:
    replicas: "{{ rke2_argocd_applicationset_replicas }}"
  configs: "{{ rke2_argocd_values_configs | default({}) }}"
  notifications: "{{ rke2_argocd_values_notifications | default({}) }}"
  global:
    # JSON for server, controller, repo-server, applicationset, notifications
    # and dex (chart 10.10.5); redis has no JSON option and logs text
    logging:
      format: json
    env:
      - name: ARGOCD_EXEC_TIMEOUT
        value: "{{ rke2_argocd_exec_timeout }}"
rke2_argocd_apps_deploy: true
rke2_argocd_apps_chart:
  name: "argocd-apps"
  namespace: "argocd"
  repo: "https://argoproj.github.io/argo-helm"
  release: "2.0.7"
rke2_argocd_apps_pokerops_revision: 0.10.1
rke2_argocd_apps_values_extra: {}
rke2_argocd_apps_directory_include: "{*.yml,*.yaml}"
rke2_argocd_apps_directory_exclude: ""
rke2_argocd_apps_values_base:
  applications:
    cluster:
      project: default
      source:
        repoURL: https://github.com/pokerops/ansible-collection-rke2.git
        targetRevision: "{{ rke2_argocd_apps_pokerops_revision }}"
        path: argocd/applications/
        directory:
          recurse: false
          include: "{{ rke2_argocd_apps_directory_include }}"
          exclude: "{{ rke2_argocd_apps_directory_exclude }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: default
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        # Argo's built-in retry for automated syncs (5 attempts, about 2.5m)
        # gives up on a repo-server restart, and an automated sync never
        # retries a failed revision. Same policy on every app.
        retry:
          limit: 10
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - ApplyOutOfSyncOnly=true
      revisionHistoryLimit:
      info:
        - name: url
          value: https://github.com/pokerops/ansible-collection-rke2
rke2_argocd_apps_values: "{{ rke2_argocd_apps_values_base | combine(rke2_argocd_apps_values_extra, recursive=True) }}"

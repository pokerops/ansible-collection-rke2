---
- name: Deploy alloy collector
  kubernetes.core.k8s:
    state: present
    apply: true
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ lookup('ansible.builtin.template', 'templates/alloy.yml') | from_yaml }}"

- name: Deploy kafka metrics configuration
  kubernetes.core.k8s:
    state: present
    apply: true
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ lookup('ansible.builtin.template', 'templates/strimzi/kafka-metrics.yml') | from_yaml }}"

- name: Deploy monitor customizations
  kubernetes.core.k8s:
    state: present
    apply: true
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ item }}"
  loop: "{{ lookup('ansible.builtin.template', 'templates/monitors.yml') | from_yaml_all | list }}"
  loop_control:
    label: "{{ item.kind }}/{{ item.metadata.name }}"

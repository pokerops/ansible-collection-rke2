---
- name: Deploy alloy collector
  kubernetes.core.k8s:
    state: present
    apply: true
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ lookup('ansible.builtin.template', 'templates/alloy.yml') | from_yaml }}"

- name: Deploy kafka metrics configuration
  kubernetes.core.k8s:
    state: present
    apply: true
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ lookup('ansible.builtin.template', 'templates/strimzi/kafka-metrics.yml') | from_yaml }}"

- name: Deploy strimzi monitor customizations
  kubernetes.core.k8s:
    state: present
    apply: true
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ lookup('ansible.builtin.template', 'templates/strimzi/monitors.yml') | from_yaml_all | list }}"

- name: Deploy zalando monitor customizations
  kubernetes.core.k8s:
    state: present
    apply: true
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ lookup('ansible.builtin.template', 'templates/zalando/monitors.yml') | from_yaml_all | list }}"

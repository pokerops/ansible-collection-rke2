---
- name: Set global traefik facts
  ansible.builtin.set_fact:
    _traefik_class_private: "{{ _class_private }}"
    _traefik_class_public: "{{ _class_public }}"
    _traefik_classes: "{{ _class_list }}"
    _traefik_label_selector: "traefik.io/class"
    _traefik_label_values: "{{ _class_list }}"
    _traefik_deploy_private: true
    _traefik_deploy_public: "{{ _deploy_public | bool }}"
  vars:
    _deploy_public: "{{ rke2_ippool_public is defined and [rke2_ippool_public | default([])] | flatten | length > 0 }}"
    _class_private: traefik-private
    _class_public: traefik-public
    _class_list: "{{ [_class_private] + (_deploy_public | bool | ternary([_class_public], [])) }}"

- name: Deploy traefik private controller
  kubernetes.core.k8s:
    state: "{{ rke2_traefik_controller_deploy | bool | ternary('present', 'absent') }}"
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ _traefik_chart_application }}"
  vars:
    _traefik_chart_application: "{{ _traefik_chart_manifest | combine(_traefik_chart_overrides, recursive=True) }}"
    _traefik_chart_manifest: "{{ lookup('ansible.builtin.template', 'templates/traefik.yml' ) | from_yaml }}"
    _traefik_chart_class: "{{ _traefik_class_private }}"
    _traefik_chart_overrides:
      metadata:
        name: "{{ _traefik_chart_class }}"
      spec:
        destination:
          namespace: "{{ _traefik_chart_class }}"
        source:
          helm:
            valuesObject:
              ingressClass:
                isDefaultClass: "{{ rke2_traefik_controller_deploy | bool }}"
                name: "traefik-private"
              providers:
                kubernetesCRD:
                  ingressClass: "{{ _traefik_chart_class }}"
                kubernetesIngress:
                  ingressClass: "{{ _traefik_chart_class }}"
              gateway:
                annotations:
                  cert-manager.io/cluster-issuer: "{{ rke2_certmanager_issuer_name }}"
              service:
                annotations:
                  metallb.universe.tf/address-pool: "metallb-private"
  when: _traefik_deploy_private | bool

- name: Deploy traefik public controller
  kubernetes.core.k8s:
    state: "{{ rke2_traefik_controller_deploy | bool | ternary('present', 'absent') }}"
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ _traefik_chart_application }}"
  vars:
    _traefik_chart_application: "{{ _traefik_chart_manifest | combine(_traefik_chart_overrides, recursive=True) }}"
    _traefik_chart_class: "{{ _traefik_class_public }}"
    _traefik_chart_manifest: "{{ lookup('ansible.builtin.template', 'templates/traefik.yml' ) | from_yaml }}"
    _traefik_chart_overrides:
      metadata:
        name: "{{ _traefik_chart_class }}"
      spec:
        destination:
          namespace: "{{ _traefik_chart_class }}"
        source:
          helm:
            valuesObject:
              ingressClass:
                isDefaultClass: false
                name: "{{ _traefik_chart_class }}"
              providers:
                kubernetesCRD:
                  ingressClass: "{{ _traefik_chart_class }}"
                kubernetesIngress:
                  ingressClass: "{{ _traefik_chart_class }}"
              gateway:
                annotations:
                  cert-manager.io/cluster-issuer: "{{ rke2_certmanager_issuer_name }}"
              service:
                annotations:
                  metallb.universe.tf/address-pool: "metallb-public"
  when: _traefik_deploy_public | bool

- name: Deploy traefik admission policies
  kubernetes.core.k8s:
    state: "{{ rke2_traefik_controller_deploy | bool | ternary('present', 'absent') }}"
    kubeconfig: "{{ rke2_config_path }}"
    resource_definition: "{{ lookup('ansible.builtin.template', 'templates/traefik/vap.yml' ) | from_yaml_all | list }}"

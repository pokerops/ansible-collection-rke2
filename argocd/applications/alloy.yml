---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: alloy-operator
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: "0.7.1"
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true

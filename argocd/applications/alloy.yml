---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: alloy-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: alloy-operator
    repoURL: https://grafana.github.io/helm-charts
    targetRevision: "0.9.3"
    helm:
      valuesObject:
        serviceMonitor:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo's built-in retry for automated syncs (5 attempts, about 2.5m)
    # gives up on a repo-server restart, and an automated sync never
    # retries a failed revision.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true

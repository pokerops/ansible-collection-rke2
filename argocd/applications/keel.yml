---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keel
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    chart: keel
    repoURL: https://charts.keel.sh
    targetRevision: "1.2.2"
    helm:
      valuesObject:
        helmProvider:
          version: "v3"
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 128Mi
        polling:
          enabled: true
          defaultSchedule: "@every 5m"
  destination:
    server: https://kubernetes.default.svc
    namespace: keel-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

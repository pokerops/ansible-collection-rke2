---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reflector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  # Logs text, not JSON: its Serilog console sink can be switched to a JSON
  # formatter through ES_Serilog__* env overrides (v10.0.65), but every
  # event carrying an exception then comes out as invalid JSON split over
  # many lines (tested with Compact, RenderedCompact and core JsonFormatter).
  # The remap in vector/pipeline.j2.yml parses its text format instead.
  source:
    chart: reflector
    repoURL: https://emberstack.github.io/helm-charts
    targetRevision: "10.0.65"
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # Argo's built-in retry for automated syncs (5 attempts, about 2.5m)
    # gives up on a repo-server restart, and an automated sync never
    # retries a failed revision.
    retry:
      limit: 10
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
    syncOptions:
      - CreateNamespace=true
